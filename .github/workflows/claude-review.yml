# Required status `ai-review/opus` (AGENTS.md Law 8). Opus 5.5 reviews the
# checked-out PR with Claude Code, executes focused tests and throwaway probes,
# posts one GitHub review (summary + inline comments) followed by an `@codex`
# fix list comment, and sets the status. Open Required items carry across pushes.
# Fails closed: blocking verdict, API/run error, unparseable output, or a diff
# too large to review completely all yield `failure`; a crash leaves `pending`.
# Decision logic and its tests live in .github/pr-gate/ (docs/PR_REVIEW_GATE.md).

name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opus:
    # Drafts are held by human-gate; review once ready to save spend.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SKIP_COMPANION_VRM_DOWNLOAD: "true"

    steps:
      - name: Mark ai-review/opus pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: "pending",
              context: "ai-review/opus",
              description: "Opus review running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The reviewer executes PR code; keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (web)
        working-directory: web
        run: npm ci

      - name: Prepare review
        id: prep
        uses: actions/github-script@v7
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require("fs");
            const gate = require(`${process.env.GITHUB_WORKSPACE}/.github/pr-gate/verdict.cjs`);
            const fix = require(`${process.env.GITHUB_WORKSPACE}/.github/pr-gate/fixList.cjs`);
            const { BASE_SHA, HEAD_SHA, RUNNER_TEMP } = process.env;
            const issue_number = Number(process.env.PR_NUMBER);

            // Open Required items from the previous review, plus the author's thread replies.
            const issueComments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const priorState = fix.latestState(issueComments);
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              ...context.repo, pull_number: issue_number, per_page: 100,
            });
            fs.writeFileSync(`${RUNNER_TEMP}/ai-review-prior.json`, JSON.stringify({ priorState }));
            core.info(` 🎮 [ai-review] [prior-state] [${priorState ? `${priorState.open.length} open` : "unreadable"}]`);

            const { stdout } = await exec.getExecOutput(
              "git", ["diff", "--numstat", "--no-renames", "-z", `${BASE_SHA}...${HEAD_SHA}`], { silent: true });
            const numstat = stdout.split("\0").filter(Boolean).map((rec) => {
              const [additions, deletions, ...path] = rec.split("\t");
              return { path: path.join("\t"), additions: Number(additions) || 0, deletions: Number(deletions) || 0 };
            });
            const budget = gate.checkDiffBudget(numstat, gate.DEFAULT_BUDGET);
            fs.writeFileSync(`${RUNNER_TEMP}/ai-review-budget.json`, JSON.stringify(budget));
            core.info(` 🎮 [ai-review] [budget] [${budget.ok ? "ok" : budget.reason}: ${budget.reviewFiles.length} files]`);

            const fill = {
              "{{PR_NUMBER}}": process.env.PR_NUMBER,
              "{{PR_TITLE}}": process.env.PR_TITLE,
              "{{BASE_SHA}}": BASE_SHA,
              "{{HEAD_SHA}}": HEAD_SHA,
              "{{CHANGED_FILES}}": budget.reviewFiles.map((f) => `- \`${f}\``).join("\n") || "- (none)",
              "{{PRIOR_ITEMS}}": priorState
                ? fix.renderPriorItemsForPrompt(priorState.open, reviewComments)
                : "(prior review state unreadable; the gate will fail regardless)",
              // Last, so placeholders inside the author-supplied body stay literal.
              "{{PR_BODY}}": process.env.PR_BODY || "(empty)",
            };
            let prompt = fs.readFileSync(".github/pr-gate/review-prompt.md", "utf8");
            for (const [key, value] of Object.entries(fill)) prompt = prompt.replaceAll(key, () => value);

            const allowedTools = [
              "Read", "Glob", "Grep", "Write", "Edit",
              "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)",
              "Bash(npx vitest:*)", "Bash(cd web && npx vitest:*)", "Bash(npx tsx:*)", "Bash(npx tsc:*)",
              "Bash(node:*)", "Bash(mkdir:*)", "Bash(ls:*)",
            ].join(",");
            core.setOutput("budget_ok", String(budget.ok));
            core.setOutput("prompt", prompt);
            core.setOutput("claude_args", [
              "--model claude-opus-5-5",
              "--max-turns 80",
              `--allowedTools "${allowedTools}"`,
              `--disallowedTools "WebFetch,WebSearch"`,
              `--json-schema '${JSON.stringify(gate.VERDICT_SCHEMA)}'`,
            ].join(" "));

      - name: Opus review (Claude Code)
        id: claude
        if: steps.prep.outputs.budget_ok == 'true'
        # The publish step turns any failure here into a failing status.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: ${{ steps.prep.outputs.claude_args }}

      - name: Publish review and set ai-review/opus
        # Superseded runs are cancelled; their sha keeps `pending`.
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        with:
          script: |
            const fs = require("fs");
            const { HEAD_SHA, RUNNER_TEMP, CLAUDE_OUTCOME, CLAUDE_CONCLUSION, STRUCTURED_OUTPUT } = process.env;
            const readTemp = (name) => JSON.parse(fs.readFileSync(`${RUNNER_TEMP}/${name}`, "utf8"));
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const setStatus = (state, description) => github.rest.repos.createCommitStatus({
              ...context.repo, sha: HEAD_SHA, state, context: "ai-review/opus", description, target_url,
            });
            try {
              const gate = require(`${process.env.GITHUB_WORKSPACE}/.github/pr-gate/verdict.cjs`);
              const fix = require(`${process.env.GITHUB_WORKSPACE}/.github/pr-gate/fixList.cjs`);
              let budget;
              let priorState;
              try {
                budget = readTemp("ai-review-budget.json");
                priorState = readTemp("ai-review-prior.json").priorState;
              } catch (err) {
                core.warning(` 🎮 [ai-review] [prepare] [missing: ${err.message}]`);
                budget = { ok: false, reason: "Review preparation failed", reviewFiles: [] };
                priorState = null;
              }
              const conclusion = CLAUDE_OUTCOME === "success" ? CLAUDE_CONCLUSION : CLAUDE_OUTCOME || "not run";
              const evaluation = gate.evaluateReviewRun({
                conclusion, structuredOutput: STRUCTURED_OUTPUT, changedFiles: budget.reviewFiles, budget,
                priorOpen: priorState ? priorState.open : null,
              });

              const pull_number = context.payload.pull_request.number;
              const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number, per_page: 100 });
              const commentable = Object.fromEntries(files.map((f) => [f.filename, gate.commentableLines(f.patch)]));
              const post = (review) => github.rest.pulls.createReview({
                ...context.repo, pull_number, commit_id: HEAD_SHA, event: "COMMENT", body: review.body, comments: review.comments,
              });
              let posted = gate.buildReview(evaluation, commentable);
              let review;
              try {
                review = (await post(posted)).data;
              } catch (err) {
                // GitHub rejects the whole review if one inline anchor is invalid; fall back to summary-only.
                core.warning(` 🎮 [ai-review] [review] [inline rejected: ${err.message}]`);
                posted = gate.buildReview(evaluation, {});
                review = (await post(posted)).data;
              }

              // Fix list for @codex, linking each item to its thread; it also carries state to the next push.
              const reviewComments = await github.paginate(github.rest.pulls.listCommentsForReview, {
                ...context.repo, pull_number, review_id: review.id, per_page: 100,
              });
              const links = fix.linkThreads({
                findingsCount: evaluation.verdict ? evaluation.verdict.findings.length : 0,
                posted: posted.comments,
                inlineFindingIndexes: posted.inlineFindingIndexes,
                reviewComments,
                reviewUrl: review.html_url,
              });
              const plan = fix.planFixList({ evaluation, priorState, links, reviewUrl: review.html_url });
              await github.rest.issues.createComment({ ...context.repo, issue_number: pull_number, body: fix.renderFixList(plan) });
              core.info(` 🎮 [ai-review] [fix-list] [${plan.required.length} required, ${plan.deferrable.length} deferrable, ${plan.resolved.length} resolved]`);

              await setStatus(evaluation.state, evaluation.description);
              core.info(` 🎮 [ai-review] [status] [${evaluation.state}: ${evaluation.description}]`);
              if (evaluation.state !== "success") core.setFailed(evaluation.description);
            } catch (err) {
              core.error(` 🎮 [ai-review] [publish] [error: ${err.message}]`);
              await setStatus("failure", `Gate error: ${err.message}`.slice(0, 140));
              core.setFailed(err.message);
            }

# Hard gates for AGENTS.md Law 7 (and Law 1 where covered by Vitest).
# Fails the check run — does not auto-comment; see claude-review.yml for narrative flags.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    if: ${{ github.head_ref != 'codex/spelling-chart-core' && github.head_ref != 'codex/spelling-plumbing' }}
    runs-on: ubuntu-latest
    env:
      # Remove when GitHub Release `companion-vrms-v1` (see scripts/companion-vrms.manifest.json) ships all .vrm assets.
      SKIP_COMPANION_VRM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (web)
        working-directory: web
        run: npm ci

      - name: Install browser-test runtime
        run: npx playwright install --with-deps chromium

      - name: Build (root + web)
        run: npm run build

      - name: Test (Vitest root + web)
        run: npm run test

  spelling-core-acceptance:
    if: ${{ (github.head_ref == 'codex/spelling-chart-core' || github.head_ref == 'codex/spelling-plumbing') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/context/*
            /src/context/schemas/
            !.env*
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - name: Install dependencies without project lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3 esbuild
          npm ci --prefix web --ignore-scripts
          npm rebuild --prefix web esbuild
      - name: Install acceptance browser
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers" npx playwright install --with-deps chromium
      - name: Verify isolation and acceptance without network or credentials
        shell: bash
        run: |
          test ! -e src/context/reina
          test ! -e src/context/ila
          test ! -e .env
          mkdir -p "$RUNNER_TEMP/synthetic-home"
          sudo unshare --net env -i PATH="$PATH" HOME="$RUNNER_TEMP/synthetic-home" CI=true PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers" DOTENV_CONFIG_PATH=/dev/null bash -e -c '
            ip link set lo up
            node --test scripts/chart/reviewWorkflow.test.cjs
            npm run build
            node node_modules/vitest/vitest.mjs run src/engine/chartProfileDraft.test.ts src/engine/chartFoundation.test.ts src/engine/chartCommitOrder.test.ts src/engine/chartSpellingCore.test.ts src/engine/chartSpellingSchemas.test.ts src/engine/chartSpellingLoad.test.ts src/engine/chartKioskLifecycle.test.ts src/engine/chartSpellingReview.test.ts src/scripts/chartKioskAcceptance.test.ts src/engine/chartSpellingJourney.test.ts src/engine/chartSpellingRecovery.test.ts src/engine/chartSpellingProvider.test.ts src/engine/chartSpellingCutover.test.ts src/engine/chartSpellingAudio.test.ts src/server/chartSpellingRoutes.test.ts src/scripts/chartSpellingLaunch.test.ts src/scripts/chartSpellingBrowserAcceptance.test.ts src/server/kiosk-ready-route.test.ts src/engine/learningCycleRepository.test.ts src/engine/plannerOpusCompatibility.test.ts src/engine/assignmentPlanner.test.ts src/engine/experiencePlanner.test.ts src/engine/learningCycleRuntime.test.ts src/engine/spellingIntake.test.ts
            cd web
            node node_modules/vitest/vitest.mjs run src/tests/adventureRewardLayout.test.tsx src/tests/AdventureBoard.test.tsx src/hooks/tests/useChildExperiencePacket.test.tsx
          '

 for(var i=0;i<a.length;i++){var b=document.createElement("div");b.className="bay";var s=document.createElement("div");s.className="stack"+((cur.prev===2&&even&&!commit)||(commit&&even&&badIdx<0)?" on":"")+((commit&&badIdx===i)?" bad":"");

 var a=cells(),bad=-1;if(!ok){if(o.mode==="perBay"){bad=a.length-1}else{var mx=Math.max.apply(null,a),mn=Math.min.apply(null,a);if(mx!==mn){for(var i=0;i<a.length;i++)if(a[i]===mn)bad=i}else bad=0}}

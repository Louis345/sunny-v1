<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Skyglider Skip-Count Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1365px; height: 768px;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #ff9a5c 0%, #ff7e6b 25%, #ff6f91 45%, #6a4c93 80%, #2e2360 100%);
  }
  #sky {
    position: relative;
    width: 1365px; height: 768px;
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    filter: blur(1px);
  }
  .sun {
    position: absolute;
    top: 60px; left: 1080px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff2c4, #ffcf6b 60%, rgba(255,207,107,0));
    box-shadow: 0 0 60px 30px rgba(255,220,140,0.4);
  }
  .island {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 220px;
    text-align: center;
  }
  .island img {
    width: 100%;
  }
  #hint {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff7e6;
    font-size: 26px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    letter-spacing: 1px;
    font-weight: bold;
    z-index: 20;
  }
  #lanternSequence {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 22px;
    z-index: 20;
  }
  .lit-lantern {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6c9, #ffb400 70%);
    color: #6a3d00;
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 18px 6px rgba(255,180,0,0.55);
    border: 3px solid #ffe08a;
  }
  .arrow {
    color: #fff6c9;
    font-size: 30px;
    align-self: center;
  }
  #dock {
    position: absolute;
    left: 30px;
    bottom: 60px;
    width: 160px;
    height: 90px;
    background: linear-gradient(180deg, #7a5230, #4a3220);
    border-radius: 10px 10px 0 0;
  }
  #glider {
    position: absolute;
    left: 60px;
    bottom: 130px;
    width: 110px;
    height: 70px;
    z-index: 15;
    transition: none;
  }
  .platform-wrap {
    position: absolute;
    bottom: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    cursor: pointer;
    user-select: none;
  }
  .lilypad {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5ec6a6, #2c8f77 75%);
    border: 5px solid #1d5f4d;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    position: relative;
    transition: transform 0.15s ease;
  }
  .lantern-number {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6c9, #ffcf4d 70%);
    color: #6a3d00;
    font-size: 40px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #ffe08a;
  }
  .glow-pulse {
    animation: pulseGlow 1.1s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 25px 10px rgba(255, 220, 100, 0.5), 0 8px 18px rgba(0,0,0,0.35); transform: scale(1); }
    50% { box-shadow: 0 0 45px 22px rgba(255, 220, 100, 0.85), 0 8px 18px rgba(0,0,0,0.35); transform: scale(1.06); }
  }
  .wobble {
    animation: wobbleAnim 0.5s ease;
  }
  @keyframes wobbleAnim {
    0% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-14px) rotate(-6deg); }
    50% { transform: translateX(10px) rotate(4deg); }
    75% { transform: translateX(-6px) rotate(-2deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }
  #sparkleLayer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 14;
  }
  .sparkle {
    position: absolute;
    width: 8px; height: 8px;
    background: #fff3b0;
    border-radius: 50%;
    box-shadow: 0 0 8px 3px rgba(255,240,170,0.9);
  }
  #progressLabel {
    position: absolute;
    top: 690px;
    left: 40px;
    color: #fff3d6;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  #completeBanner {
    position: absolute;
    top: 320px;
    left: 50%;
    transform: translateX(-50%) scale(0.7);
    background: rgba(30, 20, 60, 0.85);
    color: #ffe9a8;
    padding: 30px 60px;
    border-radius: 20px;
    font-size: 42px;
    font-weight: bold;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    box-shadow: 0 0 40px rgba(255,220,140,0.6);
  }
</style>
</head>
<body>
<div id="sky">
  <div class="sun"></div>
  <div class="cloud" style="width:180px;height:60px;top:130px;left:80px;"></div>
  <div class="cloud" style="width:140px;height:50px;top:220px;left:500px;"></div>
  <div class="cloud" style="width:200px;height:65px;top:180px;left:900px;"></div>
  <div class="cloud" style="width:120px;height:40px;top:400px;left:300px;"></div>
  <div class="cloud" style="width:160px;height:55px;top:450px;left:700px;"></div>

  <div id="hint">Tap the platform that keeps counting!</div>
  <div id="lanternSequence"></div>

  <div class="island">
    <svg width="220" height="140" viewBox="0 0 220 140">
      <ellipse cx="110" cy="120" rx="100" ry="18" fill="#5a3a22"/>
      <ellipse cx="110" cy="105" rx="90" ry="24" fill="#7a5230"/>
      <ellipse cx="110" cy="85" rx="70" ry="20" fill="#4a8f5b"/>
    </svg>
  </div>

  <div id="dock"></div>

  <svg id="glider" viewBox="0 0 110 70">
    <ellipse cx="55" cy="45" rx="50" ry="20" fill="#f4a53c" stroke="#a85f1a" stroke-width="3"/>
    <ellipse cx="55" cy="30" rx="30" ry="16" fill="#ffe08a" stroke="#a85f1a" stroke-width="2"/>
    <circle cx="30" cy="45" r="6" fill="#3a3a3a"/>
    <circle cx="80" cy="45" r="6" fill="#3a3a3a"/>
  </svg>

  <div id="sparkleLayer"></div>
  <div id="progressLabel">Gap 1 of 3</div>
  <div id="completeBanner">🎉 Cargo Island Reached! 🎉</div>
</div>

<audio id="chimeSound" preload="auto" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_bb630cc098.mp3?filename=success-1-6297.mp3"></audio>
<audio id="thudSound" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_0625c1539c.mp3?filename=negative_beeps-6008.mp3"></audio>
<audio id="fanfareSound" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0c6ff1bab.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>

<script>
const levels = [
  { seq: [5,10,15], answer: 20, distractors: [18,25] },
  { seq: [2,4,6], answer: 8, distractors: [7,10] },
  { seq: [10,20,30], answer: 40, distractors: [35,50] }
];

let levelIndex = 0;
const platformXPositions = [420, 700, 980]; // x centers for the three platform slots across the gap
const gliderStartLeft = 60;

const gliderEl = document.getElementById('glider');
const dockWidth = 160;
const lanternSeqEl = document.getElementById('lanternSequence');
const progressLabel = document.getElementById('progressLabel');
const completeBanner = document.getElementById('completeBanner');
const chimeSound = document.getElementById('chimeSound');
const thudSound = document.getElementById('thudSound');
const fanfareSound = document.getElementById('fanfareSound');
const skyEl = document.getElementById('sky');

let platformEls = [];
let currentGliderLeft = 60;

function renderLanternSequence(seq) {
  lanternSeqEl.innerHTML = '';
  seq.forEach((n, i) => {
    const lit = document.createElement('div');
    lit.className = 'lit-lantern';
    lit.textContent = n;
    lanternSeqEl.appendChild(lit);
    if (i < seq.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      lanternSeqEl.appendChild(arrow);
    }
  });
  const arrow2 = document.createElement('div');
  arrow2.className = 'arrow';
  arrow2.textContent = '→';
  lanternSeqEl.appendChild(arrow2);
  const q = document.createElement('div');
  q.className = 'lit-lantern';
  q.style.background = 'radial-gradient(circle at 35% 30%, #ffe9e0, #ff8a65 70%)';
  q.textContent = '?';
  lanternSeqEl.appendChild(q);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPlatforms(level, firstLoad) {
  platformEls.forEach(p => p.remove());
  platformEls = [];

  const options = shuffle([level.answer, ...level.distractors]);

  options.forEach((val, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'platform-wrap';
    wrap.style.left = (platformXPositions[i] - 70) + 'px';
    // slight vertical stagger for organic float feel
    const bob = (i % 2 === 0) ? 0 : 22;
    wrap.style.bottom = (190 + bob) + 'px';

    const pad = document.createElement('div');
    pad.className = 'lilypad';
    const isCorrect = (val === level.answer);
    if (isCorrect && firstLoad) {
      pad.classList.add('glow-pulse');
    }

    const num = document.createElement('div');
    num.className = 'lantern-number';
    num.textContent = val;
    pad.appendChild(num);
    wrap.appendChild(pad);
    skyEl.appendChild(wrap);
    platformEls.push(wrap);

    wrap.addEventListener('click', () => handleTap(isCorrect, wrap, level));
    wrap.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(isCorrect, wrap, level); }, {passive:false});
  });
}

function spawnSparkles(x, y) {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 60;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    document.getElementById('sparkleLayer').appendChild(s);
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    s.animate([
      { transform: 'translate(0,0)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
    ], { duration: 700 + Math.random()*300, easing: 'ease-out' });
    setTimeout(() => s.remove(), 1000);
  }
}

function handleTap(isCorrect, wrap, level) {
  // remove glow-pulse from all in case still present
  platformEls.forEach(p => p.querySelector('.lilypad').classList.remove('glow-pulse'));

  if (isCorrect) {
    chimeSound.currentTime = 0; chimeSound.play().catch(()=>{});
    const targetLeft = parseInt(wrap.style.left) + 30;
    const gliderRect = gliderEl.getBoundingClientRect();

    gliderEl.style.transition = 'left 0.55s cubic-bezier(.34,1.56,.64,1), bottom 0.55s ease';
    const bottomVal = wrap.style.bottom;
    gliderEl.style.left = targetLeft + 'px';
    gliderEl.style.bottom = (parseInt(bottomVal) + 40) + 'px';

    setTimeout(() => {
      spawnSparkles(targetLeft + 55, 768 - (parseInt(bottomVal) + 70));
    }, 250);

    setTimeout(() => {
      levelIndex++;
      if (levelIndex < levels.length) {
        progressLabel.textContent = 'Gap ' + (levelIndex + 1) + ' of ' + levels.length;
        loadLevel(levelIndex);
      } else {
        finishRun();
      }
    }, 650);
  } else {
    thudSound.currentTime = 0; thudSound.play().catch(()=>{});
    gliderEl.classList.remove('wobble');
    void gliderEl.offsetWidth;
    gliderEl.classList.add('wobble');
    wrap.style.transform = 'scale(0.94)';
    setTimeout(() => { wrap.style.transform = 'scale(1)'; }, 200);
  }
}

function loadLevel(idx) {
  const level = levels[idx];
  renderLanternSequence(level.seq);
  buildPlatforms(level, true);
}

function finishRun() {
  document.getElementById('hint').textContent = 'You made it across the sky!';
  fanfareSound.currentTime = 0; fanfareSound.play().catch(()=>{});
  completeBanner.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
  completeBanner.style.opacity = '1';
  completeBanner.style.transform = 'translateX(-50%) scale(1)';
  // gentle confetti burst near island
  for (let i = 0; i < 30; i++) {
    setTimeout(() => spawnSparkles(1150 + Math.random()*100, 600 + Math.random()*80), i * 40);
  }
}

// init
gliderEl.style.left = gliderStartLeft + 'px';
gliderEl.style.bottom = '130px';
loadLevel(0);
</script>
</body>
</html>

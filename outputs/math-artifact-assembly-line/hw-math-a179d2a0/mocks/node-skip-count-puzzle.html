<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harbor Block Builder: Skip Count</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 1365px; height: 768px; overflow: hidden;
    background: linear-gradient(180deg, #1a3a5c 0%, #2c5580 40%, #3d6d92 65%, #4a7a9a 100%);
    font-family: 'Georgia', serif;
    user-select: none;
  }
  #sky {
    position: absolute; top: 0; left: 0; width: 100%; height: 500px;
  }
  .gull {
    position: absolute; font-size: 22px; color: #eef; opacity: 0.85;
  }
  #dock {
    position: absolute; bottom: 0; left: 0; width: 1365px; height: 260px;
    background: repeating-linear-gradient(90deg, #7a4a28, #7a4a28 60px, #6b3f22 60px, #6b3f22 64px);
    box-shadow: 0 -6px 30px rgba(0,0,0,0.4) inset;
  }
  #dock::before {
    content: '';
    position: absolute; top: -12px; left: 0; width: 100%; height: 12px;
    background: repeating-linear-gradient(90deg, #8a5830, #8a5830 60px, #6b3f22 60px, #6b3f22 64px);
  }
  .crane {
    position: absolute; bottom: 260px; width: 60px; height: 180px;
    transform-origin: bottom center;
  }
  .crane-body { width: 8px; height: 160px; background: #5a5a5a; margin: 0 auto; }
  .crane-arm { position: absolute; top: 10px; left: -30px; width: 68px; height: 6px; background: #5a5a5a; }
  #crane1 { left: 60px; }
  #crane2 { left: 1200px; }

  #title {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    color: #ffe9b0; font-size: 26px; text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    letter-spacing: 1px;
  }
  #prompt {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    color: #fff3d6; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    background: rgba(30,30,40,0.35); padding: 8px 24px; border-radius: 20px;
  }

  #frame-area {
    position: absolute; top: 300px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 26px; padding: 24px 34px;
    background: linear-gradient(180deg, #8a5a30, #6b4322);
    border: 6px solid #4a3018;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,220,150,0.1);
  }
  .slot {
    width: 90px; height: 90px; border-radius: 12px;
    background: radial-gradient(circle at 30% 30%, #1e2a3a, #0d141e);
    border: 3px dashed #ffd98c;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #ffe9b0; font-weight: bold;
    box-shadow: 0 0 18px rgba(255, 217, 140, 0.35) inset;
    position: relative;
  }
  .slot.filled {
    border: 3px solid #ffd98c;
    background: radial-gradient(circle at 30% 30%, #6a4a1e, #4a3010);
    box-shadow: 0 0 30px rgba(255, 200, 90, 0.85);
  }
  .slot .ghost-reflection {
    position: absolute; font-size: 34px; color: rgba(255,240,200,0.25);
  }

  #blocks-area {
    position: absolute; top: 500px; left: 0; width: 1365px; height: 220px;
  }
  .block {
    position: absolute; width: 92px; height: 92px; border-radius: 14px;
    background: linear-gradient(145deg, #ffdd8a, #d99a3a);
    border: 3px solid #a5661a;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: bold; color: #4a2e0a;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
  }
  .block.hint {
    box-shadow: 0 0 30px 10px rgba(255, 245, 160, 0.85), 0 6px 14px rgba(0,0,0,0.4);
  }

  #vault {
    position: absolute; top: 300px; left: 50%; transform: translateX(-50%);
    padding: 24px 34px; font-size: 28px; color: #ffe9b0;
    text-align: center; opacity: 0; pointer-events: none;
  }

  #flash {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: white; opacity: 0; pointer-events: none;
  }
</style>
</head>
<body>

<div id="flash"></div>
<div id="sky">
  <div class="gull" style="top:60px; left:200px;">〜</div>
  <div class="gull" style="top:100px; left:900px;">〜</div>
  <div class="gull" style="top:40px; left:1100px;">〜</div>
</div>

<div id="title">Harbor Block Builder: Skip Count</div>
<div id="prompt">Skip count by 5s: 5, 10, 15, __?</div>

<div class="crane" id="crane1">
  <div class="crane-arm"></div>
  <div class="crane-body"></div>
</div>
<div class="crane" id="crane2">
  <div class="crane-arm"></div>
  <div class="crane-body"></div>
</div>

<div id="dock"></div>

<div id="frame-area">
  <div class="slot" id="slot0">5</div>
  <div class="slot" id="slot1">10</div>
  <div class="slot" id="slot2">15</div>
  <div class="slot" id="slot3"></div>
</div>

<div id="blocks-area">
  <div class="block" id="opt-a" data-correct="true" style="left:260px; top:40px;">20</div>
  <div class="block" id="opt-b" data-correct="false" style="left:640px; top:100px;">18</div>
  <div class="block" id="opt-c" data-correct="false" style="left:1000px; top:50px;">25</div>
</div>

<div id="vault">🔒 Vault Sealed! Great skip counting! 🎉</div>

<script>
  // Ambient sound (subtle, using Howler with generated silent fallback - using free CC0 tones via data URI would be heavy, so we use simple oscillator clicks instead)
  function playTone(freq, duration, type='sine', vol=0.3) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  // idle bob animation for blocks
  const blocks = document.querySelectorAll('.block');
  blocks.forEach((b, i) => {
    gsap.to(b, {
      y: '+=14',
      duration: 1.4 + i * 0.2,
      repeat: -1,
      yoyo: true,
      ease: 'sine.inOut'
    });
  });

  // gentle crane nod idle
  gsap.to('#crane1', { rotation: 2, duration: 2, repeat: -1, yoyo: true, transformOrigin: 'bottom center', ease:'sine.inOut' });
  gsap.to('#crane2', { rotation: -2, duration: 2.3, repeat: -1, yoyo: true, transformOrigin: 'bottom center', ease:'sine.inOut' });

  // Hint glow on correct block + ghost reflection in target slot
  const correctBlock = document.getElementById('opt-a');
  const targetSlot = document.getElementById('slot3');

  gsap.to(correctBlock, {
    boxShadow: '0 0 40px 14px rgba(255,245,160,0.95), 0 6px 14px rgba(0,0,0,0.4)',
    duration: 0.9,
    repeat: -1,
    yoyo: true,
    ease: 'sine.inOut'
  });
  correctBlock.classList.add('hint');

  const ghost = document.createElement('div');
  ghost.className = 'ghost-reflection';
  ghost.textContent = '20';
  targetSlot.appendChild(ghost);
  gsap.to(ghost, {
    opacity: 0.6,
    duration: 1,
    repeat: -1,
    yoyo: true,
    ease: 'sine.inOut'
  });

  let solved = false;

  function bounceBack(block) {
    const origLeft = block.style.left;
    const origTop = block.style.top;
    gsap.to(block, {
      x: 0, y: 0,
      duration: 0.1,
      onStart: () => {
        gsap.fromTo(block, { scale: 1 }, {
          scale: 0.85,
          duration: 0.12,
          yoyo: true,
          repeat: 1,
          ease: 'power1.inOut'
        });
      }
    });
    playTone(140, 0.25, 'sine', 0.25);
  }

  function handleTap(e) {
    if (solved) return;
    const block = e.currentTarget;
    const correct = block.dataset.correct === 'true';

    if (correct) {
      solved = true;
      blocks.forEach(b => gsap.killTweensOf(b));
      gsap.killTweensOf(correctBlock);

      const blockRect = block.getBoundingClientRect();
      const slotRect = targetSlot.getBoundingClientRect();
      const dx = slotRect.left - blockRect.left;
      const dy = slotRect.top - blockRect.top;

      gsap.to(block, {
        x: dx, y: dy,
        scale: 0.95,
        duration: 0.55,
        ease: 'back.out(1.7)',
        onComplete: () => {
          block.style.visibility = 'hidden';
          targetSlot.textContent = '20';
          targetSlot.classList.add('filled');

          // flash
          gsap.fromTo('#flash', { opacity: 0 }, { opacity: 0.6, duration: 0.08, yoyo: true, repeat: 1 });
          playTone(660, 0.15, 'triangle', 0.4);
          setTimeout(() => playTone(880, 0.2, 'triangle', 0.35), 100);

          // frame glow pulse
          gsap.fromTo('#frame-area', { boxShadow: '0 8px 24px rgba(0,0,0,0.5)' },
            { boxShadow: '0 0 60px rgba(255,210,120,0.9)', duration: 0.4, yoyo: true, repeat: 1 });

          // cranes nod approvingly (bigger nod)
          gsap.to('#crane1', { rotation: 12, duration: 0.3, yoyo: true, repeat: 3, ease: 'sine.inOut' });
          gsap.to('#crane2', { rotation: -12, duration: 0.3, yoyo: true, repeat: 3, ease: 'sine.inOut' });

          // seal vault after short pause
          setTimeout(() => {
            playTone(220, 0.5, 'sawtooth', 0.3);
            setTimeout(() => playTone(440, 0.6, 'sine', 0.3), 150);
            gsap.to('#frame-area', {
              scale: 1.05,
              duration: 0.3,
              yoyo: true,
              repeat: 1,
              ease: 'power2.inOut'
            });
            gsap.to('#vault', { opacity: 1, duration: 0.6, delay: 0.2 });
          }, 700);
        }
      });

      // remove other blocks' idle bob & fade slightly
      blocks.forEach(b => {
        if (b !== block) {
          gsap.to(b, { opacity: 0.35, duration: 0.4 });
        }
      });

    } else {
      bounceBack(block);
    }
  }

  blocks.forEach(b => {
    b.addEventListener('click', handleTap);
    b.addEventListener('touchstart', function(e){ e.preventDefault(); handleTap(e); }, {passive:false});
  });
</script>

</body>
</html>

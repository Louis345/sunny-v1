<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Skyharbor Delivery Dash</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:1365px; height:768px; overflow:hidden;
    font-family:'Trebuchet MS', Arial, sans-serif;
    background: linear-gradient(180deg, #ffd98a 0%, #ffb862 25%, #7ec8e3 55%, #4a9fc4 100%);
  }
  #sun {
    position:absolute; top:40px; left:1150px; width:120px; height:120px;
    border-radius:50%;
    background: radial-gradient(circle, #fff6d0, #ffdf7e 60%, #ffca4d);
    box-shadow: 0 0 60px 20px rgba(255,220,120,0.6);
  }
  #dock {
    position:absolute; bottom:0; left:0; width:1365px; height:180px;
    background: linear-gradient(180deg, #b98a55, #8a6236);
    border-top: 8px solid #6b4a26;
  }
  #dock:before {
    content:''; position:absolute; top:0; left:0; width:100%; height:100%;
    background-repeat: repeat-x;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 4px, transparent 4px 60px);
  }
  #water {
    position:absolute; bottom:180px; left:0; width:1365px; height:170px;
    background: linear-gradient(180deg, #6cc3e0, #2f7fa8);
  }

  #banner {
    position:absolute; top:0; left:50%; transform:translateX(-50%) translateY(-140px);
    width:900px; background:#fff; border:6px solid #2b4a6b; border-radius:16px;
    padding:18px 30px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.25);
    z-index:20;
  }
  #banner h1 {
    font-size:22px; color:#1e3350; margin-bottom:6px; letter-spacing:0.5px;
  }
  #banner p {
    font-size:26px; color:#123; font-weight:bold;
  }

  #glider {
    position:absolute; top:-150px; left:100px; width:180px; z-index:15;
  }
  #glider svg { width:100%; display:block; }

  #cargoArea {
    position:absolute; bottom:190px; left:0; width:1365px; height:300px;
    display:flex; justify-content:center; align-items:flex-end; gap:30px;
    z-index:10;
  }

  .box {
    width:110px; height:90px; border-radius:8px;
    background: linear-gradient(180deg,#e0a95c,#b9793a);
    border:4px solid #7a4d20;
    position:relative;
    opacity:0; transform:translateY(-300px);
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.2);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:4px; padding:6px;
  }
  .pencil {
    width:10px; height:60px; border-radius:3px;
    background: linear-gradient(90deg,#ffe08a,#f4c542);
    border:1px solid #a8791e;
    position:relative;
  }
  .pencil:before {
    content:''; position:absolute; top:-8px; left:1px; width:6px; height:8px;
    background:#e8b04a; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  #stampWord {
    position:absolute; top:40%; left:50%; transform:translate(-50%,-50%) scale(0);
    font-size:70px; font-weight:900; color:#1f7a3d; text-shadow:2px 2px 0 #fff;
    z-index:30; letter-spacing:4px;
  }

  #tiles {
    position:absolute; bottom:210px; left:50%; transform:translateX(-50%);
    display:flex; gap:40px; z-index:25;
  }
  .tile {
    width:130px; height:110px; border-radius:18px;
    background: linear-gradient(180deg,#ffffff,#dbe9ff);
    border:5px solid #3b6ea5;
    font-size:46px; font-weight:bold; color:#20334f;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 8px 0 #274b74, 0 12px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s;
    user-select:none;
  }
  .tile:active { transform:translateY(4px); box-shadow:0 4px 0 #274b74; }
  .tile.glow {
    animation: glowpulse 1.4s infinite ease-in-out;
  }
  @keyframes glowpulse {
    0%,100% { box-shadow:0 8px 0 #274b74, 0 0 15px 4px rgba(255,230,120,0.4); }
    50% { box-shadow:0 8px 0 #274b74, 0 0 30px 10px rgba(255,230,120,0.9); }
  }

  #stockpile {
    position:absolute; bottom:190px; right:60px; width:220px; height:150px;
    z-index:8;
  }
  .stockBox {
    position:absolute; width:50px; height:40px; border-radius:6px;
    background: linear-gradient(180deg,#e0a95c,#b9793a);
    border:3px solid #7a4d20;
    opacity:0;
  }

  #progress {
    position:absolute; top:20px; left:20px; z-index:20;
    background:rgba(255,255,255,0.85); border-radius:12px; padding:10px 18px;
    font-size:20px; font-weight:bold; color:#1e3350;
    border:3px solid #2b4a6b;
  }

  #chime {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:40px; color:#a33; opacity:0; z-index:30; font-weight:bold;
  }
</style>
</head>
<body>

<div id="sun"></div>
<div id="water"></div>
<div id="dock"></div>

<div id="progress">Deliveries logged: 0 / 2</div>

<div id="banner">
  <h1>📦 Incoming Shipment</h1>
  <p id="promptText">Mrs. K puts 5 pencils in each of 4 boxes. How many pencils are there in all?</p>
</div>

<div id="glider">
  <svg viewBox="0 0 200 100">
    <ellipse cx="100" cy="60" rx="90" ry="20" fill="#e85d4b"/>
    <ellipse cx="100" cy="60" rx="70" ry="12" fill="#ffcf4a"/>
    <polygon points="20,60 0,40 40,55" fill="#c94433"/>
    <polygon points="180,60 200,40 160,55" fill="#c94433"/>
    <circle cx="100" cy="60" r="14" fill="#2b4a6b"/>
  </svg>
</div>

<div id="cargoArea"></div>
<div id="stampWord">DELIVERED!</div>
<div id="chime">✗</div>

<div id="tiles"></div>

<div id="stockpile"></div>

<script>
const items = [
  {
    prompt: "Mrs. K puts 5 pencils in each of 4 boxes. How many pencils are there in all?",
    groups: 4, perGroup: 5,
    options: [ {label:"20",correct:true}, {label:"9",correct:false}, {label:"25",correct:false} ]
  },
  {
    prompt: "There are 3 rows of 10 stars. How many stars are there?",
    groups: 3, perGroup: 10,
    options: [ {label:"30",correct:true}, {label:"13",correct:false}, {label:"7",correct:false} ]
  }
];

let currentItem = 0;
let deliveries = 0;
let stockCount = 0;
let locked = false;

const cargoArea = document.getElementById('cargoArea');
const tilesEl = document.getElementById('tiles');
const promptText = document.getElementById('promptText');
const glider = document.getElementById('glider');
const stampWord = document.getElementById('stampWord');
const chime = document.getElementById('chime');
const progress = document.getElementById('progress');
const stockpile = document.getElementById('stockpile');

function shuffle(arr){
  let a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildCargo(item){
  cargoArea.innerHTML = '';
  const maxBoxes = 6;
  const boxCount = Math.min(item.groups, maxBoxes);
  const boxWidth = item.perGroup >= 8 ? 140 : 110;
  for(let i=0;i<boxCount;i++){
    const box = document.createElement('div');
    box.className = 'box';
    if(boxWidth===140) box.style.width='140px';
    const pencilCount = item.perGroup;
    const pencilWidth = pencilCount > 6 ? 6 : 10;
    for(let p=0;p<pencilCount;p++){
      const pen = document.createElement('div');
      pen.className = 'pencil';
      pen.style.width = pencilWidth+'px';
      pen.style.height = (pencilCount>6? 45:60)+'px';
      box.appendChild(pen);
    }
    cargoArea.appendChild(box);
  }
}

function animateDrop(){
  const boxes = cargoArea.querySelectorAll('.box');
  gsap.set(glider, {x:-100, y:0, rotation:0});
  gsap.to(glider, {
    duration:1.4, x:900, y:60, ease:"power1.inOut",
    onComplete: () => {
      gsap.to(glider, {duration:0.6, x:1300, y:-40, ease:"power1.in"});
    }
  });
  boxes.forEach((box,i) => {
    gsap.to(box, {
      opacity:1, y:0, duration:0.6, delay:0.5 + i*0.18,
      ease:"bounce.out"
    });
  });
}

function buildTiles(item){
  tilesEl.innerHTML = '';
  const shuffled = shuffle(item.options);
  shuffled.forEach(opt => {
    const tile = document.createElement('div');
    tile.className = 'tile glow';
    tile.textContent = opt.label;
    tile.dataset.correct = opt.correct;
    tile.addEventListener('click', () => onTileTap(tile, opt.correct));
    tile.addEventListener('touchstart', (e) => { e.preventDefault(); onTileTap(tile, opt.correct); }, {passive:false});
    tilesEl.appendChild(tile);
  });
}

function onTileTap(tile, correct){
  if(locked) return;
  if(correct){
    locked = true;
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('glow'));
    gsap.fromTo(stampWord, {scale:0, opacity:0}, {scale:1, opacity:1, duration:0.35, ease:"back.out(3)",
      onComplete: () => {
        gsap.to(stampWord, {delay:0.6, opacity:0, scale:0.7, duration:0.4});
      }
    });
    growStockpile();
    setTimeout(() => {
      deliveries++;
      progress.textContent = "Deliveries logged: " + deliveries + " / 2";
      if(deliveries >= 2){
        celebrateFinish();
      } else {
        nextItem();
      }
    }, 1400);
  } else {
    gsap.to(cargoArea, {
      x: -12, duration:0.08, yoyo:true, repeat:5, ease:"power1.inOut",
      onComplete: () => gsap.set(cargoArea, {x:0})
    });
    chime.style.left = tile.getBoundingClientRect().left + tile.offsetWidth/2 + 'px';
    chime.style.top = tile.getBoundingClientRect().top - 20 + 'px';
    chime.style.transform = 'translate(-50%,-50%)';
    gsap.fromTo(chime, {opacity:1, scale:1.2}, {opacity:0, scale:0.6, duration:0.9});
  }
}

function growStockpile(){
  const box = document.createElement('div');
  box.className = 'stockBox';
  const row = Math.floor(stockCount/4);
  const col = stockCount % 4;
  box.style.left = (col*55)+'px';
  box.style.bottom = (row*45)+'px';
  stockpile.appendChild(box);
  gsap.to(box, {opacity:1, duration:0.5, delay:0.3});
  stockCount++;
}

function nextItem(){
  currentItem++;
  const item = items[currentItem];
  promptText.textContent = item.prompt;
  locked = false;
  cargoArea.innerHTML = '';
  buildCargo(item);
  buildTiles(item);
  setTimeout(animateDrop, 300);
}

function celebrateFinish(){
  promptText.textContent = "All shipments delivered! Great work today!";
  tilesEl.innerHTML = '';
  gsap.to(glider, {x:600, y:-80, duration:1, ease:"power1.out",
    onComplete: () => {
      gsap.to(glider, {
        duration:1.6, motionPath:{
          path:[{x:600,y:-80},{x:800,y:-180},{x:1000,y:-80},{x:800,y:20},{x:600,y:-80}]
        }, ease:"sine.inOut"
      });
    }
  });
}

// init
buildCargo(items[0]);
buildTiles(items[0]);
setTimeout(animateDrop, 500);
</script>

</body>
</html>

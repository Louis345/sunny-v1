<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1365, initial-scale=1">
<title>The Signal Lantern Workshop</title>
<style>
  :root{
    --walnut:#5d3f28; --walnut-dark:#3c281a; --brass:#c9a227; --brass-lt:#e6c766;
    --cream:#f6efe1; --ink:#2b1d12; --teal:#2f8f8a; --coral:#d2694a; --slate:#4f6b8a;
    --parchment:#efe3c8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#1c130d;overflow:hidden;
    font-family:"Segoe UI",Nunito,"Trebuchet MS",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  #fit{position:absolute;left:50%;top:50%;transform-origin:center center;}
  #stage{position:relative;width:1365px;height:768px;overflow:hidden;
    background:
      radial-gradient(1200px 500px at 50% 0%, #6d4a2e 0%, #4a3120 60%, #33210f 100%);
    color:var(--cream);}
  .grain{position:absolute;inset:0;opacity:.25;
    background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, rgba(255,255,255,.03) 2px 5px);
    pointer-events:none;}
  #dusk{position:absolute;right:56px;top:70px;width:250px;height:180px;border-radius:8px;
    background:#241708;border:10px solid #3a2716;box-shadow:inset 0 0 26px rgba(0,0,0,.7);
    transition:background 1200ms ease;}
  #dusk .mullion{position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;background:#3a2716;}
  #dusk .mullion2{position:absolute;top:50%;left:0;right:0;height:8px;margin-top:-4px;background:#3a2716;}
  #dusk.open{background:linear-gradient(#5b4a86,#c07a4e 60%,#e2a95f);}
  #bench{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#4a3120,#2e1e10);
    border-top:6px solid #6a4a2e;}

  /* top bar */
  #topbar{position:relative;z-index:5;height:60px;display:flex;align-items:center;
    justify-content:space-between;padding:0 22px;}
  #shelf{display:flex;gap:16px;align-items:flex-end;}
  .slot{width:34px;height:44px;border-radius:6px 6px 4px 4px;border:3px solid #7a5c37;
    background:#3a2716;position:relative;opacity:.55;}
  .slot .glass{position:absolute;left:4px;right:4px;top:8px;bottom:8px;border-radius:3px;background:#2b1d12;}
  .slot.hung{opacity:1;border-color:var(--brass);}
  .slot.lit .glass{background:radial-gradient(circle,#ffd98a,#e0a23c);}
  .chip{background:rgba(246,239,225,.10);border:2px solid rgba(246,239,225,.5);
    color:var(--cream);border-radius:999px;padding:12px 20px;font-size:20px;cursor:pointer;
    min-height:48px;display:flex;align-items:center;}
  .chip:active{background:rgba(246,239,225,.22);}
  .chiprow{display:flex;gap:14px;align-items:center;}

  /* main */
  #main{position:relative;z-index:4;height:708px;padding:4px 24px 8px 24px;}
  .screen{display:none;height:100%;flex-direction:column;align-items:center;}
  .screen.on{display:flex;}

  .sentence{font-size:30px;line-height:1.25;text-align:center;color:var(--cream);
    max-width:1060px;margin:2px 0 6px 0;font-weight:600;}
  .prompt{font-size:29px;line-height:1.25;text-align:center;color:#ffe9c0;max-width:1120px;margin:6px 0;}
  .big-text .sentence{font-size:38px;}
  .big-text .prompt{font-size:36px;}

  .lantern{position:relative;transition:transform 600ms cubic-bezier(.4,0,.2,1),opacity 600ms ease;}
  .lantern.rise{transform:translateY(-460px) scale(.28);opacity:0;}
  .cap{height:16px;margin:0 60px;border-radius:8px 8px 0 0;background:linear-gradient(var(--brass-lt),var(--brass));}
  .ring{width:26px;height:14px;border:5px solid var(--brass);border-bottom:none;border-radius:14px 14px 0 0;margin:0 auto -2px auto;}
  .glass{background:var(--cream);border:9px solid var(--brass);border-radius:12px;
    box-shadow:0 8px 26px rgba(0,0,0,.45), inset 0 0 0 4px #fffdf6;
    padding:18px 26px;display:flex;align-items:center;justify-content:center;}
  .base{height:14px;margin:0 60px;border-radius:0 0 8px 8px;background:linear-gradient(var(--brass),#8d6f16);}

  /* stimuli */
  .clusterRow{display:flex;gap:56px;align-items:center;}
  .cluster{display:grid;grid-template-columns:repeat(3,44px);gap:10px;}
  .dot{width:44px;height:44px;border-radius:50%;background:var(--teal);}
  .arr{display:flex;flex-direction:column;gap:10px;}
  .arrRow{display:flex;gap:9px;}
  .sq{width:44px;height:44px;border-radius:6px;background:var(--coral);}
  .grpRow{display:flex;gap:52px;align-items:center;}
  .grp{display:flex;gap:10px;}
  .gitem{width:40px;height:40px;border-radius:50%;background:var(--slate);}
  .tagWrap{display:flex;flex-direction:column;gap:16px;align-items:center;}
  .tag{display:flex;align-items:center;gap:18px;background:var(--parchment);color:var(--ink);
    border:4px solid #b99a5e;border-radius:12px;padding:14px 22px;width:800px;}
  .tagName{font-size:30px;font-weight:800;background:#b99a5e;color:#fff;border-radius:8px;
    width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .tagText{font-size:27px;line-height:1.2;}
  .big-text .tagText{font-size:32px;}

  /* response */
  .fields{display:flex;gap:34px;justify-content:center;align-items:flex-end;margin-top:4px;}
  .field{background:rgba(0,0,0,.22);border:4px solid rgba(201,162,39,.55);border-radius:14px;
    padding:8px 16px 12px 16px;min-width:240px;cursor:pointer;text-align:center;}
  .field.active{border-color:var(--brass-lt);background:rgba(201,162,39,.18);}
  .field .flabel{font-size:21px;color:#ffe9c0;margin-bottom:6px;}
  .field .fbox{height:74px;background:var(--cream);color:var(--ink);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;}
  .field .fbox.empty{color:#b9ac96;font-size:30px;font-weight:600;}
  .field .fbox.ns{font-size:26px;font-weight:700;color:#5a5245;}

  .strip{display:flex;gap:11px;justify-content:center;align-items:center;flex-wrap:nowrap;margin-top:4px;}
  .num{width:74px;height:74px;border-radius:12px;background:var(--cream);color:var(--ink);
    font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:3px solid #d8c9ae;}
  .num:active{transform:scale(.94);background:#e9dfc9;}
  .nstag{min-width:172px;height:74px;border-radius:12px;background:#9d968a;color:#fff;
    font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0 16px;text-align:center;border:3px solid #7e786e;}
  .nstag:active{transform:scale(.96);}
  .inlineField{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:nowrap;}

  .cards{display:flex;gap:18px;justify-content:center;flex-wrap:nowrap;margin-top:6px;}
  .card{background:var(--parchment);color:var(--ink);border:4px solid #b99a5e;border-radius:14px;
    min-width:238px;height:86px;display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:800;cursor:pointer;padding:0 12px;text-align:center;}
  .card.sel{border-color:var(--brass);box-shadow:0 0 0 5px rgba(201,162,39,.55);background:#f7ecd4;}
  .card:active{transform:scale(.98);}
  .card.ns{background:#9d968a;color:#fff;border-color:#7e786e;font-size:24px;min-width:210px;}
  .cardsub{display:flex;justify-content:center;margin-top:12px;}

  .commitRow{display:flex;justify-content:center;align-items:center;margin-top:10px;}
  #lightBtn{background:linear-gradient(var(--brass-lt),var(--brass));color:#3a2b06;font-size:30px;
    font-weight:900;border-radius:14px;padding:0 54px;height:72px;display:flex;align-items:center;
    cursor:pointer;border:4px solid #8d6f16;}
  #lightBtn.off{filter:grayscale(.85);opacity:.5;cursor:default;}

  /* Pip */
  #pip{position:absolute;left:18px;bottom:12px;z-index:6;display:flex;align-items:flex-end;gap:10px;}
  #pipbubble{background:var(--cream);color:var(--ink);border-radius:14px;padding:12px 16px;
    font-size:21px;max-width:430px;line-height:1.25;border:3px solid #cdbb96;}
  .pipsvg{width:74px;height:88px;flex:0 0 auto;}
  .blink{animation:blk 5s infinite;}
  @keyframes blk{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  /* overlay */
  #overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(20,12,6,.72);}
  #overlay.on{display:flex;}
  .panel{background:var(--cream);color:var(--ink);border-radius:18px;padding:28px 34px;max-width:760px;
    border:6px solid var(--brass);text-align:center;}
  .panel h2{margin:0 0 12px 0;font-size:32px;}
  .panel p{font-size:23px;line-height:1.35;margin:8px 0 18px 0;}
  .btnrow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
  .btn{background:var(--brass);color:#3a2b06;font-size:24px;font-weight:800;border-radius:12px;
    padding:0 30px;height:68px;display:flex;align-items:center;cursor:pointer;border:3px solid #8d6f16;}
  .btn.quiet{background:#e2d9c6;color:#3a2b06;border-color:#c3b7a0;}

  /* end screen */
  .endWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;}
  .endLine{font-size:34px;text-align:center;max-width:900px;line-height:1.3;}
  .endSub{font-size:22px;color:#ffe9c0;text-align:center;max-width:820px;line-height:1.3;}
  .bigLanterns{display:flex;gap:30px;}
  .bl{width:78px;height:104px;border-radius:10px 10px 6px 6px;border:5px solid #7a5c37;background:#3a2716;
    position:relative;}
  .bl .g{position:absolute;left:7px;right:7px;top:12px;bottom:12px;border-radius:5px;background:#2b1d12;
    transition:background 900ms ease;}
  .bl.lit .g{background:radial-gradient(circle,#ffe6a8,#e0a23c);box-shadow:0 0 24px rgba(255,200,110,.7);}
  .arrivalWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:26px;}
  .arrivalLine{font-size:36px;text-align:center;max-width:920px;line-height:1.3;}
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <div class="grain"></div>
    <div id="dusk"><div class="mullion"></div><div class="mullion2"></div></div>
    <div id="bench"></div>

    <div id="topbar">
      <div id="shelf">
        <div class="slot" data-slot="0"><div class="glass"></div></div>
        <div class="slot" data-slot="1"><div class="glass"></div></div>
        <div class="slot" data-slot="2"><div class="glass"></div></div>
        <div class="slot" data-slot="3"><div class="glass"></div></div>
      </div>
      <div class="chiprow">
        <div class="chip" id="bigwords">bigger words</div>
        <div class="chip" id="door">done for now</div>
      </div>
    </div>

    <div id="main">
      <section class="screen on" id="screen-arrival">
        <div class="arrivalWrap">
          <div class="arrivalLine">Four lanterns. You look, you tell me, I hang them.</div>
          <div class="btn" id="beginBtn">I'm ready</div>
        </div>
      </section>

      <section class="screen" id="screen-item">
        <div id="stimZone"></div>
        <div class="prompt" id="promptLine"></div>
        <div id="respZone"></div>
        <div class="commitRow"><div id="lightBtn" class="off">Light it</div></div>
      </section>

      <section class="screen" id="screen-end">
        <div class="endWrap">
          <div class="bigLanterns" id="bigLanterns">
            <div class="bl"><div class="g"></div></div>
            <div class="bl"><div class="g"></div></div>
            <div class="bl"><div class="g"></div></div>
            <div class="bl"><div class="g"></div></div>
          </div>
          <div class="endLine" id="endLine"></div>
          <div class="endSub" id="endSub"></div>
          <div class="btnrow" id="endBtns"></div>
        </div>
      </section>
    </div>

    <div id="pip">
      <svg class="pipsvg" viewBox="0 0 74 88" aria-hidden="true">
        <rect x="14" y="44" width="46" height="38" rx="12" fill="#8a6a44"/>
        <circle cx="37" cy="28" r="22" fill="#c9a97e"/>
        <ellipse class="blink" cx="29" cy="27" rx="3.4" ry="4.2" fill="#2b1d12"/>
        <ellipse class="blink" cx="45" cy="27" rx="3.4" ry="4.2" fill="#2b1d12"/>
        <path d="M30 38 q7 5 14 0" stroke="#2b1d12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <rect x="20" y="6" width="34" height="9" rx="4.5" fill="#6f5230"/>
      </svg>
      <div id="pipbubble">Four lanterns. You look, you tell me, I hang them.</div>
    </div>

    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------- fit to viewport ---------------- */
var fit=document.getElementById('fit');
function resize(){
  var s=Math.min(window.innerWidth/1365, window.innerHeight/768);
  fit.style.transform='translate(-50%,-50%) scale('+s+')';
}
window.addEventListener('resize',resize); resize();

/* ---------------- identity ---------------- */
var EVAL_ID='EVAL-LAB-MATH-C-OPEN-01';
var ARTIFACT_ID='EXP-LAB-MATH-C-OPEN-01-JUNIPER';
var CONTRACT_HASH='274c49ed00318c3c5e7eb4fae53bfbbea61645b4488f4b88780ba9cb431b7361';
var ARTIFACT_HASH='2047bb79075b2989442d671b6e2c96c5954f20fd9f5e77afeb2a18cc283cbeb5';

function post(msg){
  try{ if(window.parent){ window.parent.postMessage(msg,'*'); } }catch(e){}
}
function now(){ return Date.now(); }

var SESSION_START=now();

/* ---------------- item definitions (verbatim from contract) ---------------- */
var ITEMS=[
{
  id:'ITEM-1', constructId:'C1', prerequisiteProbe:true, stimulus:'dots',
  sentence:'Each bunch has the same number of dots.',
  prompt:'How many bunches are there, and how many dots are in each bunch?',
  kind:'twoNumbers',
  fields:[{key:'numberOfGroups',label:'bunches'},{key:'amountInEachGroup',label:'dots in each bunch'}],
  responseMode:'two_single_tap_numeric_entries_1_to_10_plus_explicit_not_sure (no typing, no drag, no keyboard)',
  exposure:{exposureId:'EX-EQGROUPS-DOTS-4x6',structure:'separated equal clusters',contextFamily:'dot clusters',factorPair:'4 x 6'},
  possibleConfounds:[
    'Child may count all 24 dots and infer group size by division rather than reading equal-group structure.',
    'Reading of the single sentence could gate the response (excluded construct).',
    'Visual clutter or cluster spacing could cause miscounting of clusters rather than a structural error.',
    'Numeric-entry mechanics could produce an input error unrelated to mathematics.'
  ],
  latencyKey:'c1_time_to_first_entry_ms',
  inspectionThresholdMs:3000
},
{
  id:'ITEM-2', constructId:'C3', prerequisiteProbe:false, stimulus:'array',
  sentence:'Here is one rectangle of squares.',
  prompt:'How many rows are there, and how many squares are in each row?',
  kind:'twoNumbers',
  fields:[{key:'rows',label:'rows'},{key:'squaresPerRow',label:'squares in each row'}],
  responseMode:'two_single_tap_numeric_entries_1_to_10_plus_explicit_not_sure (no typing, no drag, no keyboard)',
  exposure:{exposureId:'EX-ARRAY-GRID-3x7',structure:'contiguous rectangular array',contextFamily:'squares grid',factorPair:'3 x 7'},
  possibleConfounds:[
    'Row/column vocabulary may be the barrier rather than array structure (language, not mathematics).',
    'Child may count all 21 squares one by one and still answer correctly, masking whether structure was read.',
    'Visual scanning at the given viewport width could cause an off-by-one count.',
    'Orientation preference may lead the child to read columns as rows.'
  ],
  latencyKey:'c3_time_to_first_entry_ms',
  inspectionThresholdMs:3000
},
{
  id:'ITEM-3', constructId:'C2', prerequisiteProbe:false, stimulus:'groups5x3',
  sentence:'Every group holds the same amount.',
  prompt:'Choose the multiplication equation that matches what is shown.',
  kind:'options',
  options:['5 x 3 = 15','5 + 3 = 8','5 x 5 = 25','3 x 10 = 30'],
  responseMode:'single_tap_selection_from_four_fixed_option_cards_plus_separate_not_sure_card',
  exposure:{exposureId:'EX-EQUATION-MATCH-5x3',structure:'separated equal groups mapped to symbolic equation',contextFamily:'equation selection',factorPair:'5 x 3'},
  possibleConfounds:[
    'Selection format permits guessing; a single correct choice is weak evidence (1 in 4 baseline).',
    'Child may select by recognizing the product 15 without reading the group structure.',
    'Option order could induce position bias.',
    'Symbol reading (x versus +) may be the discriminating factor rather than multiplicative reasoning.'
  ],
  latencyKey:'c2_time_to_selection_ms',
  inspectionThresholdMs:2500
},
{
  id:'ITEM-4', constructId:'C4', prerequisiteProbe:false, stimulus:'tags',
  sentence:null,
  statementA:'2 baskets, and each basket holds 8 balls.',
  statementB:'8 baskets, and each basket holds 2 balls.',
  prompt:'Do these two statements describe the same situation? Then say how many baskets Statement A describes.',
  kind:'choicePlusNumber',
  choices:['same','different','not sure'],
  numberField:{key:'basketsInA',label:'baskets in Statement A'},
  responseMode:'one_tap_selection_plus_one_single_tap_numeric_entry_1_to_10_each_with_explicit_not_sure',
  exposure:{exposureId:'EX-REFERENT-SWAP-2x8',structure:'verbal referent swap with constant product',contextFamily:'containers and contents',factorPair:'2 x 8'},
  possibleConfounds:[
    "The word 'same' is ambiguous between same total and same situation; a 'same' response may reflect interpretation of the question rather than factor-referent confusion.",
    'Reading load is highest in this item and could gate the response (excluded construct).',
    "Child may already know commutativity and answer 'same' for a mathematically defensible product-based reason.",
    'Order of Statement A and B could bias which referent is anchored.'
  ],
  latencyKey:'c4_time_to_first_response_ms',
  inspectionThresholdMs:3500
}
];

/* one-time randomization of ITEM-3 card order, logged for position-bias analysis */
var item3Order=[0,1,2,3];
(function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}})(item3Order);
var ITEM3_DISPLAY_ORDER=item3Order.map(function(i){return ITEMS[2].options[i];});

/* ---------------- session state ---------------- */
var idx=-1;
var vals={};                 // current item field values
var activeFieldKey=null;
var itemShownAt=0, firstEntryAt=0, lastChangeAt=0, changeCount=0;
var guardShownThisItem=false, stallShownThisItem=false;
var readingSupportUsedThisItem=false;
var records=[];              // committed outcomes
var completedItemIds=[];
var completeSent=false;
var windowClosed=false;
var lastInteraction=now();
var bigText=false;

/* ---------------- element refs ---------------- */
var stage=document.getElementById('stage');
var stimZone=document.getElementById('stimZone');
var promptLine=document.getElementById('promptLine');
var respZone=document.getElementById('respZone');
var lightBtn=document.getElementById('lightBtn');
var pipbubble=document.getElementById('pipbubble');
var overlay=document.getElementById('overlay');
var panel=document.getElementById('panel');
var screens={arrival:document.getElementById('screen-arrival'),item:document.getElementById('screen-item'),end:document.getElementById('screen-end')};

function show(name){
  for(var k in screens){ screens[k].classList.toggle('on', k===name); }
}
function pip(text){ pipbubble.textContent=text; }

/* ---------------- messaging ---------------- */
post({
  type:'evaluation_ready',
  evaluationId:EVAL_ID,
  artifactId:ARTIFACT_ID,
  contractHash:CONTRACT_HASH,
  artifactHash:ARTIFACT_HASH,
  itemSequence:ITEMS.map(function(i){return i.id;}),
  constructs:['C1','C2','C3','C4'],
  administration:{retriesAllowed:0,noFeedbackDuringEvaluation:true,noHintsDuringEvaluation:true,
    notSureIsValidResponse:true,oneStimulusPerScreen:true,noTimeLimit:true,childMayStop:true,
    keyboardRequired:false,responseModes:['single_tap_number_selection','single_tap_card_selection']},
  item3DisplayedOptionOrder:ITEM3_DISPLAY_ORDER,
  timestamp:now()
});

function friction(itemId, frictionType, detail, impact){
  post({
    type:'evaluation_friction',
    evaluationId:EVAL_ID,
    artifactId:ARTIFACT_ID,
    itemId:itemId||null,
    constructId:itemId?(itemById(itemId)||{}).constructId||null:null,
    frictionType:frictionType,
    detail:detail,
    evidenceImpact:impact,
    instructionalContentDelivered:false,
    timestamp:now(),
    elapsedMs:now()-SESSION_START
  });
}
function itemById(id){ for(var i=0;i<ITEMS.length;i++){ if(ITEMS[i].id===id) return ITEMS[i]; } return null; }

/* declared at start: the design's tap-to-hear read-aloud is not available in this build */
friction(null,'reading_support_modality_unavailable',
  'Audio read-aloud of stimulus sentences is not available in this build; the only reading support offered is a larger-text toggle. Reading load is therefore unmitigated by audio on all items.',
  'Reading load remains a possible gate on every item; reading fluency is an excluded construct and must not be scored.');

/* ---------------- interaction bookkeeping ---------------- */
stage.addEventListener('pointerdown',function(){ lastInteraction=now(); });

setInterval(function(){
  if(windowClosed) return;
  if(!screens.item.classList.contains('on')) return;
  if(stallShownThisItem) return;
  if(now()-lastInteraction>=90000){
    stallShownThisItem=true;
    pip('Take your time \u2014 or tag it not sure and we move on.');
    friction(ITEMS[idx].id,'stall_prompt_shown',
      'No interaction for 90 seconds; identical non-teaching line shown on every item, naming the not-sure tag only.',
      'May raise not-sure rate relative to a silent design; no mathematical content was given.');
  }
},1000);

/* ---------------- rendering ---------------- */
function el(tag,cls,txt){ var d=document.createElement(tag); if(cls) d.className=cls; if(txt!=null) d.textContent=txt; return d; }

function buildStimulus(item){
  var wrap=el('div','lantern'); wrap.id='lanternBox';
  wrap.appendChild(el('div','ring'));
  wrap.appendChild(el('div','cap'));
  var glass=el('div','glass');
  if(item.stimulus==='dots'){
    var row=el('div','clusterRow');
    for(var c=0;c<4;c++){ var cl=el('div','cluster'); for(var d=0;d<6;d++){ cl.appendChild(el('div','dot')); } row.appendChild(cl); }
    glass.appendChild(row);
  }else if(item.stimulus==='array'){
    var arr=el('div','arr');
    for(var r=0;r<3;r++){ var rr=el('div','arrRow'); for(var s=0;s<7;s++){ rr.appendChild(el('div','sq')); } arr.appendChild(rr); }
    glass.appendChild(arr);
  }else if(item.stimulus==='groups5x3'){
    var gr=el('div','grpRow');
    for(var g=0;g<5;g++){ var gg=el('div','grp'); for(var k=0;k<3;k++){ gg.appendChild(el('div','gitem')); } gr.appendChild(gg); }
    glass.appendChild(gr);
  }else if(item.stimulus==='tags'){
    var tw=el('div','tagWrap');
    [['A',item.statementA],['B',item.statementB]].forEach(function(p){
      var t=el('div','tag');
      t.appendChild(el('div','tagName',p[0]));
      t.appendChild(el('div','tagText',p[1]));
      tw.appendChild(t);
    });
    glass.appendChild(tw);
  }
  wrap.appendChild(glass);
  wrap.appendChild(el('div','base'));
  return wrap;
}

function numberStrip(targetKey, includeNotSure){
  var strip=el('div','strip');
  for(var n=1;n<=10;n++){
    (function(n){
      var b=el('div','num',String(n));
      b.addEventListener('click',function(){ setValue(targetKey,n); });
      strip.appendChild(b);
    })(n);
  }
  if(includeNotSure!==false){
    var ns=el('div','nstag',"I'm not sure yet");
    ns.addEventListener('click',function(){ setValue(targetKey,'not_sure'); });
    strip.appendChild(ns);
  }
  return strip;
}

function fieldTile(f){
  var d=el('div','field'); d.setAttribute('data-key',f.key);
  d.appendChild(el('div','flabel',f.label));
  var box=el('div','fbox empty','tap a number');
  box.setAttribute('data-box',f.key);
  d.appendChild(box);
  d.addEventListener('click',function(){ activeFieldKey=f.key; refreshFields(); });
  return d;
}

function refreshFields(){
  var fs=respZone.querySelectorAll('.field');
  for(var i=0;i<fs.length;i++){
    var key=fs[i].getAttribute('data-key');
    fs[i].classList.toggle('active', key===activeFieldKey);
    var box=fs[i].querySelector('[data-box]');
    var v=vals[key];
    box.classList.remove('empty','ns');
    if(v==null){ box.classList.add('empty'); box.textContent='tap a number'; }
    else if(v==='not_sure'){ box.classList.add('ns'); box.textContent='not sure yet'; }
    else { box.textContent=String(v); }
  }
  refreshCommit();
}

function setValue(key,v){
  if(!key) return;
  vals[key]=v;
  if(!firstEntryAt) firstEntryAt=now();
  lastChangeAt=now(); changeCount++;
  // move focus to next empty field for convenience (no math information conveyed)
  var item=ITEMS[idx];
  if(item.kind==='twoNumbers'){
    var other=item.fields.filter(function(f){return f.key!==key;})[0];
    if(other && vals[other.key]==null) activeFieldKey=other.key;
  }
  refreshFields();
}

function selectChoice(group,value,node){
  var item=ITEMS[idx];
  if(vals[group]===value){ vals[group]=null; }   // tap again deselects
  else { vals[group]=value; }
  if(!firstEntryAt) firstEntryAt=now();
  lastChangeAt=now(); changeCount++;
  var cards=respZone.querySelectorAll('[data-group="'+group+'"]');
  for(var i=0;i<cards.length;i++){
    cards[i].classList.toggle('sel', cards[i].getAttribute('data-value')===vals[group]);
  }
  refreshFields();
}

function requiredComplete(){
  var item=ITEMS[idx];
  if(item.kind==='twoNumbers'){ return item.fields.every(function(f){ return vals[f.key]!=null; }); }
  if(item.kind==='options'){ return vals.selectedOption!=null; }
  if(item.kind==='choicePlusNumber'){ return vals.sameSituation!=null && vals.basketsInA!=null; }
  return false;
}
function refreshCommit(){ lightBtn.classList.toggle('off', !requiredComplete()); }

function renderItem(i){
  idx=i;
  var item=ITEMS[i];
  vals={}; activeFieldKey=null; firstEntryAt=0; lastChangeAt=0; changeCount=0;
  guardShownThisItem=false; stallShownThisItem=false; readingSupportUsedThisItem=false;
  lastInteraction=now();

  stimZone.innerHTML=''; respZone.innerHTML='';
  if(item.sentence){
    var s=el('div','sentence',item.sentence);
    stimZone.appendChild(s);
  }
  stimZone.appendChild(buildStimulus(item));
  promptLine.textContent=item.prompt;

  if(item.kind==='twoNumbers'){
    var fr=el('div','fields');
    item.fields.forEach(function(f){ fr.appendChild(fieldTile(f)); });
    respZone.appendChild(fr);
    activeFieldKey=item.fields[0].key;
    var strip=numberStrip(null,true);
    // rebind strip to active field
    strip.querySelectorAll('.num').forEach(function(b){
      var n=parseInt(b.textContent,10);
      b.onclick=function(){ setValue(activeFieldKey,n); };
    });
    strip.querySelector('.nstag').onclick=function(){ setValue(activeFieldKey,'not_sure'); };
    respZone.appendChild(strip);
  }
  else if(item.kind==='options'){
    var cards=el('div','cards');
    ITEM3_DISPLAY_ORDER.forEach(function(txt){
      var c=el('div','card',txt);
      c.setAttribute('data-group','selectedOption');
      c.setAttribute('data-value',txt);
      c.addEventListener('click',function(){ selectChoice('selectedOption',txt,c); });
      cards.appendChild(c);
    });
    respZone.appendChild(cards);
    var sub=el('div','cardsub');
    var nsc=el('div','card ns',"I'm not sure yet");
    nsc.setAttribute('data-group','selectedOption');
    nsc.setAttribute('data-value','not_sure');
    nsc.addEventListener('click',function(){ selectChoice('selectedOption','not_sure',nsc); });
    sub.appendChild(nsc);
    respZone.appendChild(sub);
  }
  else if(item.kind==='choicePlusNumber'){
    var crow=el('div','cards');
    item.choices.forEach(function(ch){
      var val = (ch==='not sure')?'not_sure':ch;
      var c=el('div', ch==='not sure'?'card ns':'card', ch==='not sure'?"I'm not sure yet":ch);
      c.setAttribute('data-group','sameSituation');
      c.setAttribute('data-value',val);
      c.addEventListener('click',function(){ selectChoice('sameSituation',val,c); });
      crow.appendChild(c);
    });
    respZone.appendChild(crow);

    var inline=el('div','inlineField');
    var tile=fieldTile(item.numberField);
    tile.style.minWidth='230px';
    inline.appendChild(tile);
    var strip2=numberStrip(item.numberField.key,true);
    inline.appendChild(strip2);
    respZone.appendChild(inline);
    activeFieldKey=item.numberField.key;
  }

  refreshFields();
  applyBigText();
  show('item');
  itemShownAt=now();
  pip("I can't figure this one out. You tell me what you see.");
}

function applyBigText(){ screens.item.classList.toggle('big-text', bigText); }

/* ---------------- commit ---------------- */
lightBtn.addEventListener('click',function(){
  if(lightBtn.classList.contains('off')) return;
  if(!guardShownThisItem && lastChangeAt && (now()-lastChangeAt)<400){
    guardShownThisItem=true;
    friction(ITEMS[idx].id,'commit_confirm_shown',
      'Light it was tapped within 400ms of the last field change; a one-time confirm was shown to catch accidental double-taps.',
      'Input-mechanics event only; no mathematical content shown. Commit latency for this item includes the confirm.');
    openPanel('Ready?','', [
      {label:'Yes, light it', act:function(){ closePanel(); commit(); }},
      {label:'Not yet', quiet:true, act:function(){ closePanel(); }}
    ]);
    return;
  }
  commit();
});

function commit(){
  var item=ITEMS[idx];
  var commitAt=now();
  var scored=scoreItem(item, vals);
  var timeToFirst = firstEntryAt? (firstEntryAt-itemShownAt) : null;
  var timeToCommit = commitAt-itemShownAt;

  var fastFlag=false;
  var latencyUsed = (item.kind==='options') ? (firstEntryAt? firstEntryAt-itemShownAt : timeToCommit) : timeToCommit;
  if(scored.raw==='correct' && latencyUsed!=null && latencyUsed < item.inspectionThresholdMs){
    fastFlag=true;
    scored.flags.push('latency_below_inspection_threshold');
  }
  if(changeCount>=6){
    scored.flags.push('elevated_field_change_count');
  }
  if(readingSupportUsedThisItem){ scored.flags.push('reading_support_larger_text_used'); }
  if(stallShownThisItem){ scored.flags.push('stall_prompt_shown_before_commit'); }
  if(guardShownThisItem){ scored.flags.push('commit_confirm_shown'); }

  var result;
  if(scored.raw==='unresolved') result='unresolved';
  else if(scored.forceAmbiguous || fastFlag) result='instrument_ambiguous';
  else if(scored.raw==='correct') result='correct';
  else result='incorrect';

  var supports=[];
  if(readingSupportUsedThisItem) supports.push('larger_text_toggle');
  if(stallShownThisItem) supports.push('stall_prompt_naming_not_sure_option');
  if(guardShownThisItem) supports.push('double_tap_commit_confirm');

  var attempt={
    type:'evaluation_attempt',
    evaluationId:EVAL_ID,
    artifactId:ARTIFACT_ID,
    itemId:item.id,
    constructId:item.constructId,
    sequenceIndex:idx+1,
    result:result,
    rawOutcome:scored.raw,
    confoundGated:(result==='instrument_ambiguous' && scored.raw!=='unresolved'),
    assistance:{
      level:'none',
      independentResponse:true,
      instructionalSupportBeforeFirstCommit:false,
      hintShown:false, exampleShown:false, feedbackShown:false, correctAnswerShown:false,
      nonInstructionalSupportsUsed:supports
    },
    exposure:{
      exposureId:item.exposure.exposureId,
      structure:item.exposure.structure,
      contextFamily:item.exposure.contextFamily,
      factorPair:item.exposure.factorPair,
      instructionalExposure:'none: no example, no hint, no feedback, no correct answer shown',
      firstExposureInSession:true,
      repeatedExposure:false,
      priorTeachingInThisSession:false
    },
    responseMode:item.responseMode,
    possibleConfounds:item.possibleConfounds.concat(scored.flags.map(function(f){return 'observed_flag:'+f;})),
    attemptedValue:scored.attemptedValue,
    measurements:scored.measurements,
    latency:{
      timeToFirstEntryMs:timeToFirst,
      timeToCommitMs:timeToCommit,
      latencyKey:item.latencyKey,
      inspectionThresholdMs:item.inspectionThresholdMs,
      belowInspectionThreshold:fastFlag,
      thresholdStatus:'provisional_uncalibrated_for_this_child'
    },
    inputMechanics:{fieldChangeCount:changeCount, commitConfirmShown:guardShownThisItem},
    retriesAllowed:0,
    timestamp:commitAt,
    elapsedMs:commitAt-SESSION_START
  };
  post(attempt);

  if(result==='instrument_ambiguous'){
    friction(item.id,'response_flagged_ambiguous',
      scored.forceAmbiguous
        ? "Response requires a disambiguation probe before any construct claim (contract confound gating)."
        : "Correct response committed below the provisional inspection threshold.",
      'Construct evidence for this item is ambiguous, not supportive and not contradictory.');
  }
  if(readingSupportUsedThisItem){
    friction(item.id,'reading_support_used',
      'Child enlarged the stimulus/prompt text before committing.',
      'Reading load may have interfered; reading fluency is an excluded construct.');
  }
  if(changeCount>=6){
    friction(item.id,'elevated_input_corrections',
      'Six or more field changes occurred before commit.',
      'Recorded value may include input-mechanics correction; pointer precision and typing speed are excluded constructs.');
  }

  records.push({itemId:item.id, constructId:item.constructId, result:result, raw:scored.raw, flags:scored.flags});
  completedItemIds.push(item.id);

  // identical post-commit sequence for every outcome
  pip('Recorded. Next lantern.');
  var lb=document.getElementById('lanternBox');
  if(lb) lb.classList.add('rise');
  lightBtn.classList.add('off');
  var slot=document.querySelector('.slot[data-slot="'+idx+'"]');
  setTimeout(function(){ if(slot) slot.classList.add('hung'); },620);
  setTimeout(function(){
    if(idx+1<ITEMS.length){ renderItem(idx+1); }
    else{ finish('all_items_recorded'); }
  },1400);
}

/* ---------------- scoring (records outcomes; makes no learning claims) ---------------- */
function scoreItem(item, v){
  var flags=[], raw='incorrect', force=false, av={}, m={};
  if(item.id==='ITEM-1'){
    av={numberOfGroups:v.numberOfGroups, amountInEachGroup:v.amountInEachGroup};
    var ns = (v.numberOfGroups==='not_sure' || v.amountInEachGroup==='not_sure');
    var rev = (v.numberOfGroups===6 && v.amountInEachGroup===4);
    var ok = (v.numberOfGroups===4 && v.amountInEachGroup===6);
    if(ns){ raw='unresolved'; flags.push('c1_not_sure_selected'); }
    else if(ok){ raw='correct'; }
    else { raw='incorrect'; if(rev) flags.push('c1_roles_reversed'); }
    m={ c1_group_pair_correct: ok && !ns,
        c1_roles_reversed: !!rev,
        c1_reported_total_instead_of_pair:'not_expressible_response_range_is_1_to_10',
        c1_not_sure_rate: ns?1:0 };
  }
  else if(item.id==='ITEM-2'){
    av={rows:v.rows, squaresPerRow:v.squaresPerRow};
    var ns2 = (v.rows==='not_sure' || v.squaresPerRow==='not_sure');
    var rev2 = (v.rows===7 && v.squaresPerRow===3);
    var ok2 = (v.rows===3 && v.squaresPerRow===7);
    var offByOne=false;
    if(!ns2 && !ok2 && !rev2 && typeof v.rows==='number' && typeof v.squaresPerRow==='number'){
      offByOne = (Math.abs(v.rows-3)<=1 && Math.abs(v.squaresPerRow-7)<=1);
    }
    if(ns2){ raw='unresolved'; flags.push('c3_not_sure_selected'); }
    else if(ok2){ raw='correct'; }
    else { raw='incorrect'; if(rev2) flags.push('c3_roles_reversed'); if(offByOne) flags.push('c3_off_by_one_count'); }
    m={ c3_array_dimensions_correct: ok2 && !ns2,
        c3_roles_reversed: !!rev2,
        c3_reported_total_instead_of_dimensions:'not_expressible_response_range_is_1_to_10',
        c3_off_by_one_count: !!offByOne,
        c3_not_sure_rate: ns2?1:0 };
  }
  else if(item.id==='ITEM-3'){
    var sel=v.selectedOption;
    av={selectedOption:sel, displayedOptionOrder:ITEM3_DISPLAY_ORDER,
        selectedDisplayPosition: (sel && sel!=='not_sure') ? (ITEM3_DISPLAY_ORDER.indexOf(sel)+1) : null};
    if(sel==='not_sure'){ raw='unresolved'; flags.push('c2_not_sure_selected'); }
    else if(sel==='5 x 3 = 15'){ raw='correct'; }
    else{
      raw='incorrect';
      if(sel==='5 + 3 = 8') flags.push('c2_additive_distractor_selected');
      if(sel==='5 x 5 = 25') flags.push('c2_duplicated_factor_distractor_selected');
      if(sel==='3 x 10 = 30') flags.push('c2_structure_and_product_mismatch_selected');
    }
    m={ c2_equation_match_correct: sel==='5 x 3 = 15',
        c2_additive_distractor_selected: sel==='5 + 3 = 8',
        c2_duplicated_factor_distractor_selected: sel==='5 x 5 = 25',
        c2_product_only_recognition_flag:'indeterminate_from_this_item_see_cross_item_checks',
        c2_not_sure_rate: sel==='not_sure'?1:0 };
  }
  else if(item.id==='ITEM-4'){
    av={sameSituation:v.sameSituation, basketsInA:v.basketsInA};
    var nsA = (v.sameSituation==='not_sure');
    var nsB = (v.basketsInA==='not_sure');
    var countOk = (v.basketsInA===2);
    if(nsA || nsB){ raw='unresolved'; flags.push('c4_not_sure_selected'); }
    else if(v.sameSituation==='same'){
      raw='incorrect'; force=true;
      flags.push('c4_same_selected_product_equality_confusion');
      flags.push('c4_ambiguity_flag_requires_followup');
    }
    else if(v.sameSituation==='different' && countOk){ raw='correct'; }
    else { raw='incorrect'; flags.push('c4_referent_count_incorrect'); }
    m={ c4_referent_discrimination_correct: (v.sameSituation==='different' && countOk),
        c4_same_selected_product_equality_confusion: v.sameSituation==='same',
        c4_referent_count_correct: countOk===true,
        c4_ambiguity_flag_requires_followup: v.sameSituation==='same',
        c4_not_sure_rate: (nsA||nsB)?1:0 };
  }
  return {raw:raw, flags:flags, forceAmbiguous:force, attemptedValue:av, measurements:m};
}

/* ---------------- completion ---------------- */
function evidenceMap(){
  var map={C1:'evidence_missing',C2:'evidence_missing',C3:'evidence_missing',C4:'evidence_missing'};
  records.forEach(function(r){
    if(r.result==='correct') map[r.constructId]='evidence_supports_construct_provisionally';
    else if(r.result==='incorrect') map[r.constructId]='evidence_contradicts_construct';
    else if(r.result==='instrument_ambiguous') map[r.constructId]='evidence_ambiguous';
    else map[r.constructId]='evidence_missing';
  });
  return map;
}
function crossItemChecks(){
  var out=[];
  var byId={}; records.forEach(function(r){ byId[r.itemId]=r; });
  var rev1 = byId['ITEM-1'] && byId['ITEM-1'].flags.indexOf('c1_roles_reversed')>=0;
  var rev2 = byId['ITEM-2'] && byId['ITEM-2'].flags.indexOf('c3_roles_reversed')>=0;
  if(rev1 && rev2) out.push('role_reversal_in_ITEM-1_and_ITEM-2: candidate referent-assignment gap; ITEM-4 must corroborate or contradict.');
  if(byId['ITEM-3'] && byId['ITEM-3'].raw==='correct' &&
     byId['ITEM-1'] && byId['ITEM-1'].raw==='incorrect' &&
     byId['ITEM-2'] && byId['ITEM-2'].raw==='incorrect'){
    out.push('correct_ITEM-3_with_incorrect_ITEM-1_and_ITEM-2: probable product recognition rather than structural mapping.');
  }
  return out;
}

function finish(reason){
  windowClosed=true;
  var unreached=ITEMS.map(function(i){return i.id;}).filter(function(id){ return completedItemIds.indexOf(id)<0; });
  if(!completeSent){
    completeSent=true;
    if(unreached.length){
      friction(null,'early_stop_unreached_items',
        'Child ended the session using the always-available exit; unreached items: '+unreached.join(', ')+'.',
        'Constructs targeted by unreached items remain unresolved with missing evidence, never a failure of ability.');
    }
    post({
      type:'evaluation_complete',
      evaluationId:EVAL_ID,
      artifactId:ARTIFACT_ID,
      completedItemIds:completedItemIds.slice(),
      elapsedMs:now()-SESSION_START,
      endedBy:reason,
      unreachedItemIds:unreached,
      itemOutcomes:records.map(function(r){return {itemId:r.itemId,constructId:r.constructId,result:r.result,flags:r.flags};}),
      constructEvidenceMap:evidenceMap(),
      crossItemConsistencyChecks:crossItemChecks(),
      item3DisplayedOptionOrder:ITEM3_DISPLAY_ORDER,
      instructionalExposureDuringWindow:'none',
      claims:'No mastery, proficiency, or grade-level attainment is claimed. One item per construct is a single observation sample; all labels are provisional.',
      timestamp:now()
    });
  }
  // closing scene (identical regardless of answer content)
  document.getElementById('dusk').classList.add('open');
  var bls=document.querySelectorAll('.bl');
  for(var i=0;i<bls.length;i++){ if(i<completedItemIds.length) bls[i].classList.add('lit'); }
  var slots=document.querySelectorAll('.slot');
  for(var j=0;j<slots.length;j++){ if(j<completedItemIds.length){ slots[j].classList.add('hung','lit'); } }

  var endLine=document.getElementById('endLine');
  var endSub=document.getElementById('endSub');
  var endBtns=document.getElementById('endBtns');
  endBtns.innerHTML='';
  if(reason==='all_items_recorded'){
    endLine.textContent='Four lanterns, four answers recorded. That\u2019s the whole job.';
    endSub.textContent='You looked carefully. That\u2019s what lights them.';
    pip('Four lanterns, four answers recorded. That\u2019s the whole job.');
    var talk=el('div','btn','Lantern Talk');
    talk.addEventListener('click',openLanternTalk);
    endBtns.appendChild(talk);
  }else{
    endLine.textContent='The lanterns will wait.';
    endSub.textContent='Whatever you told me is written down. Nothing else was needed.';
    pip('The lanterns will wait.');
  }
  show('end');
}

/* Post-window room: no answers, no examples, no math content, nothing recorded as evidence */
function openLanternTalk(){
  openPanel('Lantern Talk','Pip is here. Ask anything you like.',[
    {label:'Did I get them right?', quiet:true, act:function(){
      setPanelBody('Pip: I don\u2019t score anything. I only hang lanterns and write down what you told me.');
    }},
    {label:'What happens next?', quiet:true, act:function(){
      setPanelBody('Pip: A grown-up looks at what we wrote down. Another day, there may be more lanterns.');
    }},
    {label:'Close', act:function(){ closePanel(); }}
  ]);
}

/* ---------------- panels ---------------- */
var panelBodyEl=null;
function openPanel(title, body, buttons){
  panel.innerHTML='';
  var h=el('h2',null,title); panel.appendChild(h);
  panelBodyEl=el('p',null,body||''); panel.appendChild(panelBodyEl);
  var row=el('div','btnrow');
  buttons.forEach(function(b){
    var btn=el('div','btn'+(b.quiet?' quiet':''),b.label);
    btn.addEventListener('click',b.act);
    row.appendChild(btn);
  });
  panel.appendChild(row);
  overlay.classList.add('on');
}
function setPanelBody(t){ if(panelBodyEl) panelBodyEl.textContent=t; }
function closePanel(){ overlay.classList.remove('on'); }

/* ---------------- controls ---------------- */
document.getElementById('beginBtn').addEventListener('click',function(){ renderItem(0); });

document.getElementById('bigwords').addEventListener('click',function(){
  bigText=!bigText;
  applyBigText();
  if(bigText && screens.item.classList.contains('on') && !readingSupportUsedThisItem){
    readingSupportUsedThisItem=true;
  }
});

document.getElementById('door').addEventListener('click',function(){
  if(windowClosed){ return; }
  openPanel('Stop for now?','You can stop any time. Nothing is lost.',[
    {label:'Yes, I\u2019m done', act:function(){ closePanel(); finish('child_stopped_early'); }},
    {label:'Keep looking', quiet:true, act:function(){ closePanel(); lastInteraction=now(); }}
  ]);
});

show('arrival');
})();
</script>

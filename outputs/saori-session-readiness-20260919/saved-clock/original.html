<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>The Lamp Room: Two Magic Rings</title>
<style>
:root{
  --night:#101936;--deep:#080e24;--ink:#18233d;--cream:#fff8df;
  --gold:#ffc857;--gold2:#ffe29a;--silver:#bde9ff;--silver2:#eefbff;
  --glass:#18345d;--green:#72e2aa;--danger:#ffb879;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 42%,rgba(255,192,77,.18),transparent 32%),
    linear-gradient(180deg,#172652 0%,#0c1532 56%,#070d20 100%);
}
button{font:inherit}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.shell{
  width:min(1180px,100%);height:100vh;margin:auto;
  display:flex;flex-direction:column;position:relative;
  transition:width .25s ease,margin .25s ease;
}
body.companion-open .shell{width:calc(100% - 230px);max-width:none;margin-left:0;margin-right:230px}
.topbar{
  flex:0 0 56px;display:flex;align-items:center;gap:12px;
  padding:7px 16px;border-bottom:1px solid rgba(189,233,255,.25);
  background:rgba(7,13,32,.86);z-index:20;
}
.brand{min-width:0;flex:1}
.brand h1{font-size:clamp(21px,2.1vw,28px);line-height:1;margin:0;color:#fff6d8;white-space:nowrap}
.brand small{display:block;color:#bde9ff;font-size:13px;margin-top:3px}
.utility{
  min-height:39px;border:2px solid #8ed9f8;background:#18345d;color:#fff;
  border-radius:22px;padding:7px 13px;font-weight:800;cursor:pointer;white-space:nowrap
}
.utility:hover{background:#24507f}
.progress-strip{
  flex:0 0 34px;display:flex;align-items:center;justify-content:center;gap:12px;
  background:rgba(10,20,48,.72);border-bottom:1px solid rgba(255,255,255,.12)
}
.progress-label{font-size:14px;font-weight:800;color:#d9f5ff}
.progress-dots{display:flex;gap:9px}
.progress-dot{
  width:18px;height:18px;border:2px solid #a9ddf4;border-radius:50%;
  background:#172846;box-shadow:inset 0 0 0 3px #172846;transition:.35s
}
.progress-dot.done{background:#ffc857;border-color:#fff0a9;box-shadow:0 0 14px #ffc857}
.main{
  flex:1;min-height:0;padding:8px 14px 10px;display:flex;flex-direction:column;gap:7px
}
.question{
  flex:0 0 auto;min-height:68px;padding:10px 13px 10px 18px;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
  background:linear-gradient(90deg,rgba(255,248,223,.98),rgba(234,248,255,.97));
  color:#18233d;border:3px solid #d7b859;border-radius:22px;
  box-shadow:0 7px 22px rgba(0,0,0,.25)
}
.question p{font-size:clamp(16px,1.55vw,20px);line-height:1.25;font-weight:800;margin:0}
.read-btn{
  min-height:42px;border:0;border-radius:22px;padding:8px 15px;
  background:#234f7f;color:#fff;font-weight:900;cursor:pointer;white-space:nowrap
}
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.clock-zone{
  flex:1;min-height:280px;position:relative;display:flex;align-items:center;justify-content:center;
  border-radius:26px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,204,100,.20),transparent 38%),
    linear-gradient(180deg,rgba(18,42,82,.65),rgba(8,18,43,.82));
  border:1px solid rgba(189,233,255,.18)
}
body.checkpoint .clock-zone{
  background:radial-gradient(circle at 50% 48%,rgba(189,233,255,.09),transparent 35%),
  linear-gradient(180deg,rgba(8,18,43,.94),rgba(4,9,24,.98))
}
.window{
  position:absolute;left:14px;top:16px;bottom:16px;width:205px;border:5px solid #9a7135;
  border-radius:95px 95px 20px 20px;background:linear-gradient(#152c64,#285488 63%,#0e4766 64%);
  box-shadow:inset 0 0 25px #040b1b;overflow:hidden
}
.window:after{
  content:"";position:absolute;left:-10%;right:-10%;bottom:24%;height:22px;
  border-top:3px solid rgba(200,244,255,.58);border-radius:50%
}
.boats{position:absolute;left:27px;top:75px;width:175px;height:200px;pointer-events:none}
.boat{
  position:absolute;width:35px;height:22px;transition:transform .8s ease,filter .4s;
  animation:bob 3s ease-in-out infinite
}
.boat:before{content:"";position:absolute;left:3px;bottom:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:10px solid var(--boat)}
.boat:after{content:"";position:absolute;left:16px;bottom:8px;width:4px;height:14px;background:#fff3ac;box-shadow:0 0 10px #fff3ac}
.boat:nth-child(1){left:4px;top:2px;--boat:#ef6b72}
.boat:nth-child(2){left:110px;top:42px;--boat:#62d5c2;animation-delay:-.8s}
.boat:nth-child(3){left:25px;top:102px;--boat:#ffb34f;animation-delay:-1.4s}
.boat:nth-child(4){left:115px;top:145px;--boat:#b69cff;animation-delay:-2s}
.boat.docked{transform:translate(35px,18px) scale(1.08);filter:drop-shadow(0 0 8px #fff2a4)}
.gear{
  position:absolute;border:8px dotted rgba(210,173,92,.32);border-radius:50%;
  animation:turn 8s linear infinite;pointer-events:none
}
.gear.g1{width:95px;height:95px;right:40px;top:32px}
.gear.g2{width:68px;height:68px;right:105px;top:106px;animation-direction:reverse}
.charge{
  position:absolute;right:26px;bottom:28px;width:48px;height:180px;border:4px solid #d9f5ff;
  border-radius:25px;background:rgba(5,16,38,.76);overflow:hidden;box-shadow:0 0 15px rgba(189,233,255,.3)
}
.charge-fill{
  position:absolute;bottom:0;left:0;right:0;height:0;
  background:linear-gradient(#fff8bd,#ffc857,#ff8e46);transition:height .6s ease;
  box-shadow:0 0 22px #ffc857
}
.charge-label{
  position:absolute;right:13px;bottom:8px;width:73px;text-align:center;
  color:#d9f5ff;font-size:12px;font-weight:900
}
.clock-card{position:relative;width:min(43vh,355px);height:min(43vh,355px);min-width:280px;min-height:280px}
.clock-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 11px 16px rgba(0,0,0,.44))}
.demo-count{
  position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:6px;
  pointer-events:none
}
.demo-count span{
  min-width:38px;padding:6px 7px;border-radius:18px;background:#14375f;border:2px solid #c9f1ff;
  color:#fff;font-weight:900;text-align:center;opacity:0;animation:countIn .28s ease forwards
}
.demo-count span:nth-child(2){animation-delay:.35s}.demo-count span:nth-child(3){animation-delay:.7s}.demo-count span:nth-child(4){animation-delay:1.05s}
.answer-panel{
  flex:0 0 auto;min-height:88px;padding:3px 2px 0;display:flex;flex-direction:column;justify-content:center;gap:5px
}
.options{display:grid;grid-template-columns:repeat(var(--count),1fr);gap:10px}
.lens{
  min-height:70px;padding:10px 17px;border:3px solid #bde9ff;border-radius:50px;
  color:#10213e;background:linear-gradient(180deg,#f7fdff,#bde9ff);
  box-shadow:inset 0 -7px 0 rgba(40,107,145,.14),0 5px 13px rgba(0,0,0,.3);
  font-size:clamp(15px,1.35vw,18px);line-height:1.15;font-weight:900;cursor:pointer
}
.lens:hover{transform:translateY(-2px);filter:brightness(1.08)}
.numeric-controls{
  display:flex;align-items:center;justify-content:center;gap:12px;min-height:72px
}
.stone,.send,.reset{
  min-height:58px;border-radius:29px;font-weight:950;cursor:pointer
}
.stone{
  min-width:92px;border:3px solid #d7f3ff;color:#fff;background:#24517b;
  font-size:22px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)
}
.readout{
  min-width:144px;height:68px;border:4px solid #dcb75b;border-radius:18px;
  background:#fff8df;color:#17243e;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(255,200,87,.3)
}
.readout strong{font-size:31px;line-height:1}.readout small{font-size:13px;font-weight:900}
.send{
  min-width:190px;border:3px solid #fff1a9;color:#17213b;background:linear-gradient(#ffe788,#ffc34c);
  font-size:18px;padding:8px 18px;box-shadow:0 6px 0 #9f681d
}
.reset{min-width:72px;border:2px solid #aacbe0;background:#152d50;color:#fff;padding:7px 12px}
.status{min-height:25px;text-align:center;font-size:16px;font-weight:900;color:#fff4c4}
.status.recovery{color:#ffd0a5}.status.success{color:#a8ffd0}
.recover-minute .minute-tick.major{animation:tickPulse .65s ease 2}
.recover-role .hand-label{opacity:1}
.recover-role .clock-hand{animation:wiggle .48s ease 2}
.clock-hand{transform-origin:210px 210px;transform-box:view-box}
.worked-hand{animation:sweepHand 1.45s cubic-bezier(.25,.75,.25,1) forwards}
.checkpoint-note{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(7,14,35,.91);border:2px solid #bde9ff;border-radius:20px;
  color:#eefbff;padding:7px 16px;font-weight:900;z-index:4;animation:noteFade 2s ease forwards
}
.opening{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:4px 12px 12px;text-align:center
}
.open-promise{font-size:clamp(17px,2vw,23px);font-weight:900;color:#fff4c7;margin:0}
.open-line{font-size:17px;color:#d8f5ff;font-weight:800;margin:0}
.reveal-ring{
  position:relative;width:min(49vh,370px);height:min(49vh,370px);min-width:305px;min-height:305px;
  border:0;border-radius:50%;padding:0;background:transparent;cursor:pointer;color:#fff;
  animation:ringPulse 1.8s ease-in-out infinite
}
.reveal-ring .clock-svg{pointer-events:none}
.start-lens{
  position:absolute;left:50%;bottom:5px;transform:translateX(-50%);z-index:3;
  min-width:245px;padding:12px 20px;border:3px solid #eefbff;border-radius:30px;
  color:#12213d;background:linear-gradient(#fff6b8,#ffc857);
  font-size:19px;font-weight:950;box-shadow:0 0 24px #bde9ff
}
.ghost-tap{
  position:absolute;right:13px;top:104px;font-size:42px;filter:drop-shadow(0 0 8px #fff);
  animation:ghostTap 1.5s ease-in-out infinite;pointer-events:none
}
.open-tags{position:absolute;inset:0;pointer-events:none}
.open-tag{
  position:absolute;padding:5px 10px;border-radius:15px;font-size:13px;font-weight:950
}
.open-tag.silver{right:-25px;top:49px;color:#10213e;background:#dff8ff}
.open-tag.gold{left:-24px;bottom:68px;color:#3b2a06;background:#ffe29a}
.pause-shade{
  display:none;position:fixed;inset:0 230px 0 0;z-index:80;background:rgba(5,10,25,.46);
  align-items:center;justify-content:center;pointer-events:all
}
body.companion-open .pause-shade{display:flex}
.pause-card{padding:14px 24px;border:3px solid #bde9ff;border-radius:24px;background:#112a4d;font-size:19px;font-weight:900}
.completion{
  flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px
}
.complete-card{
  width:min(750px,94%);padding:25px;border:4px solid #ffe69a;border-radius:32px;
  background:radial-gradient(circle at top,#2d628c,#14264e 60%,#0b1635);
  box-shadow:0 0 42px rgba(255,200,87,.5)
}
.badge{
  width:110px;height:110px;margin:auto;border-radius:50%;display:grid;place-items:center;
  border:8px double #fff4b2;background:linear-gradient(135deg,#bde9ff,#ffc857);
  color:#17213c;font-size:48px;box-shadow:0 0 30px #ffc857
}
.badge-name{margin-top:6px;color:#fff4b8;font-size:17px;font-weight:950}
.badge-name span{display:block;color:#d9f5ff;font-size:13px}
.complete-card h2{font-size:32px;margin:8px 0 5px;color:#fff4b8}
.complete-card p{font-size:19px;line-height:1.35;margin:5px auto;max-width:590px}
.unlock-note{margin-top:12px;color:#fff4b8;font-size:15px;font-weight:900}
.stairs{display:flex;justify-content:center;gap:16px;margin-top:7px}
.stair{width:180px;padding:9px 10px;border-radius:14px;font-weight:950;color:#17213c}
.stair small{display:block;margin-bottom:2px;font-size:11px;font-weight:900;text-transform:uppercase}
.stair.silver{background:#dff8ff}.stair.gold{background:#ffe29a}
.replay{
  min-width:190px;min-height:48px;margin-top:15px;padding:8px 20px;border:3px solid #eefbff;
  border-radius:26px;background:#234f7f;color:#fff;font-weight:950;cursor:pointer
}
.replay:hover{background:#2d628c}
body.paused *{animation-play-state:paused!important}
@keyframes bob{50%{margin-top:5px}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes countIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes sweepHand{from{transform:rotate(0deg)}to{transform:rotate(120deg)}}
@keyframes ringPulse{50%{filter:drop-shadow(0 0 19px #bde9ff)}}
@keyframes ghostTap{50%{transform:translate(-8px,8px) scale(.92)}}
@keyframes tickPulse{50%{stroke:#fff;stroke-width:7}}
@keyframes wiggle{25%{filter:drop-shadow(0 0 5px #fff)}75%{filter:drop-shadow(0 0 10px #ffc857)}}
@keyframes noteFade{0%,70%{opacity:1}100%{opacity:0}}
@media(max-height:740px){
  .topbar{flex-basis:50px;padding-top:5px;padding-bottom:5px}
  .progress-strip{flex-basis:30px}
  .main{padding-top:5px;padding-bottom:6px}
  .question{min-height:61px;padding-top:7px;padding-bottom:7px}
  .clock-card{width:min(42vh,318px);height:min(42vh,318px)}
  .clock-zone{min-height:258px}
  .lens{min-height:62px;padding:8px 14px}
  .answer-panel{min-height:79px}
  .numeric-controls{min-height:67px}
  .stone,.send,.reset{min-height:53px}
  .readout{height:61px}
  .reveal-ring{width:min(46vh,330px);height:min(46vh,330px)}
}
@media(max-width:900px){
  .brand small{display:none}
  .utility{padding:7px 10px}
  .window{opacity:.55;width:160px}
  .boats{transform:scale(.8);transform-origin:left top}
  .gear{opacity:.4}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>The Lamp Room: Two Magic Rings</h1>
      <small>One clock face hides an hour ring and a minute ring.</small>
    </div>
    <button id="read-aloud" class="utility" type="button">📖 Read it to me</button>
    <button id="sound-toggle" class="utility" type="button" aria-pressed="false">🔊 Sound on</button>
  </header>
  <div id="progress-strip" class="progress-strip">
    <span id="progress-label" class="progress-label">Boats guided: 0 of 4</span>
    <div class="progress-dots" aria-label="Activity progress">
      <span class="progress-dot"></span><span class="progress-dot"></span>
      <span class="progress-dot"></span><span class="progress-dot"></span>
    </div>
  </div>
  <main id="screen" class="main"></main>
</div>
<div class="pause-shade" aria-hidden="true"><div class="pause-card">The lamp is waiting while you talk with Elli.</div></div>
<div id="sunny-companion"></div>

<script>
(()=>{
"use strict";
const NODE="act-two-scales-intro";
const TITLE="The Lamp Room: Two Magic Rings";
const FOCUS="Establish that one clock face carries two different scales: an hour scale read from the short hand and a by-fives minute scale read from the long hand starting at 12.";
const MECHANIC="Each item is one clock face in the lamp room. For the worked example, the by-fives labels (5,10,15...55) orbit the outer ring and the count 5-10-15-20 animates tick by tick as the minute hand sweeps to the 4. Selection items are answered by tapping one of two or three large lens-shaped cards under the clock. Numeric items use a bounded minute dial: the child taps '+5' stepper stones (or taps tick marks directly) to build a value shown in a big readout, then presses a clear 'Send the Light' confirm button — no free numeric pad. Practice items keep the by-fives labels visible; on the final checkpoint the labels fade out with a soft chime and the room dims, signaling 'now you count on your own.'";
const items=[
 {id:"it-intro-01",prompt:"Look at the clock. The long hand points at the 4. Counting by fives from the 12 gives 5, 10, 15, 20. So the long hand says 20 minutes, not 4 minutes. Which sentence tells what the long hand does?",mode:"selection",minute:4,labels:true,demo:true,base:1,options:[
  ["opt-intro-01-a","The long hand tells minutes. Count by fives from the 12."],
  ["opt-intro-01-b","The long hand tells the number it points at."],
  ["opt-intro-01-c","The long hand tells the hour."]
 ],correct:"opt-intro-01-a"},
 {id:"it-intro-02",prompt:"This clock shows only the long hand, pointing straight at the 6. Count by fives from the 12 around to the 6. How many minutes is that?",mode:"numeric",minute:6,labels:true,expected:30,base:1},
 {id:"it-intro-03",prompt:"On this clock the short hand is a little past the 8 and the long hand points at the 12. Which hand tells you the hour?",mode:"selection",minute:0,short:8.15,labels:true,base:1,options:[
  ["opt-intro-03-a","The short hand"],["opt-intro-03-b","The long hand"]
 ],correct:"opt-intro-03-a"},
 {id:"it-intro-04",prompt:"A clock shows only the long hand, pointing straight at the 9. How many minutes does the long hand say?",mode:"numeric",minute:9,labels:false,expected:45,base:0,checkpoint:true}
];
const screen=document.getElementById("screen");
const readBtn=document.getElementById("read-aloud");
const soundBtn=document.getElementById("sound-toggle");
let index=0,opening=true,terminal=false,muted=false,paused=false,locked=false;
let dialValue=0,completedItems=0,solvedIds=new Set(),targetResults=[];
let itemAttempts={},hinted={},helped={},readCounts={};
let startStamp=performance.now(),totalPaused=0,pauseStamp=0,itemStart=0;
let pending=null,completedSent=false;

function post(type,payload){window.parent.postMessage({type,payload},"*")}
function sfx(cue){if(!muted)post("sunny_sfx",{cue})}
function activeNow(){
  const now=performance.now();
  return now-totalPaused-(paused?now-pauseStamp:0);
}
function challengeFor(item){
  return {id:item.id,prompt:item.prompt,mode:item.mode,readAloudRequested:false,readAloudCount:readCounts[item.id]||0};
}
function actionsFor(item){
  if(opening)return["Tap the pulsing silver ring","Read it to me"];
  if(locked)return["Watch the lamp"];
  return item.mode==="selection"?["Tap one lens-shaped answer","Read it to me"]:
    ["Tap +5 or −5","Send the Light","Read it to me"];
}
function emitState(readRequested=false,overrideActions){
  if(terminal)return;
  const item=items[index];
  const c=challengeFor(item);c.readAloudRequested=readRequested;
  post("game_state_update",{
    game:"generated-math",activityId:NODE,nodeId:NODE,phase:"question",
    activityTitle:TITLE,learningFocus:FOCUS,mechanic:MECHANIC,currentChallenge:c,
    availableActions:overrideActions||actionsFor(item),itemIndex:index+1,totalItems:items.length,
    answerVisibility:"hidden"
  });
}
function emitTerminalState(finalItem){
  const c=challengeFor(finalItem);
  post("game_state_update",{
    game:"generated-math",activityId:NODE,nodeId:NODE,phase:"complete",
    activityTitle:TITLE,learningFocus:FOCUS,mechanic:MECHANIC,currentChallenge:c,
    availableActions:["Look at the Keeper's Lens badge"],itemIndex:items.length,totalItems:items.length,
    answerVisibility:"hidden"
  });
}
function schedule(fn,ms){
  cancelPending();
  pending={fn,remain:ms,start:performance.now(),id:0};
  if(!paused)pending.id=setTimeout(runPending,ms);
}
function runPending(){
  if(!pending)return;
  const fn=pending.fn;pending=null;fn();
}
function cancelPending(){if(pending&&pending.id)clearTimeout(pending.id);pending=null}
function pausePending(){
  if(pending&&pending.id){
    clearTimeout(pending.id);
    pending.remain=Math.max(0,pending.remain-(performance.now()-pending.start));
    pending.id=0;
  }
}
function resumePending(){
  if(pending&&!pending.id){
    pending.start=performance.now();
    pending.id=setTimeout(runPending,pending.remain);
  }
}
function progressMarkupWorld(){
  return `<div class="window" aria-hidden="true"></div>
  <div class="boats" aria-hidden="true">${items.map((x,i)=>`<span class="boat ${solvedIds.has(x.id)?"docked":""}"></span>`).join("")}</div>
  <span class="gear g1" aria-hidden="true"></span><span class="gear g2" aria-hidden="true"></span>
  <div class="charge" aria-hidden="true"><div class="charge-fill" style="height:${solvedIds.size*25}%"></div></div>
  <div class="charge-label" aria-hidden="true">LAMP POWER</div>`;
}
function clockSVG(item,open=false){
  let ticks="";
  for(let i=0;i<60;i++){
    const major=i%5===0;
    ticks+=`<line class="minute-tick ${major?"major":""}" x1="210" y1="${major?30:37}" x2="210" y2="${major?48:44}" transform="rotate(${i*6} 210 210)" stroke="${major?"#aeeaff":"#789db4"}" stroke-width="${major?4:2}" stroke-linecap="round"/>`;
  }
  let nums="",labels="";
  for(let n=1;n<=12;n++){
    const a=n*30*Math.PI/180,x=210+132*Math.sin(a),y=210-132*Math.cos(a)+8;
    nums+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="25" font-weight="900" fill="#936615">${n}</text>`;
    if(item.labels&&n<12){
      const lx=210+182*Math.sin(a),ly=210-182*Math.cos(a)+5;
      labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="15" font-weight="900" fill="#154463">${n*5}</text>`;
    }
  }
  if(item.labels)labels+=`<text x="210" y="22" text-anchor="middle" font-size="11" font-weight="900" fill="#154463">START</text>`;
  let hands="";
  if(item.short!=null){
    hands+=`<line class="clock-hand short-hand" x1="210" y1="218" x2="210" y2="122" transform="rotate(${item.short*30} 210 210)" stroke="#d08b19" stroke-width="13" stroke-linecap="round"/>`;
    hands+=`<text class="hand-label" x="245" y="245" opacity="0" fill="#9a6112" font-size="17" font-weight="900">short</text>`;
  }
  const minuteAngle=item.minute*30;
  hands+=`<line class="clock-hand long-hand ${item.demo?"worked-hand":""}" x1="210" y1="222" x2="210" y2="65" ${item.demo?"":`transform="rotate(${minuteAngle} 210 210)"`} stroke="#24698d" stroke-width="9" stroke-linecap="round"/>`;
  hands+=`<text class="hand-label" x="235" y="178" opacity="0" fill="#145b82" font-size="17" font-weight="900">long</text>`;
  return `<svg class="clock-svg" viewBox="0 0 420 420" role="img" aria-label="${open?"Clock with a silver minute ring and a gold hour ring":"Analog clock for this problem"}">
   <circle cx="210" cy="210" r="199" fill="#d9edf3" stroke="#eafaff" stroke-width="7"/>
   <circle cx="210" cy="210" r="169" fill="#fff8df" stroke="#c79730" stroke-width="8"/>
   <circle cx="210" cy="210" r="151" fill="none" stroke="#f1cc67" stroke-width="3"/>
   ${ticks}${nums}${labels}${hands}
   <circle cx="210" cy="210" r="13" fill="#213c5f" stroke="#fff2ae" stroke-width="4"/>
  </svg>`;
}
function showOpening(){
  opening=true;terminal=false;document.body.classList.remove("checkpoint");
  const openItem={minute:0,labels:false};
  screen.innerHTML=`<section class="opening">
    <p class="open-promise">The lighthouse clock has TWO rings hiding in one face — find them both and wake the lamp.</p>
    <p class="open-line">One clock. Two rings. Wake the lamp.</p>
    <button id="reveal-ring" class="reveal-ring" type="button" aria-label="Tap the pulsing silver ring to start">
      ${clockSVG(openItem,true)}
      <span class="open-tags"><span class="open-tag silver">SILVER TICKS</span><span class="open-tag gold">GOLD NUMBERS</span></span>
      <span class="ghost-tap" aria-hidden="true">☝️</span>
      <span class="start-lens">Tap the silver ring • Start</span>
    </button>
  </section>`;
  document.getElementById("reveal-ring").addEventListener("click",()=>{
    if(paused||locked)return;
    sfx("interaction");opening=false;renderItem(true);
  });
  itemStart=activeNow();
  emitState();
}
function renderItem(preserveStart=false){
  const item=items[index];
  opening=false;locked=false;dialValue=0;
  document.body.classList.toggle("checkpoint",!!item.checkpoint);
  if(!preserveStart)itemStart=activeNow();
  screen.innerHTML=`<section class="question">
      <p>${item.prompt}</p>
      <button class="read-btn" id="inline-read" type="button">📖 Read it to me</button>
    </section>
    <section class="play">
      <div class="clock-zone ${item.checkpoint?"checkpoint-zone":""}">
        ${progressMarkupWorld()}
        ${item.checkpoint?`<div class="checkpoint-note">The silver number lights are gone. Count on your own.</div>`:""}
        <div class="clock-card ${item.demo?"demo":""}">
          ${clockSVG(item)}
          ${item.demo?`<div class="demo-count" aria-label="Count by fives: 5, 10, 15, 20"><span>5</span><span>10</span><span>15</span><span>20</span></div>`:""}
        </div>
      </div>
      <div id="answer-panel" class="answer-panel"></div>
    </section>`;
  document.getElementById("inline-read").addEventListener("click",requestRead);
  renderControls(item);
  if(item.checkpoint)sfx("interaction");
  emitState();
}
function renderControls(item){
  const panel=document.getElementById("answer-panel");
  if(item.mode==="selection"){
    panel.innerHTML=`<div class="options" style="--count:${item.options.length}">
      ${item.options.map(o=>`<button type="button" class="lens" data-option-id="${o[0]}">${o[1]}</button>`).join("")}
    </div><div id="status" class="status" aria-live="polite"></div>`;
    panel.querySelectorAll(".lens").forEach(btn=>btn.addEventListener("click",()=>commitSelection(btn.dataset.optionId)));
  }else{
    panel.innerHTML=`<div class="numeric-controls">
      <button id="minus-five" class="stone" type="button" aria-label="Subtract 5 minutes">−5</button>
      <div class="readout" aria-live="polite"><strong id="dial-readout">0</strong><small>minutes</small></div>
      <button id="plus-five" class="stone" type="button" aria-label="Add 5 minutes">+5</button>
      <button id="reset-dial" class="reset" type="button">Reset</button>
      <button id="send-light" class="send" type="button">Send the Light</button>
    </div><div id="status" class="status" aria-live="polite"></div>`;
    document.getElementById("plus-five").addEventListener("click",()=>changeDial(5));
    document.getElementById("minus-five").addEventListener("click",()=>changeDial(-5));
    document.getElementById("reset-dial").addEventListener("click",()=>{if(paused||locked)return;dialValue=0;updateDial();sfx("interaction")});
    document.getElementById("send-light").addEventListener("click",commitNumeric);
  }
}
function changeDial(delta){
  if(paused||locked)return;
  dialValue=Math.max(0,Math.min(55,dialValue+delta));updateDial();sfx("interaction");
}
function updateDial(){const el=document.getElementById("dial-readout");if(el)el.textContent=String(dialValue)}
function scaffold(item){
  return item.base+(hinted[item.id]?1:0)+(helped[item.id]?1:0);
}
function recordAttempt(item,correct,attemptedValue){
  const row={target:item.id,correct,attemptedValue,responseTimeMs:Math.max(0,Math.round(activeNow()-itemStart)),scaffoldLevel:scaffold(item)};
  post("attempt_event",{domain:"math",...row});
  if(!itemAttempts[item.id]){
    itemAttempts[item.id]=1;
    targetResults.push({...row});
  }else itemAttempts[item.id]++;
}
function commitSelection(value){
  if(paused||locked||terminal)return;
  const item=items[index],correct=value===item.correct;
  recordAttempt(item,correct,value);sfx(correct?"progress":"recovery");
  correct?solve(item):recover(item,"role");
}
function commitNumeric(){
  if(paused||locked||terminal)return;
  const item=items[index],value=String(dialValue),correct=dialValue===item.expected;
  recordAttempt(item,correct,value);sfx(correct?"progress":"recovery");
  if(correct)solve(item);
  else if(item.checkpoint&&itemAttempts[item.id]>=2)finishWithoutIgnition(item);
  else recover(item,"minute");
}
function recover(item,kind){
  hinted[item.id]=true;
  const zone=document.querySelector(".clock-zone");
  if(zone){zone.classList.remove("recover-minute","recover-role");void zone.offsetWidth;zone.classList.add(kind==="role"?"recover-role":"recover-minute")}
  const st=document.getElementById("status");
  if(st){
    st.className="status recovery";
    st.textContent=kind==="role"?"The hands are showing short and long. Try again.":"The beam swept past. Start at 12 and count by fives again.";
  }
  emitState();
}
function solve(item){
  locked=true;solvedIds.add(item.id);completedItems++;
  const st=document.getElementById("status");
  if(st){st.className="status success";st.textContent=item.checkpoint?"The lamp is awake! The harbor can see!":"Light found! A boat moves closer."}
  updateVisibleProgress();
  post("progress_event",{nodeId:NODE,completedItems,totalItems:items.length});
  emitState(false,["Watch the lamp guide the boat"]);
  if(index===items.length-1){
    const finalItem=item;
    schedule(()=>complete(finalItem,true),850);
  }else schedule(()=>{index++;renderItem(false)},600);
}
function finishWithoutIgnition(item){
  locked=true;completedItems++;
  const st=document.getElementById("status");
  if(st){st.className="status recovery";st.textContent="The boat blinked its lantern. Your try has been saved."}
  updateVisibleProgress();
  post("progress_event",{nodeId:NODE,completedItems,totalItems:items.length});
  const finalItem=item;
  schedule(()=>complete(finalItem,false),800);
}
function updateVisibleProgress(){
  document.getElementById("progress-label").textContent=`Boats guided: ${completedItems} of ${items.length}`;
  document.querySelectorAll(".progress-dot").forEach((d,i)=>d.classList.toggle("done",i<completedItems));
  document.querySelectorAll(".charge-fill").forEach(x=>x.style.height=`${solvedIds.size*25}%`);
  document.querySelectorAll(".boat").forEach((b,i)=>b.classList.toggle("docked",solvedIds.has(items[i].id)));
}
function restartActivity(){
  if(paused)return;
  cancelPending();
  index=0;opening=true;terminal=false;locked=false;dialValue=0;completedItems=0;
  solvedIds.clear();targetResults=[];itemAttempts={};hinted={};helped={};readCounts={};
  startStamp=performance.now();totalPaused=0;pauseStamp=0;itemStart=0;completedSent=false;
  document.getElementById("progress-label").textContent=`Boats guided: 0 of ${items.length}`;
  document.querySelectorAll(".progress-dot").forEach(d=>d.classList.remove("done"));
  sfx("interaction");showOpening();
}
function complete(finalItem,full){
  if(completedSent)return;
  terminal=true;opening=false;locked=true;completedSent=true;
  document.body.classList.remove("checkpoint");
  const accuracy=targetResults.length?targetResults.filter(r=>r.correct).length/targetResults.length:0;
  screen.innerHTML=`<section class="completion"><div class="complete-card">
    <div class="badge" aria-label="Keeper's Lens clock-reading badge"><span aria-hidden="true">🕰️</span></div>
    <div class="badge-name">Keeper's Lens<span>Clock Reader Badge</span></div>
    <h2>${full?"The Lamp Room Blazes!":"The Lamp Room Remembers Your Work"}</h2>
    <p>${full?"All four lantern boats glide into the harbor. You used the long hand's minute ring and the short hand's hour ring.":"You practiced the clock's two rings. The boats will be ready for your next visit."}</p>
    ${full?`<div class="unlock-note">Unlocked workshop previews:</div><div class="stairs" role="list" aria-label="Unlocked workshop previews"><div class="stair silver" role="listitem"><small>Minute workshop preview</small>Silver Minute Stairs</div><div class="stair gold" role="listitem"><small>Hour workshop preview</small>Gold Hour Stairs</div></div>`:""}
    <button id="replay-activity" class="replay" type="button">↻ Play Again</button>
  </div></section>`;
  document.getElementById("replay-activity").addEventListener("click",restartActivity);
  emitTerminalState(finalItem);
  sfx("completion");
  post("node_complete",{nodeId:NODE,completed:true,accuracy,targetResults,timeSpent_ms:Math.max(0,Math.round(activeNow()-startStamp))});
}
function requestRead(){
  if(paused||terminal)return;
  const item=items[index];
  readCounts[item.id]=(readCounts[item.id]||0)+1;
  sfx("interaction");emitState(true);
}
readBtn.addEventListener("click",requestRead);
soundBtn.addEventListener("click",()=>{
  muted=!muted;
  soundBtn.textContent=muted?"🔇 Sound off":"🔊 Sound on";
  soundBtn.setAttribute("aria-pressed",String(muted));
  post("sunny_sound_toggle",{muted});
});
window.addEventListener("message",e=>{
  if(!e.data||e.data.type!=="sunny_companion_presence")return;
  const p=e.data.payload||{};
  let summoned;
  if(typeof p==="boolean")summoned=p;
  else if(p.summoned!=null)summoned=!!p.summoned;
  else if(p.expanded!=null)summoned=!!p.expanded;
  else if(p.open!=null)summoned=!!p.open;
  else if(p.visible!=null)summoned=!!p.visible;
  else summoned=["summoned","expanded","open","present"].includes(p.state);
  if(summoned===paused)return;
  paused=summoned;
  document.body.classList.toggle("companion-open",paused);
  document.body.classList.toggle("paused",paused);
  if(paused){
    pauseStamp=performance.now();pausePending();
    if(!terminal)helped[items[index].id]=true;
  }else{
    totalPaused+=performance.now()-pauseStamp;resumePending();
  }
});
window.SUNNY_VALIDATION_HOOKS={
 journey:[
  {itemId:"it-intro-01",steps:[
   {action:"click",selector:"#reveal-ring"},
   {action:"click",selector:'[data-option-id="opt-intro-01-a"]'}
  ]},
  {itemId:"it-intro-02",steps:[
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#plus-five"},
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#plus-five"},
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#plus-five"},
   {action:"click",selector:"#send-light"}
  ]},
  {itemId:"it-intro-03",steps:[
   {action:"click",selector:'[data-option-id="opt-intro-03-a"]'}
  ]},
  {itemId:"it-intro-04",steps:[
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#plus-five"},
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#plus-five"},
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#plus-five"},
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#plus-five"},
   {action:"click",selector:"#plus-five"},{action:"click",selector:"#send-light"}
  ]}
 ]
};
showOpening();
requestAnimationFrame(()=>{
  post("activity_ready",{nodeId:NODE});
});
})();
</script>
</body>
</html>

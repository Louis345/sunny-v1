<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunny Spelling Visual Explainer</title>
  <script src="/games/_contract.js"></script>
  <script src="/generated/openai-visual-probe/artifact-shell.js"></script>
  <style>
    :root { --night:#140738; --violet:#6d42e8; --mint:#8ff1d2; --sun:#ffd65a; --ink:#fffdf7; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      color:var(--ink);
      font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
      background:
        radial-gradient(circle at 18% 15%,rgba(109,66,232,.48),transparent 30%),
        radial-gradient(circle at 84% 78%,rgba(70,210,183,.25),transparent 32%),
        linear-gradient(145deg,#0d0526,#1b0b43 60%,#102c45);
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.38;
      background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);
      background-size:74px 74px;
    }
    button { font:inherit; }
    .page { width:min(1120px,calc(100vw - 36px)); height:100%; margin:auto; display:grid; grid-template-rows:auto 1fr auto; gap:14px; padding:18px 0; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .eyebrow { margin:0 0 3px; color:var(--mint); font-size:13px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(24px,3vw,38px); letter-spacing:-.03em; }
    .goal { margin:5px 0 0; color:rgba(255,255,255,.75); font-size:clamp(14px,1.5vw,18px); }
    .stage { min-height:0; display:grid; place-items:center; }
    .card {
      width:min(940px,100%); min-height:min(570px,calc(100vh - 170px));
      border:1px solid rgba(255,255,255,.2); border-radius:32px; padding:clamp(20px,3.6vw,42px);
      background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.055));
      box-shadow:0 28px 90px rgba(0,0,0,.34); backdrop-filter:blur(18px);
      display:grid; grid-template-rows:auto 1fr auto; gap:22px;
    }
    .strategy { text-align:center; }
    .strategy h2 { margin:0; color:var(--sun); font-size:clamp(24px,3vw,36px); }
    .steps { margin:12px auto 0; padding:0; list-style:none; display:flex; justify-content:center; flex-wrap:wrap; gap:8px; }
    .steps li { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:8px 13px; font-weight:750; }
    .word-models { display:grid; align-content:center; gap:18px; }
    .word-model { display:grid; gap:9px; justify-items:center; }
    .chunks { display:flex; justify-content:center; flex-wrap:wrap; gap:9px; }
    .chunk {
      min-width:62px; padding:13px 17px; border:2px solid rgba(255,255,255,.22); border-radius:18px;
      color:var(--ink); background:rgba(18,8,55,.75); font-size:clamp(27px,4vw,50px); font-weight:950; letter-spacing:.02em; cursor:pointer;
      opacity:.22; transform:translateY(10px) scale(.96); transition:opacity .35s,transform .35s,border-color .35s,background .35s;
    }
    .chunk.visible { opacity:1; transform:none; }
    .chunk.focus { border-color:var(--sun); background:linear-gradient(145deg,#7a48ee,#4c28bc); box-shadow:0 0 0 6px rgba(255,214,90,.12),0 13px 30px rgba(0,0,0,.25); }
    .tip { min-height:26px; margin:0; color:var(--mint); font-size:clamp(15px,1.7vw,20px); font-weight:850; opacity:0; transition:opacity .3s; }
    .tip.visible { opacity:1; }
    .controls { display:flex; align-items:center; justify-content:center; gap:14px; }
    .play, .finish { border:0; border-radius:18px; padding:14px 25px; cursor:pointer; font-size:18px; font-weight:950; }
    .play { color:#25144a; background:linear-gradient(180deg,#fff08f,var(--sun)); box-shadow:0 10px 24px rgba(255,214,90,.25); }
    .finish { color:#0b302b; background:var(--mint); }
    .progress { min-width:58px; color:rgba(255,255,255,.72); font-weight:850; text-align:center; }
    .prediction {
      position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:24px;
      background:rgba(7,2,23,.68); backdrop-filter:blur(10px);
    }
    body.question-active .prediction { display:grid; }
    .prediction-card { width:min(650px,100%); border:1px solid rgba(255,214,90,.64); border-radius:28px; padding:26px; background:#1c0d44; box-shadow:0 30px 100px rgba(0,0,0,.5); }
    .prediction-card h2 { margin:0 0 18px; font-size:clamp(22px,3vw,34px); text-align:center; }
    .choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .choice { min-height:68px; border:2px solid rgba(255,255,255,.18); border-radius:17px; color:white; background:rgba(255,255,255,.08); font-size:22px; font-weight:900; cursor:pointer; }
    .choice.selected { border-color:var(--sun); background:rgba(255,214,90,.18); }
    .feedback { min-height:24px; margin:15px 0 0; color:var(--mint); text-align:center; font-weight:800; }
    .reveal { width:100%; margin-top:10px; border:0; border-radius:16px; padding:13px; color:#20113e; background:var(--sun); font-weight:950; cursor:pointer; }
    [hidden] { display:none !important; }
    .parent { display:none; }
    body.parent-preview .parent { display:block; position:fixed; left:12px; bottom:10px; color:rgba(255,255,255,.6); font-size:11px; }
    @media (max-width:720px) {
      .page { width:min(100% - 20px,1120px); padding:10px 0; }
      .card { min-height:calc(100vh - 132px); border-radius:22px; padding:18px; gap:14px; }
      .steps { display:none; }
      .word-models { gap:10px; }
      .chunk { min-width:46px; padding:9px 12px; }
      .choices { grid-template-columns:1fr; }
    }
  </style>
</head>
<body class="child-mode">
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Spelling strategy</p>
        <h1 id="title">See the word in pieces</h1>
        <p id="goal" class="goal">Notice a helpful chunk, then try it on your own later.</p>
      </div>
    </header>
    <section class="stage" aria-live="polite">
      <div class="card">
        <div class="strategy">
          <h2 id="strategyTitle">Spot the tricky chunk</h2>
          <ol id="strategySteps" class="steps"></ol>
        </div>
        <div id="wordModels" class="word-models" data-testid="spelling-visual-model"></div>
        <div class="controls">
          <button id="playPause" class="play" type="button">Show me</button>
          <output id="progressOut" class="progress">0%</output>
          <button id="finishButton" class="finish" type="button" hidden>Done</button>
        </div>
      </div>
    </section>
    <div></div>
  </main>

  <section id="predictionPanel" class="prediction" role="dialog" aria-modal="true" aria-label="Practice check">
    <div class="prediction-card">
      <h2 id="predictionPrompt">Which chunk helps?</h2>
      <div class="choices">
        <button class="choice" type="button" data-choice="one"></button>
        <button class="choice" type="button" data-choice="two"></button>
        <button class="choice" type="button" data-choice="three"></button>
        <button class="choice" type="button" data-choice="four"></button>
      </div>
      <p id="predFeedback" class="feedback">Choose what you notice.</p>
      <button id="revealButton" class="reveal" type="button">See the strategy</button>
    </div>
  </section>
  <div id="artifactDebug" class="parent" data-parent-only="artifact-debug"></div>

  <script>
    (() => {
      "use strict";
      const DEFAULT_CONFIG = {
        artifactId: "spelling-visual-explainer-fallback",
        type: "visual-explainer",
        concept: "spelling chunk",
        learningGoal: "Notice a useful spelling chunk.",
        misconception: "Every sound maps to one letter.",
        mode: { default: "pause-for-question" },
        preview: { allowPlaythrough: true },
        narration: { enabled: false, provider: "companion", voiceId: "runtime", modelId: "runtime", audioPath: "none", scriptPath: "none", timings: [] },
        questions: [{ id:"fallback-check", prompt:"Which chunk should stay together?", correctOptionId:"right", targetConcept:"spelling.chunk", pauseAtProgress:48, scaffoldLevel:2, options:[{id:"right",label:"ight",correct:true},{id:"other",label:"ite",correct:false}] }],
        companionContext: { role:"hint_only", maxSentences:3, canRevealAnswer:true },
        spellingModel: { strategy:{ title:"Spot the chunk", steps:["Say the word.","Notice the chunk.","Keep it together."] }, words:[{ id:"fallback", text:"light", chunks:["l","ight"], focusChunk:"ight", tip:"Keep ight together." }] },
        chrome: { childShowsEvidence:false, parentShowsEvidence:true, childShowsCarePlan:false, parentShowsCarePlan:true }
      };
      const el = {
        playPause: document.getElementById("playPause"),
        progressOut: document.getElementById("progressOut"),
        predictionPanel: document.getElementById("predictionPanel"),
        predictionPrompt: document.getElementById("predictionPrompt"),
        predFeedback: document.getElementById("predFeedback"),
        revealButton: document.getElementById("revealButton"),
        finishButton: document.getElementById("finishButton"),
        artifactDebug: document.getElementById("artifactDebug"),
        choices: Array.from(document.querySelectorAll(".choice")),
      };
      let modelNodes = [];

      function renderModel(config) {
        const model = config.spellingModel || DEFAULT_CONFIG.spellingModel;
        document.getElementById("title").textContent = config.concept;
        document.getElementById("goal").textContent = config.learningGoal;
        document.getElementById("strategyTitle").textContent = model.strategy.title;
        const steps = document.getElementById("strategySteps");
        steps.replaceChildren(...model.strategy.steps.map((step) => {
          const item = document.createElement("li"); item.textContent = step; return item;
        }));
        const words = document.getElementById("wordModels");
        modelNodes = model.words.map((word) => {
          const row = document.createElement("article"); row.className = "word-model"; row.dataset.itemId = word.id;
          const chunks = document.createElement("div"); chunks.className = "chunks";
          const chunkNodes = word.chunks.map((chunk, chunkIndex) => {
            const tile = document.createElement("button"); tile.type = "button"; tile.className = "chunk"; tile.textContent = chunk;
            tile.setAttribute("aria-label", `Hear ${chunk}`);
            tile.title = `Hear ${chunk}`;
            tile.disabled = true;
            tile.addEventListener("click", () => {
              const spoken = Array.isArray(word.spokenChunks) && typeof word.spokenChunks[chunkIndex] === "string"
                ? word.spokenChunks[chunkIndex].trim() : chunk;
              if (!spoken || !tile.classList.contains("visible")) return;
              window.parent.postMessage({ type:"narration_request", version:"1.0", game:config.artifactId,
                word:word.text, text:spoken, reason:"spelling_chunk", chunk, chunkIndex }, "*");
              console.log(" 🎮 [spelling-visual-explainer] [chunk-audio] [requested]", { word:word.text, chunk });
            });
            if (chunk.toLocaleLowerCase() === word.focusChunk.toLocaleLowerCase()) tile.dataset.focus = "true";
            chunks.appendChild(tile); return tile;
          });
          const tip = document.createElement("p"); tip.className = "tip"; tip.textContent = word.tip;
          row.append(chunks, tip);
          return { row, chunkNodes, tip, word, exposureRecorded: false };
        });
        words.replaceChildren(...modelNodes.map((entry) => entry.row));
      }

      function renderScene({ progress }) {
        modelNodes.forEach((entry, rowIndex) => {
          entry.chunkNodes.forEach((chunk, chunkIndex) => {
            const threshold = 8 + rowIndex * 4 + chunkIndex * 7;
            chunk.classList.toggle("visible", progress >= threshold);
            chunk.disabled = progress < threshold;
            if (progress >= threshold && !entry.exposureRecorded && window.GameBridge) {
              entry.exposureRecorded = true;
              window.GameBridge.reportState("Spelling model shown", { spellingItemOpened:true, currentWord:entry.word.text, phase:"presentation", answerVisibility:"visible" });
            }
            chunk.classList.toggle("focus", progress >= 60 && chunk.dataset.focus === "true");
          });
          entry.tip.classList.toggle("visible", progress >= 66 + rowIndex * 3);
        });
        el.finishButton.hidden = progress < 96;
      }

      function checkEvidence({ progress, shell }) {
        if (progress >= 10) shell.emitEvidence("model-visible", "Planner-authored word chunks became visible.");
        if (progress >= 66) shell.emitEvidence("strategy-revealed", "Assisted spelling strategy was revealed.");
      }

      const shell = window.SunnyVisualLearnerArtifactShell.mount({
        defaultConfig: DEFAULT_CONFIG,
        defaultConfigPath: "./spelling-visual-explainer.config.json",
        elements: el,
        revealStartProgress: 58,
        progressPerMs: .009,
        autoCompleteOnTimelineEnd: false,
        getPhase(progress) { return progress < 10 ? "intro" : progress < 48 ? "model" : progress < 58 ? "practice-check" : progress < 96 ? "strategy" : "complete"; },
        renderScene,
        checkEvidence,
        onConfigApplied({ config }) { renderModel(config); },
        formatPredictionFeedback({ state, selectedOption, progress }) {
          if (!state.predictionMade) return "Choose what you notice.";
          if (progress < 58) return "Choice saved. Now reveal the strategy.";
          return selectedOption && selectedOption.correct ? "Yes—that chunk stays together." : "Look again at the highlighted chunk.";
        },
      });
      window.SunnySpellingVisualExplainer = shell;
      shell.start();
    })();
  </script>
</body>
</html>

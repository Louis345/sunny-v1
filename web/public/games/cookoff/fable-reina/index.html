<!-- DESIGN CARD
title: Split Second
genre / core loop (one sentence): A wrestling-mat division battler where she deals little wrestlers from a gym bag onto squad mats (or skips dealing and does it in her head), types how many are in each squad, and every right answer is a takedown on a grumpy daruma bully.
why this child (3 facts from her files this design uses):
  1. Wrestler who thrives on competition, streaks and personal bests: bouts, takedowns, a three-count pin (一 二 三), combo multiplier, belt level, and a ghost of her best run.
  2. A year ahead, checks out when it is easy or slow: the keypad is live from second one, answering without dealing is a faster, bigger HEAD PIN, and two head pins raise the fact tier mid-match.
  3. Proud of her Japanese, wants katakana, chose Matilda: Matilda coaches ringside in her own voice (すごい! やった!), and the Locker Room Mystery drops a katakana sticker of a favourite thing (スシ, ポテト, チェス...).
learning: how each target item is truly retrieved or reasoned (not guessed)
  - Every answer is a typed number; no options, and the answer numeral is never on screen before she tries.
  - Anchors 16 ÷ 4 and 24 ÷ 3 in a fresh context (wrestlers into squads): Bout 1 with dealing (the worksheet method, she counts a squad herself); one returns in Bout 2 as in-the-head retrieval framed "3 × ? = 24".
  - What she types fills "24 ÷ 3 = ▢" and "3 × ▢ = 24" at once, so the multiplication link is in her hands every item.
  - Championship: one "how many groups" round (trays of 9, counters fill a tray at a time) and one "how many in each" round, random order, so she must read the move.
  - Hints escalate only after a real typed attempt: (1) think-multiplication nudge, (2) counters dealt and one squad bounce-counted, (3) answer shown, typed in, and the fact returns later as a REMATCH.
replayability bet: personal best with live ghost delta, persistent belt level that raises fact tier, 10 katakana stickers (one per run), different least-seen facts each run, and a missed fact opens the next run as a REMATCH with a revenge bonus.
dopamine bet: each deal is a pitched pop with squash landing; a correct answer rains the rest of the counters into equal squads, Matilda throws a fireball, the daruma goes flat with shake, sparks, crowd and a slammed banner.
intuitive bet (first 10 seconds, no reading): a bag with a big 16, four empty mats, one pulsing button with a bouncing hand. Tap: a wrestler hops to mat 1; tap: mat 2. Bag empty, keypad glows. Matilda says the one instruction line aloud.
algorithm targets: retrieval practice, concrete-to-abstract fading, spaced repetition (anchor returns after 3+ items; misses return 2 items later and next session), error-pattern remediation (3-level hints), desirable difficulty (24 ÷ 4 beside 24 ÷ 3; groups vs each), mastery gating (2 head pins = tier up; miss = tier down), variable reward (locker).
how we will know it worked: evidence shows first-attempt result, hint level, ms and whether she dealt, per item. Success = anchors move from dealt to head pin within a run, first-try on next-session REMATCH, clean wins on both championship move types, then 16 ÷ 4 and 24 ÷ 3 right on paper days later.
-->

<!doctype html>
<!--
  Elli's Classroom: look-and-feel demo (2026-11-26). Not wired to Sunny.
  Shows a 3D classroom where Elli teaches rounding by pointing at a chalk number road:
  the number sits between two "houses" (tens or hundreds), we count steps to each, the closer house wins,
  and the number lands ON the house, so its ones (and tens) become 0.
  Elli's teaching tools are a small JS API (window.ElliClassroom.tools) that a future AI tutor could call;
  this page only plays a fixed demo LESSON of those calls. Her lines here are demo stand-ins: in Sunny she
  would speak in her own words from live context.
  Open: from the repo root run `python3 -m http.server 8765` then visit
  http://localhost:8765/experiments/elli-classroom/  (Elli's VRM + Mixamo clips load from web/public/).
  URL options: ?speed=2 (faster), ?auto=1 (auto-answer questions), ?auto=wrong (first tap wrong), ?standin=1
-->

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const Q = new URLSearchParams(location.search);
const SPEED = Math.max(.25, Math.min(8, +Q.get('speed') || 1));
const AUTO = Q.get('auto');
if (Q.has('debug')) document.body.classList.add('debug');   // the step ticker and tag are for us, never on her screen                       // '1' = auto-answer right, 'wrong' = first answer wrong
const VRM_URL = Q.get('vrm') || '/companions/sample.vrm';   // Elli's model (companions.generated.ts: elli -> sample.vrm)
const ANIM_DIR = '/animations/';
const log = (...a) => console.log(' 🎮 [elli-classroom]', ...a);
const $ = id => document.getElementById(id);

// ============================ tiny tween clock (game time, so ?speed works) ============================
const tweens = [];
const ease = {
  linear: k => k,
  out: k => 1 - Math.pow(1 - k, 3),
  inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
};
function tween(obj, key, to, sec, fn = ease.out) {
  return new Promise(res => tweens.push({ obj, key, from: obj[key], to, dur: sec / SPEED, t: 0, fn, res }));
}
function wait(sec) { return new Promise(res => tweens.push({ dur: sec / SPEED, t: 0, res })); }
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.dur > 0 ? tw.t / tw.dur : 1);
    if (tw.obj) tw.obj[tw.key] = tw.from + (tw.to - tw.from) * tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}

// ============================ renderer / scene / camera ============================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3cf9f);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, .1, 100);
const camBase = { center: new THREE.Vector3(.62, 1.62, -.7), dist: 7, portrait: false };
const ELLI_SPOT = { land: new THREE.Vector3(-1.6, 0, 1.15), port: new THREE.Vector3(-.4, 0, 2.3) };
function fitCamera() {
  const aspect = innerWidth / innerHeight, t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camBase.portrait = aspect < 1;                             // portrait: tighter on the board, Elli steps in front of it
  const W = camBase.portrait ? 5.7 : 7.7, H = 3.5;
  camBase.dist = Math.max(H / 2 / t, W / 2 / (t * aspect)) * 1.04;
  camBase.center.set(camBase.portrait ? 1.1 : .62, camBase.portrait ? 2.0 : 1.62, -.7);
  BOARD.y = camBase.portrait ? 2.75 : 1.95; document.body.classList.toggle('portrait', camBase.portrait);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); fxCanvas.width = innerWidth * devicePixelRatio; fxCanvas.height = innerHeight * devicePixelRatio;
}
const fxCanvas = $('fx'), fx2 = fxCanvas.getContext('2d');
addEventListener('resize', () => { fitCamera(); placeElli(); });

// ---- lights: warm afternoon sun through the window + soft sky fill ----
scene.add(new THREE.HemisphereLight(0xfff3dc, 0xc79a6a, 1.5));
const sun = new THREE.DirectionalLight(0xffe2b0, 2.6); sun.position.set(-5, 7, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 6, bottom: -3, near: 1, far: 25 }); sun.shadow.bias = -.0004; sun.shadow.radius = 4;
scene.add(sun);
const fill = new THREE.PointLight(0xffc8e0, 12, 12, 1.6); fill.position.set(3.5, 3.2, 2.5); scene.add(fill);

// ============================ canvas texture helpers ============================
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .78, metalness: 0, ...o });
function box(w, h, d, m, x, y, z, parent = scene, rounded = 0) {
  const g = rounded ? new RoundedBoxGeometry(w, h, d, 3, rounded) : new THREE.BoxGeometry(w, h, d);
  const me = new THREE.Mesh(g, m); me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; parent.add(me); return me;
}

// ============================ the room ============================
const WALL_Z = -2.2;
// floor: warm wood planks
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const cols = ['#d99b62', '#cf9058', '#e0a66c', '#c98a52'];
  for (let r = 0; r < 8; r++) { let x = (r % 2) * -128; while (x < w) { const len = 256; g.fillStyle = cols[(r * 3 + Math.floor(x / 97) + 4) % 4]; g.fillRect(x, r * 64, len, 64); g.fillStyle = '#00000022'; g.fillRect(x, r * 64, 3, 64); x += len; } g.fillStyle = '#00000026'; g.fillRect(0, r * 64 + 62, w, 2); }
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(90,50,20,${Math.random() * .06})`; g.fillRect(Math.random() * w, Math.random() * h, 40 + Math.random() * 80, 1.5); }
}, [6, 6]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 18), mat(0xffffff, { map: floorTex, roughness: .55 }));
floor.rotation.x = -Math.PI / 2; floor.position.z = 3; floor.receiveShadow = true; scene.add(floor);
// back wall: peach top, mint wainscot, chair rail
const wallTex = canvasTex(64, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#ffe7c4'); gr.addColorStop(1, '#ffd9ae'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#9fdcc8'; g.fillRect(0, h * .82, w, h * .18); g.fillStyle = '#ffffff'; g.fillRect(0, h * .815, w, 6);
  for (let x = 0; x < w; x += 32) { g.fillStyle = '#8fcfb9'; g.fillRect(x, h * .825, 3, h * .18); }
}, [1, 1]);
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 7), mat(0xffffff, { map: wallTex }));
backWall.position.set(0, 3.5, WALL_Z); backWall.receiveShadow = true; scene.add(backWall);
for (const sx of [-1, 1]) { const side = new THREE.Mesh(new THREE.PlaneGeometry(18, 7), mat(0xffe0b8)); side.position.set(sx * 9, 3.5, 6); side.rotation.y = -sx * Math.PI / 2; scene.add(side); }
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(24, 18), mat(0xfff1dd, { emissive: 0x9a8670 })); ceiling.rotation.x = Math.PI / 2; ceiling.position.set(0, 5.2, 6); scene.add(ceiling);

// window (left, behind Elli) with a sunny hill outside + sunbeam
const skyTex = canvasTex(512, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#6ec6ff'); gr.addColorStop(.7, '#bfe9ff'); gr.addColorStop(1, '#e8f8ff'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff6b0'; g.beginPath(); g.arc(390, 110, 52, 0, 7); g.fill();
  g.fillStyle = '#ffffff'; for (const [x, y, s] of [[110, 140, 1], [260, 80, .7], [330, 230, .8]]) { for (const [dx, dy, r] of [[0, 0, 34], [30, -12, 40], [64, 0, 32], [30, 10, 34]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill(); } }
  g.fillStyle = '#7ccf5f'; g.beginPath(); g.ellipse(150, 560, 320, 190, 0, 0, 7); g.fill(); g.fillStyle = '#5cbb4a'; g.beginPath(); g.ellipse(470, 590, 300, 200, 0, 0, 7); g.fill();
  g.fillStyle = '#3f9a3a'; for (const x of [70, 200, 420]) { g.fillRect(x, 360, 10, 40); g.beginPath(); g.arc(x + 5, 350, 28, 0, 7); g.fill(); }
});
const win = new THREE.Group(); win.position.set(-4.7, 2.75, WALL_Z + .02); scene.add(win);
win.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2.1), new THREE.MeshBasicMaterial({ map: skyTex, toneMapped: false })));
const frameM = mat(0xffffff, { roughness: .5 });
box(2.2, .12, .12, frameM, 0, 1.08, .05, win); box(2.3, .16, .3, frameM, 0, -1.1, .12, win); box(.12, 2.2, .12, frameM, -1.05, 0, .05, win); box(.12, 2.2, .12, frameM, 1.05, 0, .05, win);
box(.07, 2.1, .08, frameM, 0, 0, .05, win); box(2.1, .07, .08, frameM, 0, .15, .05, win);
const curtainM = mat(0xff8fb1, { roughness: .9 });
for (const sx of [-1, 1]) { const c = box(.5, 2.5, .1, curtainM, sx * 1.35, -.05, .14, win, .05); c.scale.z = .6; }
const beamTex = canvasTex(128, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,240,200,.5)'); gr.addColorStop(1, 'rgba(255,240,200,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in'; const gx = g.createLinearGradient(0, 0, w, 0); gx.addColorStop(0, 'rgba(0,0,0,0)'); gx.addColorStop(.5, 'rgba(0,0,0,1)'); gx.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gx; g.fillRect(0, 0, w, h); });
for (const [x, r] of [[-4.5, .5], [-3.9, .55]]) {
  const b = new THREE.Mesh(new THREE.PlaneGeometry(.9, 5), new THREE.MeshBasicMaterial({ map: beamTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .3 }));
  b.position.set(x + 1, 1.5, -.6); b.rotation.set(-.55, 0, r); scene.add(b);
}

// chalkboard (the teaching surface). Drawn on a 2D canvas each frame it changes.
const BW = 2048, BH = 1024, BOARD = { w: 5.2, h: 2.6, x: 1.4, y: 1.95 };
fitCamera();
const boardCanvas = document.createElement('canvas'); boardCanvas.width = BW; boardCanvas.height = BH; const bg = boardCanvas.getContext('2d');
const boardBg = document.createElement('canvas'); boardBg.width = BW; boardBg.height = BH;
(() => { const g = boardBg.getContext('2d'); const gr = g.createRadialGradient(BW / 2, BH / 2, 100, BW / 2, BH / 2, BW * .7); gr.addColorStop(0, '#2f6b55'); gr.addColorStop(1, '#214b3d'); g.fillStyle = gr; g.fillRect(0, 0, BW, BH);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * .025})`; g.beginPath(); g.ellipse(Math.random() * BW, Math.random() * BH, 80 + Math.random() * 260, 20 + Math.random() * 60, Math.random() * 3, 0, 7); g.fill(); }
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * .05})`; g.fillRect(Math.random() * BW, Math.random() * BH, 2, 2); } })();
const boardTex = new THREE.CanvasTexture(boardCanvas); boardTex.colorSpace = THREE.SRGBColorSpace; boardTex.anisotropy = 8;
const boardG = new THREE.Group(); boardG.position.set(BOARD.x, BOARD.y, WALL_Z + .06); scene.add(boardG);
const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(BOARD.w, BOARD.h), new THREE.MeshBasicMaterial({ map: boardTex, toneMapped: false }));
boardMesh.position.z = .06; boardG.add(boardMesh);
const woodM = mat(0xb9773f, { roughness: .6 });
box(BOARD.w + .36, .2, .16, woodM, 0, BOARD.h / 2 + .08, .04, boardG, .04); box(BOARD.w + .36, .2, .16, woodM, 0, -BOARD.h / 2 - .08, .04, boardG, .04);
box(.2, BOARD.h + .36, .16, woodM, -BOARD.w / 2 - .08, 0, .04, boardG, .04); box(.2, BOARD.h + .36, .16, woodM, BOARD.w / 2 + .08, 0, .04, boardG, .04);
box(BOARD.w, .06, .26, woodM, 0, -BOARD.h / 2 - .2, .16, boardG);   // chalk tray
['#ffffff', '#ffd84d', '#ff8fb1', '#7cc8ff'].forEach((c, i) => { const ch = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .22, 10), mat(c)); ch.rotation.z = Math.PI / 2; ch.position.set(-1.9 + i * .32, -BOARD.h / 2 - .14, .2); boardG.add(ch); });

// bunting across the top of the wall
const buntCols = [0xff6f91, 0xffc93c, 0x5fd8a8, 0x4aa8ff, 0xb38bff, 0xff9a52];
for (let i = 0; i < 26; i++) {
  const x = -7.6 + i * .6, y = 4.55 - Math.sin(((i % 13) / 13) * Math.PI) * .35;
  const tri = new THREE.Mesh(new THREE.ConeGeometry(.2, .42, 3), mat(buntCols[i % 6], { side: THREE.DoubleSide }));
  tri.rotation.set(0, 0, Math.PI); tri.scale.z = .15; tri.position.set(x, y, WALL_Z + .12); scene.add(tri);
}
// clock

    else if (r.correct) { setMood('surprised'); gesture('surprise_jump'); confetti(); setTimeout(() => setMood('happy'), 350 / SPEED); await wait(.45); askEl.classList.remove('on'); }
    else { setMood('gentle'); elli.st.nod = 1; await wait(.45); askEl.classList.remove('on'); }

  /** Elli plays a body animation: wave, surprise_jump, ponder_moment, dance_victory, silly_dancing. */
  async gesture(name) { gesture(name); await wait(.2); },
};
function cardHTML(c) {

  const s = String(c); return `<div class="big${/^[0-9]+$/.test(s) ? '' : ' word'}">${s.replace(/[<>&]/g, '')}</div>`;
}
/** Every answer she gives, for the parent's report and for the tutor to read back. */
function saveAnswers() {
  const name = (new URLSearchParams(location.search).get('lesson') || 'demo').replace(/\/lesson\.json$/, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
  const blob = new Blob([JSON.stringify({ lesson: name, savedAt: new Date().toISOString(), answers: state.answers }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `answers-${name}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`; a.click();

function record(kind, question, choices, answer, given, correct, t0) {

}
function houseSVG(n) {

    <circle cx="100" cy="68" r="14" fill="#fff6d8"/><rect x="128" y="136" width="22" height="46" rx="11" fill="#7a4b2e"/>
    <text x="90" y="142" font-family="Fredoka,system-ui" font-weight="700" font-size="${String(n).length > 2 ? 40 : 48}" text-anchor="middle" fill="#fff" stroke="${deep}" stroke-width="6" paint-order="stroke">${n}</text></svg>`;

const bubble = $('bubble'), askEl = $('ask');
const VOICE = {}, VIDEOS = {}, PIECES = {}; let QUIET = false; let voiceBase = '';
let audioCtx = null, analyser = null, levelBuf = null; const voice = { level: 0, playing: false };

    if (!analyser) { analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; levelBuf = new Uint8Array(analyser.fftSize); analyser.connect(audioCtx.destination); }

}
function voiceLevel() { if (!analyser || !voice.playing) return 0; analyser.getByteTimeDomainData(levelBuf); let sum = 0; for (const v of levelBuf) { const x = (v - 128) / 128; sum += x * x; } return Math.min(1, Math.sqrt(sum / levelBuf.length) * 5); }

function beat() { return .18 + Math.random() * .32; }
/** Faces: the tutor names the feeling per line; these are the VRM expressions that make it. */
const MOODS = { warm: { happy: .35 }, happy: { happy: .85 }, excited: { happy: 1, surprised: .25 }, proud: { happy: .9, relaxed: .2 }, surprised: { surprised: .8, happy: .2 },
  thinking: { relaxed: .45 }, curious: { happy: .25, surprised: .15 }, gentle: { relaxed: .5, happy: .2 }, sad: { sad: .55 }, neutral: {} };
const MOOD_KEYS = ['happy', 'surprised', 'relaxed', 'sad'];
function setMood(name) { elli.mood = { name: MOODS[name] ? name : 'warm', at: T }; }
/** Elli asks: she looks at the kid, a curious face, and the answers appear only after she has finished asking. */
function askAloud(text) {
  try { window.SunnyEvidence?.targetPresented?.({ target: text }); } catch (e) { console.warn(' 🎮 [elli-classroom] [evidence] [present-failed]', e?.message); }
  setMood('curious'); bubble.innerHTML = text; bubble.classList.add('on'); tween(elli.st, 'talk', 1, .15);
  return Promise.race([speak(text), wait(1.2 + text.split(/\s+/).length * .25)]).then(() => tween(elli.st, 'talk', 0, .2));
}
/** Wait time: if she is still thinking after 10 s, Elli leans in with a warm face, no words (and again at 25 s). */
function waitTime() {
  const timers = [10, 25].map(sec => setTimeout(() => { if (!state.waiting) return; log('[wait] [lean-in] after=' + sec + 's'); setMood('gentle');
    tween(elli.st, 'lean', 1, .6, ease.inOut).then(() => wait(2.2)).then(() => tween(elli.st, 'lean', 0, .8, ease.inOut)); elli.st.nod = 1; }, sec * 1000 / SPEED));
  return () => { timers.forEach(clearTimeout); tween(elli.st, 'lean', 0, .4); };
}
function speak(text) {
  const file = VOICE[text]; if (!file) return window.SunnyLibrary ? window.SunnyLibrary.speak(text, { reason: 'classroom_line' }).catch(e => console.warn(' 🎮 [elli-classroom] [voice] [narration-failed]', e?.message)) : Promise.resolve();
  return new Promise(res => { const a = new Audio(voiceBase + file); hookLipSync(a); a.onplay = () => { voice.playing = true; }; const guard = setTimeout(() => { voice.playing = false; res(); }, 15000);
    a.onended = a.onerror = () => { voice.playing = false; clearTimeout(guard); res(); }; a.play().catch(e => { console.warn(' 🎮 [elli-classroom] [voice] [blocked]', e?.message); clearTimeout(guard); res(); }); });
}
function elliFocus(bx, by) { const p = toBoardWorld(bx, by); elli.pointAt.copy(p); focusTarget.copy(p); }
const focusTarget = new THREE.Vector3();

// ============================ the demo lesson (a fixed script of tool calls) ============================
// In Sunny, an AI tutor would choose these calls and Elli's words from live context; this is one hand-written run.
const LESSON = [
  ['gesture', 'wave'], ['say', 'Hi there!'], ['say', "Let's find a home for 87."],
  ['drawNumberLine', 80, 90], ['say', 'Here is the number road.'],
  ['placeHouse', 80], ['placeHouse', 90], ['say', 'Two houses. 80 and 90.'],
  ['placeNumber', 87], ['say', '87 lives here.'],
  ['showTens', 87], ['say', 'See the 8? That is the 80 house.'],
  ['ask', 'Which house is closer?', [80, 90], 90],
  ['countSteps', 87, 80], ['say', '7 steps back.'],
  ['countSteps', 87, 90], ['say', 'Only 3 steps!'],
  ['showCloser', 90], ['say', '3 is less. 90 wins!'],
  ['walkTo', 87, 90], ['say', 'We land ON the house.'], ['say', 'No steps left. So 7 turns to 0!'],
  ['gesture', 'silly_dancing'], ['clearBoard'], ['say', 'Now big houses!'],
  ['drawNumberLine', 200, 300], ['placeHouse', 200], ['placeHouse', 300],
  ['placeNumber', 278], ['showTens', 278], ['say', 'The 2 means the 200 house.'],
  ['markHalfway', 200, 300], ['say', 'The middle is 250.'],
  ['ask', 'Which house is closer?', [200, 300], 300],
  ['countSteps', 278, 200], ['say', '78 steps back. Far!'],
  ['countSteps', 278, 300], ['say', 'Just 22 steps!'],
  ['showCloser', 300], ['walkTo', 278, 300], ['say', '278 goes to 300!'],
  ['gesture', 'dance_victory'], ['say', 'You did it!'],
];
const state = { step: -1, tool: '', waiting: false, done: false, autoWrongUsed: false, events: [], answers: [] };
async function run(script, depth = 0) {
  state.done = false;
  for (let i = 0; i < script.length; i++) {
    const [name, ...args] = script[i]; state.step = i; state.tool = name;
    ticker.textContent = `${name}(${args.map(a => JSON.stringify(a)).join(', ')})`;
    state.events.push(name + ':' + args.join(',')); log('[tool] [call]', ticker.textContent);
    const fn = tools[name]; if (!fn) { console.warn(' 🎮 [elli-classroom] [tool] [unknown]', name); continue; }
    const pointy = /^(showPiece|showPlaceValue|drawNumberLine|placeHouse|placeNumber|showTens|markHalfway|countSteps|walkTo|showCloser)$/.test(name);
    if (pointy) { tween(elli.st, 'point', 1, .35); tween(elli.st, 'turn', .62, .5, ease.inOut); }
    const nArgs = name === 'ask' ? 3 : name === 'askNumber' ? 2 : -1;
    const branches = nArgs > 0 && args[nArgs] && typeof args[nArgs] === 'object' && !Array.isArray(args[nArgs]) ? args[nArgs] : null;
    const result = await fn(...(nArgs > 0 ? args.slice(0, nArgs) : args));
    if (branches) { const next = result?.correct ? branches.right : branches.wrong; if (Array.isArray(next) && depth < 3) await run(next, depth + 1); }
    if (pointy && !/^(drawNumberLine|placeHouse|placeNumber|showTens|markHalfway|countSteps|walkTo|showCloser)$/.test(script[i + 1]?.[0] || '')) { tween(elli.st, 'point', 0, .4); tween(elli.st, 'turn', .28, .6, ease.inOut); }
  }
  if (depth) return;
  ticker.textContent = ''; state.done = true; state.tool = 'done'; $('replay').classList.add('on'); $('report').classList.add('on'); log('[lesson] [done] answers=' + state.answers.length); if (window.SunnyEvidence?.activityCompleted) { try { window.SunnyEvidence.activityCompleted({ result: { answers: state.answers.length } }); } catch (e) { console.error(' 🎮 [elli-classroom] [evidence] [complete-failed]', e?.message); } } else if (!AUTO && state.answers.length) saveAnswers();
}
$('report').addEventListener('click', () => { const box = $('reportBox'); box.classList.toggle('on');
  box.innerHTML = '<b>Her answers</b> (tap to close) <button id="saveAns" style="margin-left:12px;font-size:15px">💾 Save</button><table>' + state.answers.map((a, i) => `<tr><td>${i + 1}</td><td>${a.question}</td><td>${a.choices ? a.choices.join(' / ') : 'number pad'}</td><td>said <b>${a.given}</b></td><td>${a.correct == null ? 'her view' : a.correct ? '✅' : '❌ (' + a.answer + ')'}</td><td>${a.seconds}s</td></tr>`).join('') + '</table>'; });
$('reportBox').addEventListener('click', e => { if (e.target.id === 'saveAns') { e.stopPropagation(); saveAnswers(); return; } $('reportBox').classList.remove('on'); });
$('replay').addEventListener('click', () => { $('replay').classList.remove('on'); state.autoWrongUsed = false; state.answers = []; tools.clearBoard().then(() => run(currentScript)).catch(e => console.error(' 🎮 [elli-classroom] [lesson] [failed]', e)); });
let currentScript = LESSON;
window.ElliClassroom = { tools, run, LESSON, state, voice, mood: () => elli.mood.name, lean: () => elli.st.lean };

// ============================ confetti (screen space) ============================
const conf = [];
function confetti() { const W = innerWidth, cols = ['#ff6f91', '#ffc93c', '#5fd8a8', '#4aa8ff', '#b38bff'];
  for (let i = 0; i < 120; i++) conf.push({ x: W / 2 + (Math.random() - .5) * W * .4, y: innerHeight * .75, vx: (Math.random() - .5) * 900, vy: -500 - Math.random() * 700, r: Math.random() * 6, vr: (Math.random() - .5) * 12, c: cols[i % 5], life: 1.8 }); }
function drawConfetti(dt) {
  const d = devicePixelRatio; fx2.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for (let i = conf.length - 1; i >= 0; i--) { const p = conf[i]; p.vy += 1100 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt; if (p.life <= 0) { conf.splice(i, 1); continue; }

}

// ============================ main loop ============================
const clockR = new THREE.Timer(); let T = 0, nextBlink = 2;
const cardsPoint = new THREE.Vector3(), headPos = new THREE.Vector3(), camTarget = new THREE.Vector3().copy(camBase.center), gazeCam = new THREE.Vector3();
function frame() {
  // One bad frame must never stop the lesson (11/26: a negative shadow radius froze it at placeNumber).

}

    applyPoint(); if (elli.st.point < .001) { s.arms[1].rotation.z = .15; s.arms[1].rotation.x = 0; } s.head.getWorldPosition(headPos);

// ============================ boot ============================
(async () => {
  try { await Promise.race([document.fonts.load('700 80px Fredoka'), new Promise(r => setTimeout(r, 2500))]); } catch (e) { console.warn(' 🎮 [elli-classroom] [font] [fallback]', e?.message); }
  drawBoard(0); boardTex.needsUpdate = true;
  try { await loadElli(); } catch (e) { console.warn(' 🎮 [elli-classroom] [elli] [vrm-unavailable] using stand-in:', e?.message); buildStandIn(); }
  elliFocus(BW / 2, BH / 2); elli.gaze.position.copy(camera.position);
  requestAnimationFrame(frame);
  $('loading').classList.add('done');
  const lessonUrl = new URLSearchParams(location.search).get('lesson');
  const embedded = document.getElementById('classroom-lesson');

    voiceBase = embedded ? '' : lessonUrl.replace(/[^/]*$/, ''); log('[lesson] [loaded]', embedded ? 'board:' + (lesson.lessonId || '?') : lessonUrl, 'steps=' + script.length);
    // Her turn: the step's own problems, after the teaching and before the reward, said in her companion's voice.
    const own = (window.SunnyLibrary?.items || []).filter(it => Number.isFinite(Number(it.answer)));
    if (own.length) {
      const turn = [['clearBoard'], ['say', 'Your turn now!', 'happy'], ...own.map(it => ['askNumber', it.prompt, Number(it.answer)])];
      const reward = script.map(st => st[0]).lastIndexOf('playClip');
      script = reward > 0 ? [...script.slice(0, reward), ...turn, ...script.slice(reward)] : [...script, ...turn];
      log('[lesson] [her-turn] problems=' + own.length);
    }
    if (!AUTO) { const go = document.createElement('button'); go.textContent = '▶'; go.setAttribute('aria-label', 'start');
      go.style.cssText = 'position:fixed;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;border:8px solid #fff;background:#f6a83b;color:#fff;font-size:80px;z-index:50;cursor:pointer';
      document.body.append(go); await new Promise(r => go.addEventListener('click', r, { once: true })); go.remove(); }
  }
  await wait(.8);
  currentScript = script;
  try { window.SunnyEvidence?.activityStarted?.({}); } catch (e) { console.warn(' 🎮 [elli-classroom] [evidence] [start-failed]', e?.message); }
  await run(script);
})().catch(e => console.error(' 🎮 [elli-classroom] [boot] [failed]', e));

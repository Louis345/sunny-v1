<!-- DESIGN CARD
title: Midnight Spirit Toast
genre / core loop (one sentence): A cozy 3D spirit-cafe adventure: a friendly spirit floats up acting out a word, Elli says "Ready… go!", Ila types the word from memory on toast tiles, and each word she lands flips French toast onto a tower that feeds the sleepy Moon.
why this child (3 facts from her files this design uses):
  1. 100% with pictures vs 37.5% without: every word IS a spirit acting out its meaning (bowing "pardon" ghost, toothy meat-eating carnivore, robot that needs a charge, snoring dormant volcano) plus a picture bubble. Pictures carry meaning and never show letters.
  2. Rushing is her biggest enemy, "wait until I say Go" works, spelling collapses under load: typing is untimed, music ducks, keys unlock only after "Ready… go!", and a two-tap "look it over 👀 then ⭐" beat rewards fixing over speed. The speed lives in a tap-the-drops syrup shower between words.
  3. She loves French toast with syrup, spooky-friendly spirits, designing, and wants to teach Elli Japanese: she cooks a toast tower, picks its topping, and Elli cheers in Japanese words that unlock as stickers run by run.
learning: how each target item is truly retrieved or reasoned (not guessed)
  Typed recall from dictation on the game's own on-screen QWERTY (physical keys are read by key position, so a Japanese IME cannot turn letters into katakana). No letters and no letter count on screen at the first attempt. Each of the 4 words returns 2 to 4 times after gaps with a fresh context sentence each time. One felt cue per word at the trouble spot:
  - pardon: hand on the neck for the voicing buzz; the D key always buzzes (sound, wiggle, device vibration) and the T key always puffs air, so "parton" feels wrong as she types it.
  - carnivore: three bites tapped on her arm (car / ni / vore) while the spirit chomps three times, for the n-i order.
  - charge: the "sneeze" ch air-pop for the start; the look-it-over beat catches the chargr slip.
  - dormant: round yawning lips for "or".
  Hints escalate only after a real attempt: (1) nudge and cue replay, (2) pattern with trouble letters blank, (3) whole word shown, hidden, then typed. Assisted successes are reported as assisted, never first-try.
replayability bet: spirits earn stars across runs (collect and grow), one new Japanese sticker per run, new toppings unlock each run, contexts rotate, order shuffles, personal best of "on my own" words.
dopamine bet: every key pops a toast tile; a correct word turns tiles gold, Elli throws a fireball, toast flips onto the tower, then a syrup shower with rare stars and strawberries. Finale: the Moon wakes and eats the tower.
intuitive bet (first 10 seconds, no reading): a spirit floats in with a picture bubble, Elli says the sentence and the word, ✋ becomes GO!, the keyboard bounces up. The only thing to do is type. 🔊 replays the word.
algorithm targets: retrieval practice, spaced returns in-session, error-pattern remediation (d/t voicing, n-i order, ch onset, final-e slip), desirable difficulty (no length cue), mastery gating (round 3 returns only words not yet clean twice; pardon always gets the comeback boss slot), variable reward (drops, stickers, toppings).
how we will know it worked: hint-0 first-attempt accuracy on round 2 and 3 returns versus round 1 in the evidence stream; "pardon" typed with d at hint 0 in the comeback slot; then all four words correct on her own in the next Memory Check, outside this game.
fix round 2: every emoji size, font, UI layer, spirit action, Elli clip and particle is now drawn once behind the loading screen (the long frames matched first-time emoji and UI paints); per-key CSS filters and big blurred text shadows removed; if a sentence or cue voice file is missing the word itself is spoken instead; Elli stays in frame when a spirit arrives; trees no longer cover the Moon.
-->

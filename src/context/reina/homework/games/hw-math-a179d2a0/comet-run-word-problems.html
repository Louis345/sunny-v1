<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet Trail Story Sprint</title>
<style>
  :root{
    --gold:#ffd166;
    --gold-bright:#fff2b8;
    --deep1:#0b0730;
    --deep2:#1c1454;
    --deep3:#2d1e6b;
    --violet:#7b5cff;
    --pink:#ff6bd6;
    --ok:#3ee08b;
    --bad:#ff5d6c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    background:radial-gradient(circle at 50% 0%, var(--deep3), var(--deep1) 70%);
    font-family:'Trebuchet MS','Comic Sans MS',Verdana,sans-serif;
    color:#fff;
    overflow-x:hidden;
  }
  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    position:relative;
  }
  header{
    text-align:center;
    margin-bottom:10px;
    z-index:5;
  }
  header h1{
    font-size:1.8rem;
    margin:6px 0 2px;
    background:linear-gradient(90deg,var(--gold),var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 20px rgba(255,209,102,0.3);
  }
  header p{
    margin:0;
    font-size:0.95rem;
    color:#cfc9ff;
  }
  main{
    width:100%;
    max-width:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  /* ---------- Comet Stage ---------- */
  .comet-stage{
    position:relative;
    width:100%;
    min-height:420px;
    border-radius:24px;
    overflow:hidden;
    border:3px solid rgba(255,209,102,0.5);
    box-shadow:0 0 40px rgba(123,92,255,0.5), inset 0 0 60px rgba(0,0,0,0.4);
    background:#0b0730;
  }
  .starfield{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(180deg, rgba(11,7,48,0.55), rgba(11,7,48,0.85)),
      url('/generated/direct-math/hw-math-a179d2a0-comet-run-word-problems.jpeg');
    background-size:cover;
    background-position:center;
    filter:saturate(1.15);
    z-index:0;
  }
  .stage-inner{
    position:relative;
    z-index:2;
    padding:18px 20px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .trail-meter{
    display:flex;
    gap:10px;
    margin-top:2px;
  }
  .trail-meter .segment{
    width:70px;
    height:14px;
    border-radius:8px;
    background:rgba(255,255,255,0.15);
    border:2px solid rgba(255,255,255,0.35);
    transition:background .4s ease, box-shadow .4s ease;
  }
  .trail-meter[data-lit="1"] .seg-1,
  .trail-meter[data-lit="2"] .seg-1,
  .trail-meter[data-lit="2"] .seg-2{
    background:linear-gradient(90deg,var(--gold),var(--gold-bright));
    box-shadow:0 0 14px var(--gold);
  }

  .comet-track-line{
    position:relative;
    width:100%;
    height:56px;
    display:flex;
    align-items:center;
  }
  .track-path{
    position:absolute;
    left:5%;
    right:5%;
    top:50%;
    height:4px;
    background:repeating-linear-gradient(90deg, rgba(255,209,102,0.6) 0 12px, transparent 12px 24px);
    transform:translateY(-50%);
    border-radius:4px;
  }
  .comet{
    position:absolute;
    left:5%;
    top:50%;
    transform:translate(-10%,-50%);
    font-size:2.4rem;
    filter:drop-shadow(0 0 12px var(--gold));
    transition:left 1s cubic-bezier(.4,1.4,.4,1), filter .4s ease;
    z-index:3;
  }
  .comet.loopback{
    animation:loopback 0.9s ease;
  }
  @keyframes loopback{
    0%{ transform:translate(-10%,-50%) rotate(0deg); }
    40%{ transform:translate(-25%,-70%) rotate(-40deg); }
    100%{ transform:translate(-10%,-50%) rotate(0deg); }
  }
  .comet.glow-2{ filter:drop-shadow(0 0 22px var(--pink)); }
  .comet.glow-3{ filter:drop-shadow(0 0 32px #fff); }

  .story-seal{
    width:100%;
    max-width:640px;
    background:rgba(20,14,60,0.65);
    border:2px solid rgba(255,209,102,0.4);
    border-radius:18px;
    padding:16px 18px 20px;
    text-align:center;
    backdrop-filter:blur(2px);
  }
  .scene-illustration{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    min-height:70px;
    align-items:center;
    margin-bottom:8px;
  }
  .box-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    padding:6px 8px;
    min-width:44px;
  }
  .box-group .pencils{
    display:flex;
    gap:1px;
  }
  .pencil, .star{
    font-size:1rem;
    opacity:0;
    transform:scale(0.4);
    animation:pop 0.4s ease forwards;
  }
  @keyframes pop{
    to{ opacity:1; transform:scale(1); }
  }
  .star-row{
    display:flex;
    gap:3px;
  }
  .scene-prompt{
    font-size:1.05rem;
    line-height:1.4;
    margin:6px 0 14px;
    color:#fff6e0;
    font-weight:600;
  }
  .orbs-row{
    display:flex;
    justify-content:center;
    gap:24px;
    min-height:90px;
    align-items:flex-start;
    position:relative;
  }
  .orb{
    width:64px;
    height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--violet) 60%, #392a8f 100%);
    border:3px solid rgba(255,255,255,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.3rem;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    box-shadow:0 0 14px rgba(123,92,255,0.7);
    animation:fall 1.8s ease-in-out infinite alternate;
    user-select:none;
    transition:transform .15s ease;
  }
  .orb:nth-child(2){ animation-delay:0.2s; }
  .orb:nth-child(3){ animation-delay:0.4s; }
  @keyframes fall{
    from{ transform:translateY(-6px); }
    to{ transform:translateY(6px); }
  }
  .orb:active{ transform:scale(0.92); }
  .orb.correct-burst{
    animation:burst 0.6s ease forwards;
    background:radial-gradient(circle at 35% 30%, #fff, var(--ok) 60%, #17924f 100%);
    box-shadow:0 0 30px var(--ok);
  }
  @keyframes burst{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.5); opacity:1; }
    100%{ transform:scale(2.2); opacity:0; }
  }
  .orb.wrong-fizzle{
    animation:fizzle 0.6s ease forwards;
    background:radial-gradient(circle at 35% 30%, #fff, var(--bad) 60%, #7a1620 100%);
  }
  @keyframes fizzle{
    0%{ transform:scale(1) rotate(0deg); }
    50%{ transform:scale(0.85) rotate(-8deg); }
    100%{ transform:scale(0.6) rotate(8deg); opacity:0.15; }
  }

  .loop-indicator{
    display:none;
    text-align:center;
    font-size:0.95rem;
    background:rgba(255,93,108,0.18);
    border:1px solid var(--bad);
    color:#ffdde0;
    padding:8px 14px;
    border-radius:12px;
    margin-top:6px;
    max-width:340px;
  }
  .loop-indicator.show{
    display:block;
    animation:shake 0.5s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  /* ---------- Alcove ---------- */
  .alcove{
    width:100%;
    max-width:900px;
    min-height:0;
    max-height:0;
    overflow:hidden;
    border-radius:20px;
    text-align:center;
    background:radial-gradient(circle, #3a2a80, #0b0730 80%);
    border:0px solid rgba(255,209,102,0);
    transition:max-height 0.8s ease, padding 0.8s ease, border 0.4s ease;
    padding:0 18px;
  }
  .alcove[data-open="true"]{
    max-height:260px;
    padding:22px 18px;
    border:3px solid var(--gold);
    box-shadow:0 0 40px rgba(255,209,102,0.6);
  }
  .alcove-glow{
    font-size:3rem;
    animation:spin 6s linear infinite;
  }
  @keyframes spin{
    from{ filter:hue-rotate(0deg);} to{ filter:hue-rotate(360deg);}
  }
  .treasure-silhouette{
    font-size:3.4rem;
    filter:drop-shadow(0 0 20px var(--gold));
    margin-top:-10px;
  }
  .alcove p{
    font-size:1.1rem;
    color:var(--gold-bright);
    font-weight:700;
    margin-top:6px;
  }

  .completion-banner{
    display:none;
    width:100%;
    max-width:900px;
    text-align:center;
    font-size:1.5rem;
    font-weight:800;
    padding:16px 20px;
    border-radius:16px;
    background:linear-gradient(90deg, var(--gold), var(--pink));
    color:#2c1a00;
    box-shadow:0 0 30px rgba(255,209,102,0.7);
    animation:none;
  }
  .completion-banner.show{
    display:block;
    animation:pulseBanner 1.4s ease infinite;
  }
  @keyframes pulseBanner{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.03); }
  }

  #sunny-companion{
    position:fixed;
    bottom:14px;
    right:14px;
    width:1px;
    height:1px;
    z-index:50;
  }

  @media (max-width:520px){
    .orbs-row{ gap:12px; }
    .orb{ width:54px;height:54px;font-size:1.05rem; }
    header h1{ font-size:1.4rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sunny-companion"></div>

  <header>
    <h1>☄️ Comet Trail Story Sprint</h1>
    <p>Read the story, then tap the right total before the comet arrives!</p>
  </header>

  <main>
    <section class="comet-stage" data-testid="story-comet-track" data-arrived="false">
      <div class="starfield"></div>
      <div class="stage-inner">

        <div class="trail-meter" data-testid="story-trail-meter" data-lit="0">
          <div class="segment seg-1"></div>
          <div class="segment seg-2"></div>
        </div>

        <div class="comet-track-line">
          <div class="track-path"></div>
          <div class="comet" id="comet">☄️</div>
        </div>

        <div class="story-seal">
          <div class="scene-illustration" id="sceneIllustration"></div>
          <p class="scene-prompt" id="scenePrompt">Loading story…</p>
          <div class="orbs-row" id="orbsRow"></div>
        </div>

        <div class="loop-indicator" data-testid="comet-loop-indicator">
          🔄 Not quite — the comet loops back! Let's read the story again...
        </div>

      </div>
    </section>

    <section class="alcove" data-testid="story-alcove" data-open="false">
      <div class="alcove-glow">✨</div>
      <div class="treasure-silhouette">🏆</div>
      <p>A hidden treasure glimmers inside the alcove!</p>
    </section>

    <div class="completion-banner" data-testid="completion-banner">
      🎉 Story Sprint Complete! 🎉
    </div>
  </main>
</div>

<script>
(function(){
  const NODE_ID = "comet-run-word-problems";

  const scenarios = [
    {
      key: "pencils",
      prompt: "Mrs. K puts 5 pencils in each of 4 boxes. How many pencils are there in all?",
      options: [
        { label: "20", correct: true },
        { label: "9", correct: false },
        { label: "45", correct: false }
      ],
      illustrate: buildPencilIllustration
    },
    {
      key: "stars",
      prompt: "There are 3 rows of 10 stars. How many stars are there?",
      options: [
        { label: "30", correct: true },
        { label: "13", correct: false },
        { label: "103", correct: false }
      ],
      illustrate: buildStarIllustration
    }
  ];

  let currentIndex = 0;
  let trailLit = 0;
  let sceneStartTime = 0;
  let replayTimeout = null;

  const trackEl = document.querySelector('[data-testid="story-comet-track"]');
  const trailMeterEl = document.querySelector('[data-testid="story-trail-meter"]');
  const orbsRow = document.getElementById('orbsRow');
  const sceneIllustration = document.getElementById('sceneIllustration');
  const scenePrompt = document.getElementById('scenePrompt');
  const cometEl = document.getElementById('comet');
  const loopIndicator = document.querySelector('[data-testid="comet-loop-indicator"]');
  const alcoveEl = document.querySelector('[data-testid="story-alcove"]');
  const completionBanner = document.querySelector('[data-testid="completion-banner"]');

  function buildPencilIllustration(container, animate){
    container.innerHTML = '';
    for(let b=0;b<4;b++){
      const box = document.createElement('div');
      box.className = 'box-group';
      const label = document.createElement('div');
      label.style.fontSize = '0.65rem';
      label.style.color = '#ffe9a8';
      label.textContent = '📦';
      const pencilWrap = document.createElement('div');
      pencilWrap.className = 'pencils';
      for(let p=0;p<5;p++){
        const pc = document.createElement('span');
        pc.className = 'pencil';
        pc.textContent = '✏️';
        pc.style.animationDelay = (animate ? (b*0.25 + p*0.08) : 0) + 's';
        pencilWrap.appendChild(pc);
      }
      box.appendChild(label);
      box.appendChild(pencilWrap);
      container.appendChild(box);
    }
  }

  function buildStarIllustration(container, animate){
    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '4px';
    for(let r=0;r<3;r++){
      const row = document.createElement('div');
      row.className = 'star-row';
      for(let s=0;s<10;s++){
        const st = document.createElement('span');
        st.className = 'star';
        st.textContent = '⭐';
        st.style.animationDelay = (animate ? (r*0.35 + s*0.045) : 0) + 's';
        row.appendChild(st);
      }
      wrap.appendChild(row);
    }
    container.appendChild(wrap);
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function renderScene(index, animate){
    clearTimeout(replayTimeout);
    const scenario = scenarios[index];
    scenePrompt.textContent = scenario.prompt;
    scenario.illustrate(sceneIllustration, animate !== false);

    orbsRow.innerHTML = '';
    const ordered = shuffle(scenario.options);
    ordered.forEach(opt => {
      const orb = document.createElement('div');
      orb.className = 'orb';
      orb.textContent = opt.label;
      orb.setAttribute('data-testid', `orb-${scenario.key}-${opt.label}`);
      orb.setAttribute('data-correct', opt.correct ? 'true' : 'false');
      orb.addEventListener('pointerup', () => handleOrbTap(orb, scenario, opt));
      orbsRow.appendChild(orb);
    });

    sceneStartTime = Date.now();
  }

  function setLoopIndicator(show){
    if(show){
      loopIndicator.classList.add('show');
    } else {
      loopIndicator.classList.remove('show');
    }
  }

  function sendAttempt(targetId, correct, responseTimeMs){
    try{
      window.parent.postMessage({
        type: "attempt_event",
        payload: {
          domain: "math",
          targetId: targetId,
          correct: correct,
          responseTimeMs: responseTimeMs
        }
      }, "*");
    }catch(e){}
  }

  function sendComplete(){
    try{
      window.parent.postMessage({
        type: "node_complete",
        payload: { nodeId: NODE_ID, completed: true }
      }, "*");
    }catch(e){}
  }

  function handleOrbTap(orb, scenario, opt){
    const responseTimeMs = Date.now() - sceneStartTime;
    const targetId = `orb-${scenario.key}-${opt.label}`;
    sendAttempt(targetId, !!opt.correct, responseTimeMs);

    if(opt.correct){
      clearTimeout(replayTimeout);
      setLoopIndicator(false);
      orb.classList.add('correct-burst');

      trailLit = Math.min(2, trailLit + 1);
      trailMeterEl.setAttribute('data-lit', String(trailLit));

      cometEl.classList.remove('loopback');
      cometEl.style.left = trailLit === 1 ? '48%' : '92%';
      cometEl.classList.add(trailLit === 1 ? 'glow-2' : 'glow-3');

      if(currentIndex >= scenarios.length - 1){
        // Final scenario solved — arrival + reward
        trackEl.setAttribute('data-arrived', 'true');
        alcoveEl.setAttribute('data-open', 'true');
        completionBanner.classList.add('show');
        sendComplete();
      } else {
        currentIndex += 1;
        renderScene(currentIndex, true);
      }
    } else {
      orb.classList.add('wrong-fizzle');
      setLoopIndicator(true);
      cometEl.classList.add('loopback');
      replayTimeout = setTimeout(() => {
        cometEl.classList.remove('loopback');
        setLoopIndicator(false);
        renderScene(currentIndex, true);
      }, 1500);
    }
  }

  // init
  cometEl.style.left = '5%';
  renderScene(0, true);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harbor Block Builder: Skip Count</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Trebuchet MS', Verdana, sans-serif;
    background: linear-gradient(180deg,#8fd7f5 0%,#bfeaf9 40%,#3aa6c9 100%);
    min-height: 100vh; overflow-x: hidden; position: relative;
  }
  .world {
    position: relative; width: 100%; min-height: 100vh;
    background-image: url('/generated/direct-math/hw-math-a179d2a0-skip-count-blocks.jpeg');
    background-size: cover; background-position: center;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 10px 30px;
  }
  .world::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(20,60,90,0.35); pointer-events: none;
  }
  h1.title {
    position: relative; z-index: 2; color: #fff; text-align: center;
    font-size: clamp(20px, 4.5vw, 34px); margin: 4px 0 2px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
  }
  .top-bar {
    position: relative; z-index: 2; width: 100%; max-width: 700px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  button.ctrl {
    background: #fff8e1; border: 3px solid #d99a3b; border-radius: 12px;
    padding: 7px 12px; font-size: 14px; font-weight: bold; cursor: pointer;
    color: #7a4a12;
  }
  button.ctrl.active { background: #ffe08a; }
  #sound-toggle { font-size: 18px; padding: 6px 10px; }
  .instruction {
    position: relative; z-index: 2; background: rgba(255,255,255,0.92);
    border-radius: 14px; padding: 10px 18px; margin: 6px 0 10px;
    font-size: clamp(15px,3vw,19px); font-weight: bold; color: #234; text-align: center;
    max-width: 640px; box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }
  .gulls { position: absolute; z-index: 1; top: 8%; left: 0; width: 100%; height: 60px; pointer-events:none; }
  .gull { position: absolute; font-size: 22px; animation: flyacross 14s linear infinite; }
  .gull.g2 { top: 20px; animation-duration: 20s; animation-delay: 3s; font-size: 16px;}
  @keyframes flyacross {
    0% { left: -10%; transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { left: 110%; transform: translateY(0); }
  }
  .crane { position: absolute; z-index:1; bottom: 0; font-size: 60px; opacity:0.85; }
  .crane.left { left: 2%; transform-origin: bottom left; animation: swayL 6s ease-in-out infinite; }
  .crane.right { right: 2%; transform-origin: bottom right; animation: swayR 7s ease-in-out infinite; }
  @keyframes swayL { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(3deg);} }
  @keyframes swayR { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-3deg);} }

  .frame-wrap { position: relative; z-index: 2; text-align: center; margin-bottom: 10px; }
  .frame {
    display: inline-flex; gap: 10px; background: #a9713f;
    border: 8px solid #6b4423; border-radius: 16px; padding: 14px 18px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }
  .slot {
    width: 62px; height: 62px; border-radius: 10px; background: rgba(255,255,255,0.25);
    border: 3px dashed #fff2cf; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: bold; color: #fff; position: relative;
  }
  .slot.pulse { animation: slotpulse 1.2s ease-in-out infinite; }
  @keyframes slotpulse {
    0%,100% { box-shadow: 0 0 0px 0px #fff6c9; }
    50% { box-shadow: 0 0 16px 6px #fff6c9; }
  }
  .slot.filled { background: #ffd35c; color: #6b3f00; border-style: solid; }
  .prompt-text {
    position: relative; z-index: 2; color: #fff; font-size: 17px; font-weight: bold;
    margin: 4px 0 12px; text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
  }

  .options-row {
    position: relative; z-index: 2; display: flex; gap: 16px; justify-content: center;
    margin-bottom: 16px; min-height: 90px;
  }
  .block {
    width: 78px; height: 78px; border-radius: 14px;
    background: linear-gradient(160deg,#ffe27a,#ffb238);
    border: 4px solid #b5761a; font-size: 26px; font-weight: bold; color: #5a3400;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    transition: transform 0.15s ease; user-select: none;
    position: relative;
  }
  .block-visual {
    position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
    animation: floaty 2.6s ease-in-out infinite;
  }
  .block:nth-child(2) .block-visual { animation-delay: 0.3s; }
  .block:nth-child(3) .block-visual { animation-delay: 0.6s; }
  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .block.wrong-shake { animation: shake 0.5s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  .block.correct-fly { animation: flyin 0.5s forwards ease-in; }
  @keyframes flyin {
    to { transform: translateY(-140px) scale(0.6); opacity: 0; }
  }

  .bridge {
    position: relative; z-index: 2; display: flex; gap: 6px; margin: 6px 0 14px;
    background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 10px;
  }
  .seg { width: 40px; height: 14px; border-radius: 6px; background: #4b4b4b; }
  .seg.lit { background: #7CFC00; box-shadow: 0 0 8px #7CFC00; }

  .recovery {
    position: relative; z-index: 2; color: #fff; background: #d9534f; padding: 6px 14px;
    border-radius: 10px; font-weight: bold; margin-bottom: 8px; display: none;
  }
  .recovery.show { display: block; }

  .badge-area { position: relative; z-index: 2; min-height: 90px; display:flex; align-items:center; justify-content:center;}
  .completion-badge {
    display: none; background: radial-gradient(circle, #fff4c2, #ffd35c);
    border: 6px solid #b5761a; border-radius: 50%; width: 130px; height: 130px;
    align-items: center; justify-content: center; text-align: center; font-weight: bold;
    color: #6b3f00; font-size: 15px; box-shadow: 0 0 30px 10px gold;
    animation: pop 0.6s ease;
  }
  .completion-badge.show { display: flex; }
  @keyframes pop { 0%{transform:scale(0);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .marquee { position: fixed; inset:0; pointer-events:none; z-index: 5; display:none; }
  .marquee.show { display:block; }
  .marquee span {
    position: absolute; font-size: 28px; animation: twinkle 1s infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:1;} }

  .demo-note {
    position: relative; z-index:2; color:#fffbe0; font-size:13px; margin-bottom:6px; text-align:center;
    max-width: 600px;
  }
</style>
</head>
<body>
<div class="world" id="world">
  <div class="gulls">
    <div class="gull">🕊️</div>
    <div class="gull g2">🕊️</div>
  </div>
  <div class="crane left">🏗️</div>
  <div class="crane right">🏗️</div>

  <h1 class="title" data-testid="activity-title">Harbor Block Builder: Skip Count</h1>

  <div class="top-bar">
    <button class="ctrl" id="demo-toggle" data-testid="show-me-toggle">🎬 Show me</button>
    <button class="ctrl" id="sound-toggle" data-testid="sound-toggle">🔊</button>
    <button class="ctrl" id="try-toggle" data-testid="let-me-try-toggle">✏️ Let me try</button>
  </div>

  <div class="instruction" data-testid="primary-instruction" id="primary-instruction">
    Tap the glowing block that comes next to build the count!
  </div>
  <div class="demo-note" id="demo-note" style="display:none;">
    Demo: Skip-count by 3s: 3, 6, 9, __? Watch which block gets tapped!
  </div>

  <div class="prompt-text" id="prompt-text"></div>

  <div class="frame-wrap">
    <div class="frame" id="frame">
      <div class="slot filled" id="slot-a">1</div>
      <div class="slot filled" id="slot-b">2</div>
      <div class="slot filled" id="slot-c">3</div>
      <div class="slot pulse" id="slot-d">?</div>
    </div>
  </div>

  <div class="options-row" id="options-row"></div>

  <div class="recovery" data-testid="recovery-feedback" id="recovery-feedback">Not quite! Try another block.</div>

  <div class="bridge" id="bridge">
    <div class="seg" id="seg-0"></div>
    <div class="seg" id="seg-1"></div>
    <div class="seg" id="seg-2"></div>
  </div>

  <div class="badge-area">
    <div class="completion-badge" data-testid="completion-badge" id="completion-badge">
      🏆 Builder Badge!<br>Great skip-counting!
    </div>
  </div>
</div>
<div class="marquee" id="marquee"></div>
<div id="sunny-companion"></div>

<script>
(function(){
  var nodeId = "skip-count-blocks";
  var questions = [
    { id:"q1", seq:["5","10","15"], prompt:"Build the skip-count by 5s: 5, 10, 15, __?", options:[{label:"20",correct:true},{label:"16",correct:false},{label:"25",correct:false}] },
    { id:"q2", seq:["2","4","6"], prompt:"Build the skip-count by 2s: 2, 4, 6, __?", options:[{label:"7",correct:false},{label:"8",correct:true},{label:"10",correct:false}] },
    { id:"q3", seq:["10","20","30"], prompt:"Build the skip-count by 10s: 10, 20, 30, __?", options:[{label:"35",correct:false},{label:"40",correct:true},{label:"31",correct:false}] }
  ];

  var currentIndex = 0;
  var completedItems = 0;
  var totalItems = questions.length;
  var soundMuted = false;
  var demoRequested = 0;
  var demoReplayCount = 0;
  var invalidActionCount = 0;
  var timeToFirstValidActionMs = null;
  var activityStart = performance.now();
  var awaitingFirstValidAction = true;
  var audioCtx = null;
  var audioInitialized = false;
  var attemptResults = [];
  var roundStartTime = performance.now();

  function post(msg){ try{ window.parent.postMessage(msg, "*"); }catch(e){} }

  function initAudio(){
    if(audioInitialized) return;
    audioInitialized = true;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){ audioCtx = null; }
  }

  function tone(freq, dur, type, vol){
    if(soundMuted || !audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }

  function playInteraction(){ tone(520, 0.15, 'triangle', 0.12); }
  function playRecovery(){ tone(300, 0.2, 'sine', 0.1); tone(260,0.25,'sine',0.08); }
  function playProgress(){ tone(660, 0.12, 'square', 0.12); setTimeout(function(){tone(880,0.15,'square',0.12);}, 100); }
  function playCompletion(){
    var notes=[523,659,784,1047];
    notes.forEach(function(n,i){ setTimeout(function(){ tone(n,0.3,'triangle',0.15); }, i*160); });
  }

  function firstGestureHandler(){
    initAudio();
    document.removeEventListener('pointerdown', firstGestureHandler);
  }
  document.addEventListener('pointerdown', firstGestureHandler);

  var soundBtn = document.getElementById('sound-toggle');
  soundBtn.addEventListener('click', function(){
    soundMuted = !soundMuted;
    soundBtn.textContent = soundMuted ? '🔇' : '🔊';
    soundBtn.classList.toggle('active', soundMuted);
  });

  var promptText = document.getElementById('prompt-text');
  var optionsRow = document.getElementById('options-row');
  var recovery = document.getElementById('recovery-feedback');
  var slotD = document.getElementById('slot-d');
  var slotA = document.getElementById('slot-a');
  var slotB = document.getElementById('slot-b');
  var slotC = document.getElementById('slot-c');
  var badge = document.getElementById('completion-badge');
  var marquee = document.getElementById('marquee');
  var demoNote = document.getElementById('demo-note');
  var primaryInstruction = document.getElementById('primary-instruction');

  var demoMode = false;
  var tryMode = true;

  document.getElementById('demo-toggle').addEventListener('click', function(){
    demoMode = !demoMode;
    if(demoMode){
      demoRequested += 1;
      if(demoRequested > 1) demoReplayCount += 1;
      tryMode = false;
      document.getElementById('try-toggle').classList.remove('active');
      this.classList.add('active');
      runDemo();
    } else {
      this.classList.remove('active');
      demoNote.style.display = 'none';
      renderRound(currentIndex);
    }
  });

  document.getElementById('try-toggle').addEventListener('click', function(){
    tryMode = true;
    demoMode = false;
    document.getElementById('demo-toggle').classList.remove('active');
    this.classList.add('active');
    demoNote.style.display = 'none';
    renderRound(currentIndex);
  });

  function runDemo(){
    demoNote.style.display = 'block';
    primaryInstruction.textContent = "Watch how tapping the right block snaps it into place!";
    var seq = ["3","6","9"];
    slotA.textContent = seq[0]; slotB.textContent = seq[1]; slotC.textContent = seq[2];
    slotD.textContent = "?"; slotD.classList.add('pulse'); slotD.classList.remove('filled');
    promptText.textContent = "Demo: Skip-count by 3s: 3, 6, 9, __?";
    optionsRow.innerHTML = "";
    var demoOptions = [{label:"11",correct:false},{label:"12",correct:true},{label:"13",correct:false}];
    demoOptions.forEach(function(opt, idx){
      var b = document.createElement('div');
      b.className = 'block';
      b.textContent = opt.label;
      optionsRow.appendChild(b);
    });
    var blocks = optionsRow.querySelectorAll('.block');
    var correctIdx = demoOptions.findIndex(function(o){ return o.correct; });
    setTimeout(function(){
      var wrongIdx = (correctIdx + 1) % 3;
      blocks[wrongIdx].classList.add('wrong-shake');
      setTimeout(function(){ blocks[wrongIdx].classList.remove('wrong-shake'); }, 500);
    }, 900);
    setTimeout(function(){
      blocks[correctIdx].classList.add('correct-fly');
      slotD.textContent = demoOptions[correctIdx].label;
      slotD.classList.add('filled');
      slotD.classList.remove('pulse');
    }, 2000);
  }

  function resetSlotsForRound(){
    slotA.classList.add('filled'); slotB.classList.add('filled'); slotC.classList.add('filled');
    slotD.textContent = "?"; slotD.classList.remove('filled'); slotD.classList.add('pulse');
  }

  function renderRound(idx){
    if(idx >= questions.length) return;
    var q = questions[idx];
    resetSlotsForRound();
    slotA.textContent = q.seq[0];
    slotB.textContent = q.seq[1];
    slotC.textContent = q.seq[2];
    promptText.textContent = q.prompt;
    primaryInstruction.textContent = "Tap the glowing block that comes next!";
    recovery.classList.remove('show');
    optionsRow.innerHTML = "";
    roundStartTime = performance.now();

    var shuffled = q.options.slice().sort(function(){ return Math.random() - 0.5; });
    shuffled.forEach(function(opt){
      var b = document.createElement('div');
      b.className = 'block';
      b.setAttribute('data-testid', 'answer-option');
      var visual = document.createElement('div');
      visual.className = 'block-visual';
      b.appendChild(visual);
      var label = document.createElement('span');
      label.style.position = 'relative';
      label.style.zIndex = '1';
      label.textContent = opt.label;
      b.appendChild(label);
      b.addEventListener('click', function(){ handleTap(opt, b, q, idx); });
      optionsRow.appendChild(b);
    });
  }

  function handleTap(opt, blockEl, q, idx){
    if(blockEl.getAttribute('data-locked') === 'true') return;
    initAudio();
    var now = performance.now();
    if(awaitingFirstValidAction && opt.correct){
      timeToFirstValidActionMs = Math.round(now - activityStart);
      awaitingFirstValidAction = false;
    }
    var responseTimeMs = Math.round(now - roundStartTime);

    post({ type:"attempt_event", payload:{ domain:"math", targetId:q.id, correct: !!opt.correct, responseTimeMs: responseTimeMs } });

    if(opt.correct){
      blockEl.setAttribute('data-locked', 'true');
      playInteraction();
      blockEl.classList.add('correct-fly');
      recovery.classList.remove('show');
      attemptResults.push({ questionId:q.id, correct:true, responseTimeMs:responseTimeMs });

      slotD.textContent = opt.label;
      slotD.classList.add('filled');
      slotD.classList.remove('pulse');
      playProgress();
      var seg = document.getElementById('seg-' + idx);
      if(seg) seg.classList.add('lit');
      completedItems += 1;
      post({ type:"progress_event", payload:{ nodeId: nodeId, completedItems: completedItems, totalItems: totalItems } });

      currentIndex = idx + 1;
      if(currentIndex < questions.length){
        renderRound(currentIndex);
      } else {
        finishActivity();
      }
    } else {
      invalidActionCount += 1;
      playRecovery();
      blockEl.classList.add('wrong-shake');
      recovery.classList.add('show');
      attemptResults.push({ questionId:q.id, correct:false, responseTimeMs:responseTimeMs });
      setTimeout(function(){
        blockEl.classList.remove('wrong-shake');
      }, 500);
      setTimeout(function(){
        recovery.classList.remove('show');
      }, 1600);
    }
  }

  function finishActivity(){
    marquee.classList.add('show');
    marquee.innerHTML = "";
    for(var i=0;i<18;i++){
      var s = document.createElement('span');
      s.textContent = "✨";
      s.style.left = (Math.random()*100) + "%";
      s.style.top = (Math.random()*100) + "%";
      s.style.animationDelay = (Math.random()*1) + "s";
      marquee.appendChild(s);
    }
    playCompletion();
    badge.classList.add('show');
    primaryInstruction.textContent = "You built the whole bridge! Great skip-counting practice!";

    post({
      type: "node_complete",
      payload: {
        nodeId: nodeId,
        completed: true,
        attemptResults: attemptResults,
        demoRequested: demoRequested,
        demoReplayCount: demoReplayCount,
        timeToFirstValidActionMs: timeToFirstValidActionMs,
        invalidActionCount: invalidActionCount,
        soundMuted: soundMuted
      }
    });

    setTimeout(function(){ marquee.classList.remove('show'); }, 4000);
  }

  renderRound(currentIndex);
  post({ type:"activity_ready", payload:{ nodeId: nodeId } });
})();
</script>
</body>
</html>

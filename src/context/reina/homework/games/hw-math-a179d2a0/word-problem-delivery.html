<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyharbor Delivery Dash</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(180deg, #7ec8f2 0%, #b7e4ff 40%, #ffe9b3 100%);
    min-height: 100vh; overflow-x: hidden;
  }
  .sky {
    position: relative; padding: 10px 14px 4px; text-align:center;
  }
  h1.title {
    font-size: 1.7rem; margin: 4px 0; color:#1c3d5a; text-shadow: 1px 2px 0 #fff;
  }
  #topbar { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; }
  #sound-toggle {
    background:#fff; border:3px solid #1c3d5a; border-radius:20px; padding:6px 14px;
    font-size:1rem; cursor:pointer; font-weight:bold;
  }
  #artwork-strip {
    width:100%; height:110px; background-image:url('/generated/direct-math/hw-math-a179d2a0-word-problem-delivery.jpeg');
    background-size:cover; background-position:center; border-bottom:4px solid #1c3d5a;
    border-top:4px solid #1c3d5a; position:relative;
  }
  #routeMap {
    display:flex; justify-content:center; gap:10px; padding:6px; background:#ffffffaa;
  }
  .routeStar { font-size:1.6rem; opacity:0.25; transition: all .4s; }
  .routeStar.lit { opacity:1; transform: scale(1.3); }

  #stage {
    max-width:640px; margin:8px auto; background:#ffffffdd; border-radius:18px;
    border:4px solid #2a5d8a; padding:14px; position:relative; min-height:340px;
  }
  #primary-instruction {
    font-size:1.15rem; font-weight:bold; color:#1c3d5a; text-align:center; margin-bottom:6px;
  }
  #prompt {
    font-size:1.15rem; text-align:center; background:#fff3c4; border-radius:12px; padding:10px;
    margin-bottom:10px; border:2px dashed #e2a900; font-weight:600; color:#333;
  }
  #cargoScene {
    min-height:130px; display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
    align-items:flex-end; position:relative; margin-bottom:12px;
  }
  .glider {
    position:absolute; top:-6px; left:-60px; font-size:2.4rem;
    animation: flyin 1.1s ease-out forwards;
  }
  @keyframes flyin { from{ left:-60px; } to { left: 40%; } }
  .box-group {
    display:flex; gap:4px; background:#deb887; border:2px solid #8b5a2b; border-radius:8px;
    padding:6px; opacity:0; transform:translateY(-40px);
    animation: dropin .6s forwards;
  }
  .pencil { font-size:1.5rem; }
  .star-row {
    display:flex; gap:6px; opacity:0; transform:translateY(-40px);
    animation: dropin .6s forwards;
  }
  .star { font-size:1.6rem; }
  @keyframes dropin { to { opacity:1; transform:translateY(0); } }

  #stampArea { text-align:center; min-height:50px; }
  .stamp {
    display:inline-block; font-size:1.6rem; font-weight:900; color:#fff; background:#2e9e4b;
    border:4px solid #1d6b32; padding:6px 16px; border-radius:10px; transform:rotate(-8deg) scale(0);
    animation: stampIn .4s forwards;
  }
  @keyframes stampIn { to { transform:rotate(-8deg) scale(1); } }

  #answers {
    display:flex; justify-content:center; gap:14px; margin-top:8px; flex-wrap:wrap;
  }
  .answer-option {
    min-width:90px; padding:16px 20px; font-size:1.5rem; font-weight:bold;
    background:linear-gradient(180deg,#fff,#dceeff); border:3px solid #2a5d8a; border-radius:14px;
    cursor:pointer; user-select:none; transition: transform .15s;
  }
  .answer-option:active { transform:scale(0.95); }
  .answer-option.correct-glow { background:#b6f5b0; border-color:#1d7a1d; animation:glow .5s; }
  @keyframes glow { 0%,100%{box-shadow:0 0 0px #4f4;} 50%{box-shadow:0 0 20px #4f4;} }
  .answer-option.wrong-shake { animation: shake .4s; opacity:0.5; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  #recovery-feedback {
    text-align:center; color:#a33; font-weight:bold; min-height:20px; margin-top:6px;
  }

  #controlsRow { display:flex; justify-content:center; gap:10px; margin:8px 0; }
  .ctrl-btn {
    background:#fff; border:2px solid #1c3d5a; border-radius:10px; padding:8px 12px;
    cursor:pointer; font-weight:bold;
  }
  #demoArea {
    background:#eef7ff; border:2px dashed #2a5d8a; border-radius:12px; padding:10px; margin:8px 0;
    text-align:center; display:none;
  }
  #demoArea.show { display:block; }
  .demo-group { display:inline-flex; gap:10px; margin:8px; }
  .demo-box { display:flex; gap:2px; background:#deb887; border:2px solid #8b5a2b; border-radius:6px; padding:4px; }

  #completion-badge {
    display:none; text-align:center; margin:16px auto; padding:16px; max-width:600px;
    background:linear-gradient(180deg,#ffe19a,#ffb347); border:4px solid #b9770e; border-radius:16px;
    font-size:1.4rem; font-weight:900; color:#5a3200;
  }
  #completion-badge.show { display:block !important; animation:popIn .5s; }
  @keyframes popIn { from{transform:scale(0.5); opacity:0;} to{transform:scale(1);opacity:1;} }
  .blimp { font-size:2rem; animation: blimpfly 3s linear; }
  @keyframes blimpfly { from{ transform:translateX(-200px);} to{ transform:translateX(200px);} }

  #sunny-companion { position:fixed; bottom:10px; right:10px; }
</style>
</head>
<body>

<div class="sky">
  <div id="topbar">
    <h1 class="title" data-testid="activity-title">Skyharbor Delivery Dash</h1>
    <button id="sound-toggle" data-testid="sound-toggle">🔊 Sound On</button>
  </div>
</div>

<div id="artwork-strip"></div>

<div id="routeMap">
  <span class="routeStar" id="rs1">⭐</span>
  <span class="routeStar" id="rs2">⭐</span>
</div>

<div id="stage">
  <div id="primary-instruction" data-testid="primary-instruction">Read the delivery and tap the total number of items!</div>

  <div id="controlsRow">
    <button class="ctrl-btn" id="showMeBtn">🎬 Show me</button>
    <button class="ctrl-btn" id="letMeTryBtn">✋ Let me try</button>
  </div>

  <div id="demoArea">
    <div><strong>Demo: 2 groups of 2</strong></div>
    <div class="demo-group">
      <div class="demo-box"><span class="pencil">✏️</span><span class="pencil">✏️</span></div>
      <div class="demo-box"><span class="pencil">✏️</span><span class="pencil">✏️</span></div>
    </div>
    <div>2 groups of 2 = 4 total (this is just an example!)</div>
  </div>

  <div id="prompt"></div>
  <div id="cargoScene"></div>
  <div id="stampArea"></div>

  <div id="answers"></div>
  <div id="recovery-feedback" data-testid="recovery-feedback" style="visibility:hidden;">Try again! Count the groups carefully.</div>
</div>

<div id="completion-badge" data-testid="completion-badge">
  <div class="blimp">🎈🚀🎈</div>
  Deliveries Complete!<br>Great practice, Reina! 🌟
</div>

<div id="sunny-companion"></div>

<script>
(function(){
  const questions = [
    {
      id:'q1',
      prompt:"Mrs. K puts 5 pencils in each of 4 boxes. How many pencils in all?",
      options:[{label:"20",correct:true},{label:"9",correct:false},{label:"15",correct:false}],
      render: renderPencils
    },
    {
      id:'q2',
      prompt:"There are 3 rows of 10 stars. How many stars in all?",
      options:[{label:"13",correct:false},{label:"30",correct:true},{label:"33",correct:false}],
      render: renderStars
    }
  ];

  let currentIndex = 0;
  let soundMuted = false;
  let audioCtx = null;
  let firstGestureDone = false;
  let demoRequested = 0;
  let demoReplayCount = 0;
  let invalidActionCount = 0;
  let timeToFirstValidActionMs = null;
  const startTime = performance.now();
  let firstValidActionRecorded = false;
  let attemptWrongOnCurrent = false;

  function postMsg(type, payload){
    window.parent.postMessage({type, payload}, "*");
  }

  function initAudio(){
    if (firstGestureDone) return;
    firstGestureDone = true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e){ audioCtx = null; }
  }

  function beep(freq, dur, type){
    if (soundMuted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.15;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  }

  function soundInteraction(){ beep(520, 0.15, 'triangle'); }
  function soundRecovery(){ beep(300, 0.3, 'sine'); }
  function soundProgress(){ beep(700, 0.2, 'square'); setTimeout(()=>beep(900,0.2,'square'), 150); }
  function soundCompletion(){
    beep(600,0.2,'sine'); setTimeout(()=>beep(750,0.2,'sine'),200);
    setTimeout(()=>beep(900,0.35,'sine'),400);
  }

  document.getElementById('sound-toggle').addEventListener('click', function(){
    initAudio();
    soundMuted = !soundMuted;
    this.textContent = soundMuted ? '🔇 Sound Off' : '🔊 Sound On';
  });

  function renderPencils(container){
    container.innerHTML = '';
    const glider = document.createElement('div');
    glider.className = 'glider';
    glider.textContent = '🚁';
    container.appendChild(glider);
    for (let g=0; g<4; g++){
      const box = document.createElement('div');
      box.className = 'box-group';
      box.style.animationDelay = (g*0.15)+'s';
      for (let p=0; p<5; p++){
        const pencil = document.createElement('span');
        pencil.className = 'pencil';
        pencil.textContent = '✏️';
        box.appendChild(pencil);
      }
      container.appendChild(box);
    }
  }

  function renderStars(container){
    container.innerHTML = '';
    const glider = document.createElement('div');
    glider.className = 'glider';
    glider.textContent = '🚁';
    container.appendChild(glider);
    const wrap = document.createElement('div');
    wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.gap='8px'; wrap.style.width='100%'; wrap.style.alignItems='center';
    for (let r=0; r<3; r++){
      const row = document.createElement('div');
      row.className = 'star-row';
      row.style.animationDelay = (r*0.15)+'s';
      for (let s=0; s<10; s++){
        const star = document.createElement('span');
        star.className = 'star';
        star.textContent = '⭐';
        row.appendChild(star);
      }
      wrap.appendChild(row);
    }
    container.appendChild(wrap);
  }

  function shuffle(arr){
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  let questionStartTime = 0;

  function renderQuestion(idx){
    const q = questions[idx];
    document.getElementById('prompt').textContent = q.prompt;
    const cargo = document.getElementById('cargoScene');
    q.render(cargo);
    document.getElementById('stampArea').innerHTML = '';
    document.getElementById('recovery-feedback').style.visibility = 'hidden';
    attemptWrongOnCurrent = false;

    const answersDiv = document.getElementById('answers');
    answersDiv.innerHTML = '';
    const shuffledOptions = q.options;
    shuffledOptions.forEach(opt => {
      const tile = document.createElement('div');
      tile.className = 'answer-option';
      tile.setAttribute('data-testid','answer-option');
      tile.textContent = opt.label;
      tile.style.pointerEvents = 'auto';
      tile.classList.remove('correct-glow','wrong-shake');
      tile.addEventListener('click', function(){ handleAnswer(tile, opt.correct, q.id); });
      answersDiv.appendChild(tile);
    });
    questionStartTime = performance.now();
    document.getElementById('recovery-feedback').style.visibility = 'hidden';
  }

  function handleAnswer(tile, correct, qId){
    initAudio();
    const now = performance.now();
    const responseTimeMs = Math.round(now - questionStartTime);

    if (!firstValidActionRecorded){
      timeToFirstValidActionMs = Math.round(now - startTime);
      firstValidActionRecorded = true;
    }

    postMsg('attempt_event', { domain:'math', targetId:qId, correct, responseTimeMs });

    if (correct){
      soundInteraction();
      // disable further taps on this question's tiles
      tile.classList.add('correct-glow');

      // stamp animation
      const stampArea = document.getElementById('stampArea');
      const stamp = document.createElement('div');
      stamp.className = 'stamp';
      stamp.textContent = 'Delivered! ✅';
      stampArea.innerHTML = '';
      stampArea.appendChild(stamp);

      setTimeout(()=>{ soundProgress(); }, 150);

      // light route map star synchronously-ish
      const routeStar = document.getElementById('rs' + (currentIndex+1));
      if (routeStar) routeStar.classList.add('lit');

      const completedItems = currentIndex + 1;
      postMsg('progress_event', { nodeId:'word-problem-delivery', completedItems, totalItems: questions.length });

      currentIndex++;

      if (currentIndex >= questions.length){
        // completion
        showCompletion();
      } else {
        renderQuestion(currentIndex);
      }
    } else {
      invalidActionCount++;
      attemptWrongOnCurrent = true;
      tile.classList.add('wrong-shake');
      soundRecovery();
      const rec = document.getElementById('recovery-feedback');
      rec.style.visibility = 'visible';
      setTimeout(()=>{
        tile.classList.remove('wrong-shake');
      }, 450);
    }
  }

  function showCompletion(){
    soundCompletion();
    const badge = document.getElementById('completion-badge');
    badge.classList.add('show');
    badge.style.setProperty('display', 'block', 'important');
    badge.style.setProperty('visibility', 'visible', 'important');
    badge.style.setProperty('opacity', '1', 'important');
    badge.setAttribute('data-testid','completion-badge');
    badge.scrollIntoView({behavior:'smooth', block:'center'});
    postMsg('node_complete', {
      nodeId:'word-problem-delivery',
      completed:true,
      demoRequested,
      demoReplayCount,
      timeToFirstValidActionMs,
      invalidActionCount,
      soundMuted
    });
  }

  document.getElementById('showMeBtn').addEventListener('click', function(){
    initAudio();
    const demoArea = document.getElementById('demoArea');
    const wasShown = demoArea.classList.contains('show');
    if (!wasShown){
      demoRequested++;
    } else {
      demoReplayCount++;
    }
    demoArea.classList.add('show');
    soundInteraction();
    // trigger replay animation
    const boxes = demoArea.querySelectorAll('.demo-box');
    boxes.forEach(b => {
      b.style.animation = 'none';
      void b.offsetWidth;
      b.style.animation = '';
    });
  });

  document.getElementById('letMeTryBtn').addEventListener('click', function(){
    initAudio();
    document.getElementById('demoArea').classList.remove('show');
    soundInteraction();
  });

  // init
  renderQuestion(0);

  postMsg('activity_ready', { nodeId:'word-problem-delivery' });
})();
</script>

</body>
</html>

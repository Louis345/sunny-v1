<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Harbor Fact Dash</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Trebuchet MS', Verdana, sans-serif;
    background: linear-gradient(180deg,#ff9d5c 0%,#ff7e6b 25%,#3d6ba3 55%,#1c4a75 100%);
    overflow: hidden; height: 100vh; position: relative;
  }
  #world { position: absolute; inset:0; overflow:hidden; }
  #artwork {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0.55; z-index:0;
  }
  .water {
    position:absolute; bottom:0; left:0; width:200%; height:35%;
    background: repeating-linear-gradient(90deg,#1c5a8a 0 40px,#2a6ea3 40px 80px);
    animation: waterMove 4s linear infinite;
    z-index:1;
  }
  @keyframes waterMove { from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .gull { position:absolute; font-size:22px; z-index:3; animation: fly 9s linear infinite; }
  @keyframes fly {
    from { transform: translate(-10vw,0) scaleX(1); }
    50% { transform: translate(50vw,-30px) scaleX(1); }
    50.01% { transform: translate(50vw,-30px) scaleX(-1); }
    to { transform: translate(110vw,10px) scaleX(-1); }
  }
  .boat { position:absolute; bottom:6%; font-size:34px; z-index:2; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

  #topbar { position:relative; z-index:10; display:flex; justify-content:space-between; align-items:flex-start; padding:10px 14px;}
  #titleWrap { text-align:center; flex:1; }
  #activity-title {
    font-size: clamp(24px,5vw,40px); color:#fff; margin:0; font-weight:900;
    text-shadow: 2px 2px 0 #14324d, 0 0 18px rgba(255,220,140,0.8);
    letter-spacing:1px;
  }
  #primary-instruction {
    font-size: clamp(14px,2.6vw,19px); color:#fff8e6; background:rgba(20,40,60,0.55);
    display:inline-block; margin-top:6px; padding:6px 16px; border-radius:20px;
    font-weight:bold;
  }
  .ctrlBtn {
    background:#fff3d1; border:3px solid #a5622a; border-radius:12px; padding:6px 10px;
    font-size:14px; font-weight:bold; cursor:pointer; margin:2px; color:#5a3210;
  }
  #controlsTop { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }

  #stage { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; margin-top:6px; }
  #crateArea { position:relative; width:min(94vw,420px); height:110px; }
  #crate {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:220px; height:100px; background:linear-gradient(160deg,#c98a4b,#8a5a26);
    border:5px solid #5a3714; border-radius:10px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 14px rgba(0,0,0,0.4); transition: transform 0.5s ease, opacity 0.5s ease;
  }
  #crate.slidein { animation: slideIn 0.6s ease; }
  @keyframes slideIn { from{transform:translateX(120%);} to{transform:translateX(-50%);} }
  #crate.depart { transform: translate(120vw,-40px) rotate(8deg); opacity:0.2; }
  #factText { font-size:26px; font-weight:900; color:#fff2d6; text-shadow:1px 1px 2px #3a1f00; }

  #tilesRow { display:flex; gap:16px; margin-top:18px; }
  .tile {
    width:96px; height:76px; background:linear-gradient(160deg,#ffd873,#ffb238);
    border:4px solid #b96a1e; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:900; color:#5a3210; cursor:pointer; user-select:none;
    box-shadow:0 6px 0 #8a4a10; transition: box-shadow 0.1s, transform 0.1s;
  }
  .tile:active { transform: translateY(3px); box-shadow:0 3px 0 #8a4a10; }
  .tile.correctGlow { background:radial-gradient(circle, #baffc9, #58e07a); box-shadow:0 0 24px #7dff9a, 0 6px 0 #2d8f4a; }
  .tile.wrongShake { animation: shake 0.4s; background:linear-gradient(160deg,#ffb8a0,#e07050); opacity:0.6; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  #recovery-feedback {
    position:relative; z-index:10; margin-top:10px; color:#fff3d0; background:rgba(150,50,20,0.75);
    padding:6px 14px; border-radius:14px; font-weight:bold; font-size:14px; visibility:hidden;
  }
  #recovery-feedback.show { visibility:visible; }

  #dock {
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:10;
    display:flex; gap:8px; background:rgba(20,40,60,0.5); padding:8px 14px; border-radius:16px;
  }
  .flag { width:28px; height:36px; opacity:0.25; transition: opacity 0.4s, transform 0.4s; }
  .flag.lit { opacity:1; transform:scale(1.15) translateY(-4px); }
  .flagPole { width:4px; height:22px; background:#eee; margin:0 auto; }
  .flagCloth { width:22px; height:16px; background:#ff5c5c; border-radius:2px 8px 8px 2px; margin-left:2px; }

  #demoLayer {
    position:fixed; inset:0; z-index:50; background:rgba(10,20,40,0.85);
    display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  #demoLayer.show { display:flex; }
  #demoBox { background:#fff8e6; border-radius:16px; padding:20px 26px; text-align:center; max-width:340px; }
  #demoBox h3 { margin:0 0 10px; color:#5a3210; }
  #demoTiles { display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .demoTile {
    width:70px; height:56px; background:#ffd873; border:3px solid #b96a1e; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px; color:#5a3210;
  }
  .demoTile.hi { background:#7dff9a; }
  #demoCursor { font-size:26px; margin-top:8px; animation: pointBounce 1s infinite; }
  @keyframes pointBounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }
  #closeDemo { margin-top:14px; }

  #completion-badge {
    display:none; position:fixed; inset:0; z-index:60; align-items:center; justify-content:center;
    background:rgba(10,30,20,0.6); flex-direction:column;
  }
  #completion-badge.show { display:flex; }
  #banner {
    background:linear-gradient(135deg,#ffe066,#ff9d3d); border:6px solid #b9660b; border-radius:20px;
    padding:26px 34px; text-align:center; box-shadow:0 0 40px rgba(255,220,140,0.9);
  }
  #banner h1 { margin:0; font-size:30px; color:#5a2e00; }
  #banner p { color:#5a2e00; font-weight:bold; }
  .spark { position:absolute; font-size:22px; animation: pop 1.2s ease-out forwards; }
  @keyframes pop { 0%{transform:translateY(0) scale(0.3); opacity:1;} 100%{transform:translateY(-140px) scale(1.4); opacity:0;} }

  #footerRow { position:relative; z-index:10; text-align:center; margin-top:8px; }
</style>
</head>
<body>

<div id="world">
  <img id="artwork" src="/generated/direct-math/hw-math-a179d2a0-fact-dash-harbor.jpeg" alt="harbor scene">
  <div class="water"></div>
  <div class="gull" style="top:8%; animation-delay:0s;">🕊️</div>
  <div class="gull" style="top:16%; animation-delay:3s;">🕊️</div>
  <div class="gull" style="top:5%; animation-delay:6s;">🕊️</div>
  <div class="boat" style="left:5%; animation-delay:0s;">⛵</div>
  <div class="boat" style="left:70%; animation-delay:1.2s;">🚢</div>
</div>

<div id="topbar">
  <div style="width:80px;"></div>
  <div id="titleWrap">
    <h1 id="activity-title" data-testid="activity-title">Harbor Fact Dash</h1>
    <div id="primary-instruction" data-testid="primary-instruction">Tap the lantern tile with the correct answer!</div>
  </div>
  <div id="controlsTop">
    <button class="ctrlBtn" id="soundToggle" data-testid="sound-toggle">🔊 Sound On</button>
    <button class="ctrlBtn" id="showMeBtn" data-testid="show-me-toggle">🎬 Show me</button>
  </div>
</div>

<div id="stage">
  <div id="crateArea">
    <div id="crate"><div id="factText"></div></div>
  </div>
  <div id="tilesRow"></div>
  <div id="recovery-feedback" data-testid="recovery-feedback">Try again! 🌊</div>
</div>

<div id="dock" data-testid="progress-dock"></div>

<div id="demoLayer">
  <div id="demoBox">
    <h3>Show me: 3 x 4 = ?</h3>
    <div id="demoCursor">👉</div>
    <div id="demoTiles">
      <div class="demoTile" id="d0">10</div>
      <div class="demoTile" id="d1">12</div>
      <div class="demoTile" id="d2">9</div>
    </div>
    <button class="ctrlBtn" id="closeDemo">Let me try!</button>
  </div>
</div>

<div id="completion-badge" data-testid="completion-badge">
  <div id="banner">
    <h1>🏆 Fact Dash Champion! 🏆</h1>
    <p>You shipped all 5 crates! Great practice, Reina!</p>
    <button class="ctrlBtn" id="closeBanner">Nice!</button>
  </div>
</div>

<div id="sunny-companion"></div>

<script>
(function(){
  const questions = [
    {id:'q1', prompt:'5 x 2 = ?', options:[{label:'10',correct:true},{label:'7',correct:false},{label:'12',correct:false}]},
    {id:'q2', prompt:'5 x 5 = ?', options:[{label:'20',correct:false},{label:'25',correct:true},{label:'30',correct:false}]},
    {id:'q3', prompt:'5 x 10 = ?', options:[{label:'50',correct:true},{label:'15',correct:false},{label:'55',correct:false}]},
    {id:'q4', prompt:'2 x 7 = ?', options:[{label:'9',correct:false},{label:'14',correct:true},{label:'12',correct:false}]},
    {id:'q5', prompt:'10 x 4 = ?', options:[{label:'14',correct:false},{label:'40',correct:true},{label:'44',correct:false}]}
  ];

  let idx = 0;
  let soundOn = true;
  let audioCtx = null;
  let firstGestureDone = false;
  let roundStart = 0;
  let firstValidActionTime = null;
  let invalidActionCount = 0;
  let demoRequested = 0;
  let demoReplayCount = 0;
  const activityStart = Date.now();
  let processing = false;

  const tilesRow = document.getElementById('tilesRow');
  const factText = document.getElementById('factText');
  const crate = document.getElementById('crate');
  const dock = document.getElementById('dock');
  const recovery = document.getElementById('recovery-feedback');
  const soundBtn = document.getElementById('soundToggle');
  const showMeBtn = document.getElementById('showMeBtn');
  const demoLayer = document.getElementById('demoLayer');
  const closeDemo = document.getElementById('closeDemo');
  const completionBadge = document.getElementById('completion-badge');
  const closeBanner = document.getElementById('closeBanner');

  function post(type, payload){
    window.parent.postMessage({type, payload}, '*');
  }

  // build progress dock flags
  for (let i=0;i<questions.length;i++){
    const f = document.createElement('div');
    f.className = 'flag';
    f.dataset.idx = i;
    f.innerHTML = '<div class="flagPole"></div><div class="flagCloth"></div>';
    dock.appendChild(f);
  }

  function initAudio(){
    if (firstGestureDone) return;
    firstGestureDone = true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { audioCtx = null; }
  }

  function tone(freq, dur, type, delay){
    if (!soundOn || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.25, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }

  function playCorrect(){ tone(660,0.15,'triangle'); tone(880,0.2,'triangle',0.12); }
  function playRecovery(){ tone(220,0.25,'sine'); }
  function playProgress(){ tone(520,0.12,'square'); }
  function playCompletion(){
    tone(523,0.18,'triangle'); tone(659,0.18,'triangle',0.15);
    tone(784,0.18,'triangle',0.3); tone(1046,0.35,'triangle',0.45);
  }

  soundBtn.addEventListener('click', function(){
    initAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 Sound On' : '🔇 Muted';
    post('interaction_event', {kind:'soundMuted', value: !soundOn});
  });

  function renderQuestion(){
    processing = false;
    const q = questions[idx];
    factText.textContent = q.prompt;
    crate.style.transition = 'none';
    crate.classList.remove('depart');
    crate.classList.add('slidein');
    void crate.offsetWidth;
    crate.style.transition = '';
    tilesRow.innerHTML = '';
    tilesRow.style.pointerEvents = 'auto';
    q.options.forEach(function(opt, i){
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.setAttribute('data-testid','answer-option');
      tile.setAttribute('data-correct', opt.correct ? 'true':'false');
      tile.textContent = opt.label;
      tile.style.pointerEvents = 'auto';
      tile.addEventListener('click', function(){ onTileClick(tile, opt.correct, q.id); });
      tilesRow.appendChild(tile);
    });
    recovery.classList.remove('show');
    roundStart = Date.now();
  }

  function onTileClick(tile, isCorrect, targetId){
    initAudio();
    if (processing) return;
    const now = Date.now();
    if (firstValidActionTime === null) {
      firstValidActionTime = now - activityStart;
    }
    const responseTimeMs = now - roundStart;

    if (!isCorrect){
      invalidActionCount++;
      tile.classList.add('wrongShake');
      tile.style.pointerEvents = 'none';
      recovery.classList.add('show');
      playRecovery();
      post('attempt_event', {domain:'math', targetId, correct:false, responseTimeMs});
      setTimeout(function(){ tile.classList.remove('wrongShake'); tile.style.pointerEvents = ''; }, 420);
      return;
    }

    processing = true;
    tile.classList.add('correctGlow');
    crate.classList.add('depart');
    playCorrect();
    post('attempt_event', {domain:'math', targetId, correct:true, responseTimeMs});

    // light flag
    const flag = dock.querySelector('.flag[data-idx="'+idx+'"]');
    if (flag) flag.classList.add('lit');
    playProgress();

    const completedItems = idx + 1;
    post('progress_event', {nodeId:'fact-dash-harbor', completedItems, totalItems: questions.length});

    idx++;
    if (idx < questions.length){
      renderQuestion();
    } else {
      finishActivity();
    }
  }

  function finishActivity(){
    processing = false;
    completionBadge.style.display = 'flex';
    completionBadge.classList.add('show');
    completionBadge.style.visibility = 'visible';
    playCompletion();
    spawnFireworks();
    post('node_complete', {
      nodeId: 'fact-dash-harbor',
      completed: true,
      attemptResults: {
        totalItems: questions.length,
        completedItems: questions.length,
        invalidActionCount: invalidActionCount,
        timeToFirstValidActionMs: firstValidActionTime,
        demoRequested: demoRequested,
        demoReplayCount: demoReplayCount,
        soundMuted: !soundOn
      }
    });
  }

  function spawnFireworks(){
    const emojis = ['🎆','🎇','✨'];
    for (let i=0;i<10;i++){
      setTimeout(function(){
        const s = document.createElement('div');
        s.className = 'spark';
        s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        s.style.left = (10+Math.random()*80) + 'vw';
        s.style.top = (30+Math.random()*30) + 'vh';
        document.body.appendChild(s);
        setTimeout(function(){ s.remove(); }, 1300);
      }, i*120);
    }
  }

  closeBanner.addEventListener('click', function(){
    completionBadge.classList.remove('show');
  });

  // Show me demo
  let demoStep = 0;
  let demoTimer = null;
  function runDemo(){
    demoStep = 0;
    const d0 = document.getElementById('d0');
    const d1 = document.getElementById('d1');
    const d2 = document.getElementById('d2');
    [d0,d1,d2].forEach(function(d){ d.classList.remove('hi'); });
    const cursor = document.getElementById('demoCursor');
    cursor.style.transform = 'translateX(0)';
    clearTimeout(demoTimer);
    demoTimer = setTimeout(function(){
      cursor.style.transition = 'transform 0.6s ease';
      cursor.style.transform = 'translateX(-70px)';
      setTimeout(function(){
        d1.classList.add('hi');
        playCorrect();
      }, 650);
    }, 500);
  }

  showMeBtn.addEventListener('click', function(){
    initAudio();
    demoLayer.classList.add('show');
    if (demoRequested === 0){
      demoRequested = 1;
    } else {
      demoReplayCount++;
    }
    post('interaction_event', {kind:'demoRequested', value: demoRequested});
    post('interaction_event', {kind:'demoReplayCount', value: demoReplayCount});
    runDemo();
  });

  closeDemo.addEventListener('click', function(){
    demoLayer.classList.remove('show');
    clearTimeout(demoTimer);
  });

  // init
  renderQuestion();
  post('activity_ready', {nodeId:'fact-dash-harbor'});
})();
</script>
</body>
</html>

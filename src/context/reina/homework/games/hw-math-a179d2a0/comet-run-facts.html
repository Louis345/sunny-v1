<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comet Trail Facts Sprint</title>
<style>
  * { box-sizing: border-box; }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Trebuchet MS',Verdana,sans-serif;background:#050b24;}
  #app{
    position:relative;width:100%;height:100%;
    background:linear-gradient(180deg,#050b2e 0%,#0b1550 55%,#1a1a4a 100%),
      url('/generated/direct-math/hw-math-a179d2a0-comet-run-facts.jpeg');
    background-size:cover;background-blend-mode:overlay;background-position:center;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  }
  .stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 60% 70%,#fff,transparent),
    radial-gradient(2px 2px at 80% 20%,#fff,transparent),
    radial-gradient(1px 1px at 40% 80%,#fff,transparent);
    opacity:0.6;}
  h1{color:#ffe9a8;text-shadow:0 0 10px #ffcf5c;margin:10px 0 4px;font-size:1.6em;text-align:center;}
  #prompt{color:#fff;font-size:1.4em;background:rgba(20,20,60,0.6);padding:6px 20px;border-radius:20px;margin-bottom:6px;box-shadow:0 0 12px #4d6bff;}
  #comet-track{
    position:relative;width:94%;height:150px;margin:6px auto;border-radius:16px;
    background:linear-gradient(90deg,#0c1240,#1b2a6b);
    border:2px solid #3a4fb0;overflow:hidden;
  }
  #seal{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:60px;height:70px;border-radius:10px;
    background:radial-gradient(circle at 40% 30%,#c9a34f,#7a5c22);
    box-shadow:0 0 18px #ffd873;
  }
  #comet{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:50px;height:24px;transition:left 0.8s ease;
  }
  #comet .head{
    width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle,#fff,#ffd873 60%,#ff9a3c);
    box-shadow:0 0 16px 6px #ffd873;
  }
  #comet .tail{
    position:absolute;left:-70px;top:8px;width:70px;height:8px;
    background:linear-gradient(90deg,transparent,#ffd87399);
    border-radius:4px;transition:width 0.4s ease, opacity 0.4s ease;
  }
  .orb{
    position:absolute;top:-60px;width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4em;font-weight:bold;
    background:radial-gradient(circle at 35% 30%,#8fd6ff,#3167c9);
    box-shadow:0 0 14px #6fb8ff;cursor:pointer;user-select:none;
    animation:fall linear forwards;
    transition: transform 0.2s, opacity 0.3s;
  }
  @keyframes fall{ from{top:-60px;} to{top:110px;} }
  .orb.fizzle{ background:radial-gradient(circle at 35%30%,#777,#333); box-shadow:none; opacity:0.5; transform:scale(0.8);}
  .orb.burst{ background:radial-gradient(circle,#fff,#ffe27a,#ffb100); box-shadow:0 0 30px 12px #ffe27a; transform:scale(1.3); opacity:0;}
  #loop-indicator{
    position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
    color:#ffdca8;background:rgba(60,20,20,0.6);padding:4px 14px;border-radius:14px;
    font-size:0.95em; display:none;
  }
  #trail-meter{
    display:flex;gap:10px;margin:14px auto;
  }
  .seg{
    width:44px;height:20px;border-radius:8px;background:#26306b;border:2px solid #4d5bb0;
    transition:background 0.3s, box-shadow 0.3s;
  }
  .seg.lit{ background:linear-gradient(90deg,#ffd873,#ff9a3c); box-shadow:0 0 14px #ffd873; }
  #completion-banner{
    display:none;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
    background:linear-gradient(90deg,#ffd873,#ff9a3c);color:#2a1a00;padding:22px 40px;
    border-radius:20px;font-size:1.8em;font-weight:bold;box-shadow:0 0 40px #ffd873;
    text-align:center;z-index:10;
  }
  #sparks{position:absolute;inset:0;pointer-events:none;}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffd873;animation:sparkfly 1s ease-out forwards;}
  @keyframes sparkfly{ from{opacity:1;transform:translate(0,0);} to{opacity:0;transform:translate(var(--dx),var(--dy));} }
  #sunny-companion{position:absolute;bottom:10px;right:10px;width:70px;height:70px;}
</style>
</head>
<body>
<div id="app">
  <div class="stars"></div>
  <h1>🌠 Comet Trail Facts Sprint 🌠</h1>
  <div id="prompt"></div>
  <div id="comet-track" data-testid="comet-track" data-arrived="false">
    <div id="seal"></div>
    <div id="comet"><div class="tail" id="comet-tail"></div><div class="head"></div></div>
    <div id="orb-zone"></div>
    <div id="loop-indicator" data-testid="comet-loop-indicator">🔄 Comet loops back — try again!</div>
    <div id="sparks"></div>
  </div>
  <div id="trail-meter" data-testid="trail-meter" data-lit="0">
    <div class="seg" data-seg="1"></div>
    <div class="seg" data-seg="2"></div>
    <div class="seg" data-seg="3"></div>
    <div class="seg" data-seg="4"></div>
    <div class="seg" data-seg="5"></div>
  </div>
  <div id="completion-banner" data-testid="completion-banner">✨ Comet Cracked It! ✨</div>
  <div id="sunny-companion"></div>
</div>
<script>
const questions = [
  {id:'q1', seal:1, prompt:'5 x 2 = ?', options:[{label:'10',correct:true},{label:'7',correct:false},{label:'12',correct:false}]},
  {id:'q2', seal:2, prompt:'5 x 5 = ?', options:[{label:'25',correct:true},{label:'20',correct:false},{label:'10',correct:false}]},
  {id:'q3', seal:3, prompt:'5 x 10 = ?', options:[{label:'50',correct:true},{label:'15',correct:false},{label:'500',correct:false}]},
  {id:'q4', seal:4, prompt:'2 x 7 = ?', options:[{label:'14',correct:true},{label:'9',correct:false},{label:'21',correct:false}]},
  {id:'q5', seal:5, prompt:'10 x 4 = ?', options:[{label:'40',correct:true},{label:'14',correct:false},{label:'104',correct:false}]}
];

let currentIndex = 0;
let litCount = 0;
let startTime = 0;
const orbZone = document.getElementById('orb-zone');
const promptEl = document.getElementById('prompt');
const trailMeter = document.getElementById('trail-meter');
const cometTrack = document.getElementById('comet-track');
const comet = document.getElementById('comet');
const cometTail = document.getElementById('comet-tail');
const loopIndicator = document.getElementById('loop-indicator');
const sparksLayer = document.getElementById('sparks');
const banner = document.getElementById('completion-banner');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderQuestion(){
  const q = questions[currentIndex];
  promptEl.textContent = q.prompt;
  loopIndicator.style.display = 'none';
  orbZone.innerHTML = '';
  const positions = [20, 45, 70];
  const shuffledOptions = shuffle(q.options);
  shuffledOptions.forEach((opt, idx) => {
    const orb = document.createElement('div');
    orb.className = 'orb';
    orb.textContent = opt.label;
    orb.style.left = positions[idx] + '%';
    orb.style.animationDuration = (2.4 + idx*0.15) + 's';
    orb.dataset.testid = 'orb-seal' + q.seal + '-' + opt.label;
    orb.setAttribute('data-testid', orb.dataset.testid);
    orb.dataset.correct = opt.correct ? '1' : '0';
    orb.addEventListener('pointerdown', ()=>{ orb._downTime = performance.now(); });
    orb.addEventListener('pointerup', ()=> handleTap(orb, q));
    orbZone.appendChild(orb);
  });
  startTime = performance.now();
}

function handleTap(orb, q){
  if(orb.dataset.used === '1') return;
  orb.dataset.used = '1';
  const correct = orb.dataset.correct === '1';
  const responseTimeMs = Math.round(performance.now() - startTime);
  const targetId = q.id;
  window.parent.postMessage({type:"attempt_event",payload:{domain:"math", targetId, correct, responseTimeMs}}, "*");

  if(correct){
    orb.classList.add('burst');
    burstSparks(orb);
    litCount++;
    lightSegment(litCount);
    advanceComet();
    const isFinalSeal = currentIndex + 1 >= questions.length;
    if(isFinalSeal) arriveAtSeal();
    setTimeout(()=>{
      currentIndex++;
      if(currentIndex < questions.length){
        renderQuestion();
      }
    }, 700);
  } else {
    orb.classList.add('fizzle');
    loopIndicator.style.display = 'block';
    cometLoop();
    setTimeout(()=>{
      // remove all orbs and re-present fresh set for same question
      renderQuestion();
    }, 600);
  }
}

function lightSegment(count){
  trailMeter.setAttribute('data-lit', String(count));
  const segs = trailMeter.querySelectorAll('.seg');
  segs.forEach((seg, i)=>{
    if(i < count) seg.classList.add('lit');
  });
}

function advanceComet(){
  const trackWidth = cometTrack.clientWidth - 100;
  const newLeft = 10 + (litCount/5) * trackWidth;
  comet.style.left = newLeft + 'px';
  const tailWidth = 70 + litCount * 25;
  cometTail.style.width = tailWidth + 'px';
  cometTail.style.opacity = Math.min(1, 0.5 + litCount*0.12);
}

function cometLoop(){
  comet.style.transition = 'left 0.5s ease, transform 0.5s ease';
  const curLeft = parseFloat(getComputedStyle(comet).left) || 10;
  comet.style.left = Math.max(10, curLeft - 20) + 'px';
  setTimeout(()=>{
    comet.style.left = curLeft + 'px';
  }, 500);
}

function burstSparks(orb){
  const rect = orb.getBoundingClientRect();
  const trackRect = cometTrack.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const x = rect.left - trackRect.left + rect.width/2;
    const y = rect.top - trackRect.top + rect.height/2;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    const dx = (Math.random()-0.5)*140;
    const dy = (Math.random()-0.5)*140;
    s.style.setProperty('--dx', dx+'px');
    s.style.setProperty('--dy', dy+'px');
    sparksLayer.appendChild(s);
    setTimeout(()=> s.remove(), 1000);
  }
}

function arriveAtSeal(){
  const trackWidth = cometTrack.clientWidth - 100;
  comet.style.left = (10 + trackWidth) + 'px';
  cometTrack.setAttribute('data-arrived', 'true');
  promptEl.textContent = 'The comet reached the seal!';
  orbZone.innerHTML = '';
  // big spark shower
  for(let i=0;i<40;i++){
    setTimeout(()=>{
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = (40 + Math.random()*20) + '%';
      s.style.top = (30 + Math.random()*40) + '%';
      const dx = (Math.random()-0.5)*300;
      const dy = (Math.random()-0.5)*300;
      s.style.setProperty('--dx', dx+'px');
      s.style.setProperty('--dy', dy+'px');
      sparksLayer.appendChild(s);
      setTimeout(()=> s.remove(), 1000);
    }, i*20);
  }
  setTimeout(()=>{
    banner.style.display = 'block';
    window.parent.postMessage({type:"node_complete",payload:{nodeId:"comet-run-facts",completed:true}}, "*");
  }, 500);
}

renderQuestion();
</script>
</body>
</html>

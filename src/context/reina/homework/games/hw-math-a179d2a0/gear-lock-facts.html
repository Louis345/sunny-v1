<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gearlock Facts Chamber</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    background: radial-gradient(circle at 50% 20%, #2e1f5e 0%, #150f2e 60%, #0a0716 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    color: #fff2d6;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 8px 30px;
  }
  h1 {
    margin: 6px 0 2px; font-size: 1.5rem; text-align: center;
    color: #ffd76b; text-shadow: 0 0 10px #ffb347;
  }
  #progress-arc {
    display: flex; gap: 10px; margin: 8px 0 14px;
  }
  .star-crystal {
    width: 26px; height: 26px; clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    background: #4a3a70; transition: all .4s ease;
    box-shadow: 0 0 4px #0008 inset;
  }
  .star-crystal.lit {
    background: #ffe066;
    box-shadow: 0 0 14px 4px #ffd76b, 0 0 4px #fff inset;
  }
  #chamber-wrap {
    position: relative; width: min(90vw, 420px); height: min(90vw, 420px);
    border-radius: 50%;
    background: url('/generated/direct-math/hw-math-a179d2a0-gear-lock-facts.jpeg') center/cover;
    box-shadow: 0 0 40px 8px #ffb34766, 0 0 0 8px #2a1c4d inset;
    display: flex; align-items: center; justify-content: center;
    transition: filter .6s ease, box-shadow .6s ease;
  }
  #chamber-wrap.door-open {
    filter: brightness(1.5) saturate(1.3);
    box-shadow: 0 0 80px 24px #ffe066cc, 0 0 0 8px #ffe066 inset;
  }
  #gear-chamber {
    position: relative; width: 78%; height: 78%; border-radius: 50%;
    background: radial-gradient(circle, #1c1330cc 0%, #10091fcc 80%);
    display: flex; align-items: center; justify-content: center;
    border: 4px solid #6b4f2a;
  }
  .gear {
    position: absolute; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 5px dashed #b8863b;
    background: radial-gradient(circle, #3a2a12 0%, #1a1108 100%);
    transition: transform .6s ease, box-shadow .6s ease, border-color .4s ease;
    color: #ffe4a3; font-weight: bold; text-align: center;
  }
  .gear[data-locked="true"] {
    border-style: solid; border-color: #ffd76b;
    box-shadow: 0 0 20px 6px #ffd76bcc;
    animation: spinLock .7s ease;
  }
  @keyframes spinLock {
    0% { transform: rotate(0deg) scale(1); }
    60% { transform: rotate(300deg) scale(1.06); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .gear.wobble { animation: wobble .4s ease; }
  @keyframes wobble {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-6deg); }
    75% { transform: rotate(6deg); }
  }
  #gear1 { width: 92%; height: 92%; }
  #gear2 { width: 74%; height: 74%; }
  #gear3 { width: 56%; height: 56%; }
  #gear4 { width: 38%; height: 38%; }
  #gear5 { width: 22%; height: 22%; z-index: 5; }
  .gear-prompt { font-size: 0.8rem; }
  #gear2 .gear-prompt, #gear3 .gear-prompt { font-size: 0.75rem; }
  #gear4 .gear-prompt, #gear5 .gear-prompt { font-size: 0.6rem; }
  .notch {
    position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 40px; border-radius: 8px;
    background: #2a1c4d; border: 3px dashed #ffd76b;
    display: flex; align-items: center; justify-content: center;
    color: #ffd76b; font-size: 0.7rem;
  }
  .notch.dragover { background: #4d3a80; box-shadow: 0 0 12px #ffd76b; }
  #tray {
    margin-top: 26px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    max-width: 480px;
  }
  .gear-tooth {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #c98f2b);
    border: 3px solid #7a5720;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 1.1rem; color: #3a250a;
    cursor: grab; box-shadow: 0 3px 6px #0006;
    transition: transform .3s ease, opacity .3s ease;
  }
  .gear-tooth.used { opacity: 0.25; pointer-events: none; }
  .gear-tooth:active { cursor: grabbing; }
  .recovery-hint {
    display: none; margin-top: 10px; background: #3a2a5e; border: 2px solid #ffd76b;
    border-radius: 12px; padding: 8px 14px; font-size: 0.9rem; text-align: center; max-width: 340px;
  }
  .recovery-hint.show { display: block; }
  #owl {
    font-size: 1.6rem; margin-right: 6px;
  }
  #completion-banner {
    display: none; position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%);
    background: linear-gradient(90deg, #ffd76b, #ffb347, #ffd76b);
    color: #3a250a; font-size: 1.8rem; font-weight: bold; padding: 20px 40px;
    border-radius: 20px; box-shadow: 0 0 60px 20px #ffe066cc; text-align: center; z-index: 50;
  }
  #completion-banner.show { display: block; animation: bannerPop .6s ease; }
  @keyframes bannerPop {
    0% { transform: translate(-50%,-50%) scale(0.4); opacity:0; }
    100% { transform: translate(-50%,-50%) scale(1); opacity:1; }
  }
  #sunny-companion { position: fixed; bottom: 10px; right: 10px; }
  .current-marker {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 0.65rem; color: #ffd76b; text-shadow: 0 0 6px #ffb347;
  }
</style>
</head>
<body>

<h1>Gearlock Facts Chamber</h1>
<div id="progress-arc" data-testid="progress-arc" data-filled="0"></div>

<div id="chamber-wrap">
  <div id="gear-chamber" data-testid="gear-chamber">
    <div class="gear" id="gear1" data-testid="gear1" data-locked="false">
      <div class="gear-prompt">5 x 2 = ?</div>
      <div class="notch" data-testid="gear-notch-gear1" data-gear="gear1">?</div>
    </div>
    <div class="gear" id="gear2" data-testid="gear2" data-locked="false">
      <div class="gear-prompt">5 x 5 = ?</div>
      <div class="notch" data-testid="gear-notch-gear2" data-gear="gear2">?</div>
    </div>
    <div class="gear" id="gear3" data-testid="gear3" data-locked="false">
      <div class="gear-prompt">5 x 10 = ?</div>
      <div class="notch" data-testid="gear-notch-gear3" data-gear="gear3">?</div>
    </div>
    <div class="gear" id="gear4" data-testid="gear4" data-locked="false">
      <div class="gear-prompt">2 x 7 = ?</div>
      <div class="notch" data-testid="gear-notch-gear4" data-gear="gear4">?</div>
    </div>
    <div class="gear" id="gear5" data-testid="gear5" data-locked="false">
      <div class="gear-prompt">10 x 4 = ?</div>
      <div class="notch" data-testid="gear-notch-gear5" data-gear="gear5">?</div>
    </div>
  </div>
</div>
<div id="chamber-door" data-testid="chamber-door" data-open="false" style="display:none;"></div>

<div id="recovery-wrap"></div>

<div id="tray"></div>

<div id="completion-banner" data-testid="completion-banner">✨ Gate Cracked! ✨<br><span style="font-size:1rem;">Reina unlocked the chamber!</span></div>

<div id="sunny-companion"></div>

<script>
  const questions = [
    { id:'q1', gear:'gear1', prompt:'5 x 2 = ?', answer:'10', options:['10','7','12','52'] },
    { id:'q2', gear:'gear2', prompt:'5 x 5 = ?', answer:'25', options:['20','25','10','55'] },
    { id:'q3', gear:'gear3', prompt:'5 x 10 = ?', answer:'50', options:['15','50','500','105'] },
    { id:'q4', gear:'gear4', prompt:'2 x 7 = ?', answer:'14', options:['14','9','27','21'] },
    { id:'q5', gear:'gear5', prompt:'10 x 4 = ?', answer:'40', options:['40','14','104','400'] }
  ];

  // Build unique tray of all option labels (dedup) mapping tooth value -> which gears it can answer correctly
  const allLabelsSet = new Set();
  questions.forEach(q => q.options.forEach(o => allLabelsSet.add(o)));
  const allLabels = Array.from(allLabelsSet);

  const arcEl = document.getElementById('progress-arc');
  const trayEl = document.getElementById('tray');
  const recoveryWrap = document.getElementById('recovery-wrap');

  let lockedCount = 0;
  let draggedLabel = null;
  let startTime = {};

  // build progress stars
  for (let i=0;i<5;i++){
    const s = document.createElement('div');
    s.className = 'star-crystal';
    arcEl.appendChild(s);
  }

  function updateArc(){
    arcEl.setAttribute('data-filled', String(lockedCount));
    const stars = arcEl.querySelectorAll('.star-crystal');
    stars.forEach((s,idx)=>{ s.classList.toggle('lit', idx < lockedCount); });
  }

  // build recovery hints per gear (hidden initially)
  questions.forEach(q=>{
    const hint = document.createElement('div');
    hint.className = 'recovery-hint';
    hint.setAttribute('data-testid', 'recovery-hint-' + q.gear);
    hint.innerHTML = '<span id="owl">🦉</span>Hmm, try counting by ' + hintNumber(q) + '! The correct tooth fits snugly.';
    recoveryWrap.appendChild(hint);
  });

  function hintNumber(q){
    if (q.prompt.includes('5 x')) return '5s';
    if (q.prompt.includes('2 x')) return '2s';
    if (q.prompt.includes('10 x')) return '10s';
    return 'again';
  }

  // build tray teeth
  allLabels.forEach(label=>{
    const tooth = document.createElement('div');
    tooth.className = 'gear-tooth';
    tooth.setAttribute('draggable','true');
    tooth.setAttribute('data-testid', 'gear-tooth-' + label);
    tooth.setAttribute('data-value', label);
    tooth.textContent = label;

    tooth.addEventListener('dragstart', (e)=>{
      draggedLabel = label;
      startTime[label] = Date.now();
      if (e.dataTransfer) e.dataTransfer.setData('text/plain', label);
      tooth.style.opacity = '0.5';
    });
    tooth.addEventListener('dragend', ()=>{
      tooth.style.opacity = '1';
    });
    trayEl.appendChild(tooth);
  });

  function markToothUsed(label){
    const t = document.querySelector('[data-testid="gear-tooth-' + label + '"]');
    if (t) t.classList.add('used');
  }

  questions.forEach(q=>{
    const notch = document.querySelector('[data-testid="gear-notch-' + q.gear + '"]');
    const gearEl = document.querySelector('[data-testid="' + q.gear + '"]');

    notch.addEventListener('dragenter', (e)=>{ e.preventDefault(); notch.classList.add('dragover'); });
    notch.addEventListener('dragover', (e)=>{ e.preventDefault(); notch.classList.add('dragover'); });
    notch.addEventListener('dragleave', ()=>{ notch.classList.remove('dragover'); });

    notch.addEventListener('drop', (e)=>{
      e.preventDefault();
      notch.classList.remove('dragover');
      if (gearEl.getAttribute('data-locked') === 'true') return;

      let dropped = draggedLabel;
      if (e.dataTransfer) {
        const dt = e.dataTransfer.getData('text/plain');
        if (dt) dropped = dt;
      }
      if (!dropped) return;

      const t0 = startTime[dropped] || Date.now();
      const responseTimeMs = Date.now() - t0;
      const correct = (dropped === q.answer);

      window.parent.postMessage({
        type: 'attempt_event',
        payload: { domain:'math', targetId:q.id, correct, responseTimeMs }
      }, '*');

      const hintEl = document.querySelector('[data-testid="recovery-hint-' + q.gear + '"]');

      if (correct) {
        hintEl.classList.remove('show');
        notch.textContent = dropped;
        gearEl.setAttribute('data-locked','true');
        markToothUsed(dropped);
        lockedCount++;
        updateArc();
        checkCompletion();
      } else {
        gearEl.classList.add('wobble');
        setTimeout(()=>gearEl.classList.remove('wobble'), 420);
        hintEl.classList.add('show');
        setTimeout(()=>hintEl.classList.remove('show'), 3200);
      }
      draggedLabel = null;
    });
  });

  function checkCompletion(){
    if (lockedCount >= 5) {
      const wrap = document.getElementById('chamber-wrap');
      const door = document.getElementById('chamber-door');
      wrap.classList.add('door-open');
      door.setAttribute('data-open','true');
      setTimeout(()=>{
        document.getElementById('completion-banner').classList.add('show');
        window.parent.postMessage({
          type:'node_complete',
          payload:{ nodeId:'gear-lock-facts', completed:true }
        }, '*');
      }, 500);
    }
  }

  updateArc();
</script>
</body>
</html>

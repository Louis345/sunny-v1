<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sunny Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#140d33}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0%,#3b1f8f,#0b0620 70%);font-family:'Fredoka',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;overflow:hidden}
h1{margin:22px 0 4px;text-align:center;font-size:64px;letter-spacing:2px;text-shadow:0 5px 0 #6b3fd6,0 0 40px #b38cff}
.kids{display:flex;gap:46px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.kid{background:#ffffff10;border:3px solid #ffffff25;border-radius:32px;padding:20px 26px 26px;min-width:420px}
.kid h2{margin:0 0 14px;text-align:center;font-size:40px}
.row{display:flex;gap:22px;justify-content:center}
.tile{width:190px;height:230px;border-radius:26px;border:none;cursor:pointer;position:relative;font:700 30px 'Fredoka';color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 0 #0006;transition:transform .15s}
.tile:active{transform:translateY(5px) scale(.98)}
.tile .icon{font-size:96px;filter:drop-shadow(0 6px 10px #0008);transition:transform .5s cubic-bezier(.2,1.8,.4,1)}
.tile.a{background:linear-gradient(160deg,#ff6fa8,#b2368f)} .tile.b{background:linear-gradient(160deg,#4fc3ff,#2d5bd6)}
.tile.open .icon{transform:scale(1.25) rotate(-8deg)}
.plays{position:absolute;top:10px;right:14px;font-size:20px;background:#0006;border-radius:999px;padding:2px 10px}
.rate{display:none;position:fixed;inset:0;background:#0b0620ee;place-items:center;text-align:center}
.rate.show{display:grid}
.faces{display:flex;gap:26px;margin-top:20px}
.face{font-size:110px;background:#ffffff14;border:3px solid #ffffff30;border-radius:30px;padding:10px 22px;cursor:pointer}
.parent{position:fixed;left:14px;bottom:10px;font-size:15px;opacity:.35;white-space:pre}
</style></head><body>
<h1>Sunny Arcade</h1>
<div class="kids" id="kids"></div>
<div class="rate" id="rate"><div><div style="font-size:44px" id="rateQ">How fun was it?</div><div class="faces" id="faces"></div></div></div>
<div class="parent" id="parent"></div>
<script>
// Blind cook-off lobby: each child sees Game A and Game B; which chef made which is hidden and randomized once per device.
const ENTRIES = { reina: ['opus-reina', 'fable-reina'], ila: ['opus-ila', 'fable-ila'] };
const log = (...a) => console.log(' 🎮 [arcade-lobby]', ...a);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn(' 🎮 [arcade-lobby] [storage] [blocked]', e.message); } } };
// ?reset clears this device's shuffle, plays and ratings (owner reset before the kids' blind test, 11/11)
if (new URLSearchParams(location.search).has('reset')) { ['cookoff-kids-map', 'cookoff-kids-stats', 'cookoff-kids-last'].forEach(k => { try { localStorage.removeItem(k); } catch (e) { console.warn(' 🎮 [arcade-lobby] [reset] [failed]', e.message); } }); history.replaceState(null, '', location.pathname); log('[reset]'); }
let map = store.get('cookoff-kids-map', null);
if (!map) { map = Object.fromEntries(Object.entries(ENTRIES).map(([k, v]) => [k, Math.random() < .5 ? v : [...v].reverse()])); store.set('cookoff-kids-map', map); log('[map] [randomized]'); }
const stats = store.get('cookoff-kids-stats', {});   // { entryId: { plays, ratings: [] } }
const S = id => (stats[id] ??= { plays: 0, ratings: [] });
const ICON = ['🎁', '🎁'], OPEN = ['🌟', '🚀'];
let ctx; function chime(f) { try { ctx ??= new AudioContext(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .5); o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .5); } catch (e) { console.warn(' 🎮 [arcade-lobby] [chime] [failed]', e.message); } }
function render() {
  const el = document.getElementById('kids'); el.innerHTML = '';
  for (const [kid, ids] of Object.entries(map)) {
    const box = document.createElement('div'); box.className = 'kid'; box.innerHTML = `<h2>${kid === 'ila' ? 'Ila' : 'Reina'}</h2>`; const row = document.createElement('div'); row.className = 'row';
    ids.forEach((id, i) => { const b = document.createElement('button'); b.className = 'tile ' + (i ? 'b' : 'a'); const s = S(id);
      b.innerHTML = `<span class="icon">${s.plays ? OPEN[i] : ICON[i]}</span><span>GAME ${'AB'[i]}</span>${s.plays ? `<span class="plays">▶ ${s.plays}</span>` : ''}`;
      b.addEventListener('click', () => { b.classList.add('open'); chime(523); setTimeout(() => chime(784), 120); S(id).plays++; store.set('cookoff-kids-stats', stats); store.set('cookoff-kids-last', { kid, id, letter: 'AB'[i] }); log('[launch]', kid, 'AB'[i]);
        setTimeout(() => location.href = `entries/${id}/index.html`, 500); });
      row.append(b); });
    box.append(row); el.append(box);
  }
  document.getElementById('parent').textContent = Object.entries(map).map(([k, ids]) => ids.map((id, i) => `${k} ${'AB'[i]}: ▶${S(id).plays} ${S(id).ratings.join('')}`).join('   ')).join('\n');
}
// coming back from a game: one quick face rating, no reading needed
const last = store.get('cookoff-kids-last', null);
if (last) { const r = document.getElementById('rate'); document.getElementById('rateQ').textContent = `GAME ${last.letter}?`; r.classList.add('show');
  ['😍', '🙂', '😐'].forEach(f => { const b = document.createElement('button'); b.className = 'face'; b.textContent = f; b.addEventListener('click', () => { S(last.id).ratings.push(f); store.set('cookoff-kids-stats', stats); store.set('cookoff-kids-last', null); r.classList.remove('show'); log('[rated]', last.kid, last.letter, f); render(); }); document.getElementById('faces').append(b); }); }
render();
</script></body></html>
